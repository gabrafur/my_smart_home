<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Self-hosted Smart Home Platform</title>
  <desc id="desc">Synthetic social preview for an event-driven smart-home engineering portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061327"/>
      <stop offset="0.55" stop-color="#092846"/>
      <stop offset="1" stop-color="#06343c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58d7ef"/><stop offset="1" stop-color="#56e1b0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#76b9dd" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1030" cy="322" r="230" fill="#0e7591" opacity="0.08"/>

  <g font-family="DejaVu Sans,Arial,sans-serif" fill="#f4fbff">
    <text x="74" y="180" font-size="24" font-weight="700" letter-spacing="4" fill="#62ddec">ENGINEERING PORTFOLIO</text>
    <text x="70" y="252" font-size="58" font-weight="700">Self-hosted</text>
    <text x="70" y="316" font-size="58" font-weight="700">Smart Home Platform</text>
    <rect x="72" y="350" width="390" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="74" y="404" font-size="25" fill="#bed6e4">Home Assistant · Node-RED · MQTT · Zigbee · Docker</text>
    <text x="74" y="446" font-size="22" fill="#8fb4c8">Security · Observability · Recovery · Local AI</text>
  </g>

  <g transform="translate(788 112)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 208V112l154-96 154 96v236H52z" fill="#0a3658" stroke="#59d8ed" stroke-width="6"/>
    <path d="M20 126L206 8l186 118" fill="none" stroke="#6ae1f1" stroke-width="12"/>
    <rect x="176" y="234" width="72" height="114" rx="8" fill="#09253e" stroke="#4bbad6" stroke-width="4"/>
    <circle cx="230" cy="290" r="5" fill="#ffc76b" stroke="none"/>
    <g fill="#0b5371" stroke="#6ce7df" stroke-width="4">
      <rect x="88" y="158" width="62" height="62" rx="10"/>
      <rect x="268" y="158" width="62" height="62" rx="10"/>
    </g>
    <g stroke="#55dced" stroke-width="5" fill="none" filter="url(#glow)">
      <path d="M-48 184H88"/><path d="M330 184h112"/>
      <path d="M-20 286H84c48 0 44-62 92-62"/>
      <path d="M248 224c52 0 48 86 122 86h72"/>
    </g>
    <g fill="#56e1b0" stroke="none">
      <circle cx="-48" cy="184" r="9"/><circle cx="442" cy="184" r="9"/>
      <circle cx="-20" cy="286" r="9"/><circle cx="442" cy="310" r="9"/>
    </g>
    <g transform="translate(122 368)">
      <path d="M84 0l68 28v56c0 48-28 88-68 108C44 172 16 132 16 84V28z" fill="#0b4d63" stroke="#61e0d3" stroke-width="5"/>
      <path d="M50 90l22 22 48-58" fill="none" stroke="#a0ffe8" stroke-width="10"/>
    </g>
  </g>
</svg>
