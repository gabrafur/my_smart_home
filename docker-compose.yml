x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  portainer:
    logging: *default-logging
    image: portainer/portainer-ce@sha256:3fa8750ac2b98ce56784ca292df1adc3ec38f0062fd572811ea4b2221beee310
    container_name: portainer
    restart: always
    ports:
      - "${HOST_LAN_IP:-127.0.0.1}:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer:/data

  mosquitto:
    logging: *default-logging
    image: eclipse-mosquitto@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: mosquitto
    restart: always
    ports:
      - "${HOST_LAN_IP:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  homeassistant:
    logging: *default-logging
    image: ghcr.io/home-assistant/home-assistant@sha256:14931c6b13756317849f46da1d01b45937a1150db66c081cfe529d48215943fe
    container_name: homeassistant
    restart: always
    network_mode: host
    # Keep cloud-backed integrations working even when the host resolver is
    # populated after Docker creates this long-running container.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; socket.getaddrinfo('home-assistant.io', 443); socket.create_connection(('127.0.0.1', 8123), 5).close()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - mosquitto
    volumes:
      - ./homeassistant:/config
      - ./bindings/private:/run/private-bindings:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /usr/bin/vcgencmd:/usr/bin/vcgencmd:ro
      - /run/dbus:/run/dbus:ro
      - ./.local-state/docs-review:/run/docs-review:ro
      - ./.local-state/docs-review-trigger:/run/docs-review-trigger
      - ./scripts/request-weekly-docs-review.sh:/config/request-weekly-docs-review.sh:ro
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - PI_HEALTH_PROC_ROOT=/host/proc
      - PI_HEALTH_SYS_ROOT=/host/sys
      - PI_HEALTH_OS_RELEASE=/host/etc/os-release

  matter_server:
    logging: *default-logging
    # Legacy Python controller retained for the existing fabric. It is pinned
    # because the upstream `stable` tag is mutable; see docs/CONTAINERS.md.
    image: ghcr.io/home-assistant-libs/python-matter-server@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
    container_name: matter_server
    restart: always
    network_mode: host
    security_opt:
      - apparmor=unconfined
    command:
      - --storage-path
      - /data
      - --paa-root-cert-dir
      - /data/credentials
      - --listen-address
      - 127.0.0.1
    volumes:
      - ./matter-server:/data
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ:-America/Sao_Paulo}

  appdaemon:
    logging: *default-logging
    image: acockburn/appdaemon@sha256:cabcb3a4e739db2572ecb8dc3cee685300ab27274efda83a6d8ce4d3988dc647
    container_name: appdaemon
    restart: always
    network_mode: host
    volumes:
      - ./appdaemon:/conf
      - ./templates/appdaemon/appdaemon.yaml:/conf/appdaemon.yaml:ro
      - ./.local-secrets/appdaemon-secrets.yaml:/conf/secrets.yaml:ro
    environment:
      - TZ=${TZ:-America/Sao_Paulo}

  nodered:
    logging: *default-logging
    image: nodered/node-red@sha256:10f40d0a83e7e5852b13d4d472b2006b05b1cca6d55e2f29a55a12c25a630cb6
    container_name: nodered
    restart: always
    command: ["/bin/sh", "/data/tools/start-node-red.sh"]
    depends_on:
      - mosquitto
      - homeassistant
    # Os bindings privados permanecem 0640 no host. O grupo suplementar
    # permite que o processo node-red (UID/GID 1000 na imagem) leia o volume
    # somente leitura sem tornar os arquivos acessiveis a todos os usuarios.
    group_add:
      - "${PRIVATE_BINDINGS_GID:-1001}"
    ports:
      - "${HOST_LAN_IP:-127.0.0.1}:1880:1880"
    volumes:
      - ./homeassistant/.git-backup-trigger:/run/git-backup-trigger
      - ./homeassistant/.storage-maintenance-trigger:/run/storage-maintenance-trigger
      - ./scripts/request-host-git-backup.sh:/opt/request-host-git-backup.sh:ro
      - ./scripts/request-host-storage-maintenance.sh:/opt/request-host-storage-maintenance.sh:ro
      - ./nodered:/data
      - ./bindings/private:/run/private-bindings:ro
      - ./scripts/storage-health-maintenance.sh:/opt/storage-health-maintenance.sh:ro
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - NODE_RED_ADMIN_USER=${NODE_RED_ADMIN_USER:-admin}
      - NODE_RED_ADMIN_PASSWORD_HASH=${NODE_RED_ADMIN_PASSWORD_HASH:-}
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:-}
      - HOME_LAT=${HOME_LAT:-}
      - HOME_LON=${HOME_LON:-}
      - GATE_LAT=${GATE_LAT:-}
      - GATE_LON=${GATE_LON:-}

  zigbee2mqtt:
    logging: *default-logging
    image: koenkk/zigbee2mqtt@sha256:4fb4db4d49a217bed6d0204f454ce809febc565bbe051b85c556ee2bcef73d8c
    container_name: zigbee2mqtt
    restart: always
    depends_on:
      - mosquitto
    ports:
      - "${HOST_LAN_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ./zigbee2mqtt:/app/data
    environment:
      - TZ=${TZ:-America/Sao_Paulo}

  ai-bridge:
    logging: *default-logging
    build:
      context: ./ia-bridge
    container_name: ai-bridge
    restart: always
    # Docker's embedded resolver keeps service discovery on 127.0.0.11 and
    # forwards public lookups to these explicit upstream resolvers.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    group_add:
      # Numeric group that owns /var/run/docker.sock on the host.
      - "${DOCKER_GID:-999}"
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      # Preserve the historical physical volume name; it stores Claude CLI
      # authentication and is independent of the service rename to ai-bridge.
      - claude-bridge-auth:/home/node/.claude
      - codex-bridge-auth:/home/node/.codex
      # Read-only telemetry source for Codex sessions started outside the
      # Home Assistant chat. Only aggregated token metadata leaves the bridge.
      - ${CODEX_HOST_SESSIONS_DIR:-/home/replace_with_host_user/.codex/sessions}:/host-codex-sessions:ro
      # Canonical metadata-only Local AI telemetry shared by both MCP clients.
      - ${CODEX_LOCAL_AI_STATE_DIR:-./.agent-history}:/local-ai-state
      # The bridge starts the same reviewed global MCP runtime as the host.
      - ${CODEX_LOCAL_AI_RUNTIME_DIR:-/home/replace_with_host_user/.local/share/codex-local-ai/current}:/opt/codex-local-ai:ro
    environment:
      - WORKDIR=/workspace
      - HISTORY_DIR=/workspace/.agent-history
      # Machine-local Ollama routing persists in the Codex auth volume, rather
      # than in the image or repository.
      - LOCAL_AI_CONFIG=/home/node/.codex/local-ai.json
      - LOCAL_AI_MCP_RUNTIME_DIR=/opt/codex-local-ai
      - LOCAL_AI_TELEMETRY_PATH=/local-ai-state/local-ai-telemetry.json
      - LOCAL_AI_STRUCTURED_EXTRACTION_EVENTS_PATH=/local-ai-state/structured-extraction-canary-events.jsonl
      - LOCAL_AI_STRUCTURED_EXTRACTION_BREAKER_PATH=/local-ai-state/structured-extraction-canary-breaker.json
      - LOCAL_AI_STRUCTURED_EXTRACTION_SUMMARY_PATH=/local-ai-state/structured-extraction-canary-summary.json
      - LOCAL_AI_STRUCTURED_EXTRACTION_RUNTIME_PATH=/local-ai-state/structured-extraction-canary-runtime.json
      # Public defaults stay fail-closed; machine-local .env activates only
      # the approved residual structured-extraction canary.
      - LOCAL_AI_QUALITY_PIPELINE_ENABLED=${LOCAL_AI_QUALITY_PIPELINE_ENABLED:-0}
      - LOCAL_AI_STRUCTURED_EXTRACTION_ENABLED=${LOCAL_AI_STRUCTURED_EXTRACTION_ENABLED:-0}
      - LOCAL_AI_STRUCTURED_EXTRACTION_ROLLOUT_PERCENT=${LOCAL_AI_STRUCTURED_EXTRACTION_ROLLOUT_PERCENT:-0}
      - LOCAL_AI_SUMMARIZE_LOG_ENABLED=${LOCAL_AI_SUMMARIZE_LOG_ENABLED:-0}
      - LOCAL_AI_RETRIEVAL_ENABLED=${LOCAL_AI_RETRIEVAL_ENABLED:-0}
      - LOCAL_AI_RERANKER_ENABLED=${LOCAL_AI_RERANKER_ENABLED:-0}
      - LOCAL_AI_ERROR_SIMILARITY_ENABLED=${LOCAL_AI_ERROR_SIMILARITY_ENABLED:-0}
      - LOCAL_AI_STATUS_PATH=/workspace/.agent-history/local-ai-status.json
      - LOCAL_AI_BENCHMARK_PATH=/workspace/docs/benchmarks/local-ai-high-potential/latest.json
      - CODEX_SESSIONS_DIRS=/home/node/.codex/sessions,/host-codex-sessions
      # Metadata-only account read through Codex app-server. It does not start
      # a model turn or consume plan credits.
      - CODEX_RATE_LIMIT_REFRESH_MS=30000
      - TZ=${TZ:-America/Sao_Paulo}
      # AI_BRIDGE_TOKEN is canonical; the old key is a migration fallback only.
      - BRIDGE_TOKEN=${AI_BRIDGE_TOKEN:-${CLAUDE_BRIDGE_TOKEN:-}}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Keep this explicit: an older value in the private .env must not reduce
      # the request window and reintroduce five-minute chat timeouts.
      - BRIDGE_TIMEOUT_MS=900000
      # Auth comes from the CLAUDE_CODE_OAUTH_TOKEN in .env (generated once via
      # `claude setup-token`, tied to the subscription plan), not API-key
      # billing - unset any ANTHROPIC_API_KEY inherited from .env so the CLI
      # doesn't try the API-key path instead.
      - ANTHROPIC_API_KEY=
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD-SHELL", "getent hosts chatgpt.com >/dev/null && curl -fsS http://127.0.0.1:8099/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  docs-review-scheduler:
    logging: *default-logging
    # Separate process, same pinned agent toolchain. It has no published port
    # and runs Codex only at the configured weekly UTC window.
    build:
      context: ./ia-bridge
    container_name: docs-review-scheduler
    profiles: ["automation"]
    restart: always
    # This is a live smart-home host. Repository maintenance must remain below
    # SSH and residential workloads and be killed before it can exhaust them.
    cpus: "1.0"
    cpu_shares: 256
    mem_limit: 1536m
    mem_reservation: 256m
    pids_limit: 256
    oom_score_adj: 500
    user: "0:0"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./.local-state/docs-review:/run/docs-review
      - ./.local-state/docs-review-trigger:/run/docs-review-trigger
      - codex-bridge-auth:/scheduler-auth/codex:ro
      - ${WEEKLY_DOCS_REVIEW_SSH_KEY:-/dev/null}:/scheduler-auth/id_ed25519:ro
      - ${WEEKLY_DOCS_REVIEW_KNOWN_HOSTS:-/dev/null}:/scheduler-auth/known_hosts:ro
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - WEEKLY_DOCS_REVIEW_DAY_UTC=${WEEKLY_DOCS_REVIEW_DAY_UTC:-1}
      - WEEKLY_DOCS_REVIEW_HOUR_UTC=${WEEKLY_DOCS_REVIEW_HOUR_UTC:-6}
      - WEEKLY_DOCS_REVIEW_MINUTE_UTC=${WEEKLY_DOCS_REVIEW_MINUTE_UTC:-0}
      - WEEKLY_DOCS_REVIEW_BRANCH=${WEEKLY_DOCS_REVIEW_BRANCH:-main}
      - WEEKLY_DOCS_REVIEW_REMOTE=${WEEKLY_DOCS_REVIEW_REMOTE:-origin}
      - WEEKLY_DOCS_REVIEW_TIMEOUT_MS=${WEEKLY_DOCS_REVIEW_TIMEOUT_MS:-10800000}
      - WEEKLY_DOCS_REVIEW_STATUS_PATH=/run/docs-review/status.json
      - WEEKLY_DOCS_REVIEW_TRIGGER_PATH=/run/docs-review-trigger/manual-trigger
      - REPO_UID=${REPO_UID:-1000}
      - REPO_GID=${REPO_GID:-1000}
    entrypoint: ["/bin/sh", "/workspace/scripts/weekly-docs-review-entrypoint.sh"]
    command: ["node", "scripts/weekly-docs-review.mjs"]

volumes:
  claude-bridge-auth:
  codex-bridge-auth:
