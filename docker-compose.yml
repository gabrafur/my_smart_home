services:

  portainer:
    image: portainer/portainer-ce@sha256:f6bc23d1695530a609563fd65c180aaafec0fc02e019d5fc63d16b6fbe83addd
    container_name: portainer
    restart: always
    ports:
      - "${HOST_LAN_IP:-127.0.0.1}:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer:/data

  mosquitto:
    image: eclipse-mosquitto@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: mosquitto
    restart: always
    ports:
      - "${HOST_LAN_IP:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant@sha256:5a531753cea96444200158fc2b0ac7ccd739291ec50414877b396de6e0bb29b3
    container_name: homeassistant
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - mosquitto
      - matter_server
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /usr/bin/vcgencmd:/usr/bin/vcgencmd:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=America/Sao_Paulo
      - PI_HEALTH_PROC_ROOT=/host/proc
      - PI_HEALTH_SYS_ROOT=/host/sys
      - PI_HEALTH_OS_RELEASE=/host/etc/os-release

  matter_server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter_server
    restart: always
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./matter-server:/data
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=America/Sao_Paulo

  appdaemon:
    image: acockburn/appdaemon@sha256:cabcb3a4e739db2572ecb8dc3cee685300ab27274efda83a6d8ce4d3988dc647
    container_name: appdaemon
    restart: always
    network_mode: host
    volumes:
      - ./appdaemon:/conf
    environment:
      - TZ=America/Sao_Paulo

  nodered:
    image: nodered/node-red@sha256:10f40d0a83e7e5852b13d4d472b2006b05b1cca6d55e2f29a55a12c25a630cb6
    container_name: nodered
    restart: always
    depends_on:
      - mosquitto
      - homeassistant
    env_file:
      - ./.env
    ports:
      - "${HOST_LAN_IP:-127.0.0.1}:1880:1880"
    volumes:
      - ./nodered:/data
    environment:
      - TZ=America/Sao_Paulo

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt@sha256:4fb4db4d49a217bed6d0204f454ce809febc565bbe051b85c556ee2bcef73d8c
    container_name: zigbee2mqtt
    restart: always
    depends_on:
      - mosquitto
    ports:
      - "${HOST_LAN_IP:-127.0.0.1}:8080:8080"
    volumes:
      - /mnt/data/docker/zigbee2mqtt:/app/data
    environment:
      - TZ=America/Sao_Paulo

  claude-bridge:
    build:
      context: ./claude-bridge
      args:
        DOCKER_GID: "987"
    container_name: claude-bridge
    restart: always
    volumes:
      - /mnt/data/docker:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - claude-bridge-auth:/home/node/.claude
      - codex-bridge-auth:/home/node/.codex
    env_file:
      - ./.env
    environment:
      - WORKDIR=/workspace
      - HISTORY_DIR=/workspace/.agent-history
      - TZ=America/Sao_Paulo
      - BRIDGE_TOKEN=${CLAUDE_BRIDGE_TOKEN}
      # Auth comes from the CLAUDE_CODE_OAUTH_TOKEN in .env (generated once via
      # `claude setup-token`, tied to the subscription plan), not API-key
      # billing - unset any ANTHROPIC_API_KEY inherited from .env so the CLI
      # doesn't try the API-key path instead.
      - ANTHROPIC_API_KEY=
    ports:
      - "127.0.0.1:8099:8099"

volumes:
  claude-bridge-auth:
  codex-bridge-auth:
