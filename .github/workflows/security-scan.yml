name: security-scan

# Este repositorio e publico e espelha a configuracao de uma casa real.
# O objetivo deste workflow e um so: falhar se algum segredo ou pedaco de
# estado privado escapar para um arquivo rastreado.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Auditoria de segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A auditoria olha o conteudo rastreado da revisao atual; nao precisa
          # do historico completo (ver a secao "Historico" no README).
          fetch-depth: 1
          persist-credentials: false

      - name: Rodar scripts/security-scan.sh
        run: bash scripts/security-scan.sh

  syntax:
    name: Sintaxe de YAML / JSON / Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validar JSON rastreado
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "JSON invalido: $f"; fail=1; }
          done < <(git ls-files '*.json')
          exit $fail

      - name: Validar YAML rastreado
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, sys, yaml

          # As tags proprias do Home Assistant (!secret, !include, ...) nao sao
          # YAML padrao. Registramos um construtor generico para que o parser
          # valide a ESTRUTURA do arquivo sem tentar resolver os segredos —
          # que, por definicao, nao existem no runner de CI.
          class HALoader(yaml.SafeLoader):
              pass

          HALoader.add_multi_constructor("!", lambda loader, suffix, node: None)

          files = subprocess.run(
              ["git", "ls-files", "*.yaml", "*.yml"],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          failed = []
          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      list(yaml.load_all(fh, Loader=HALoader))
              except yaml.YAMLError as exc:
                  failed.append(f"{f}: {exc}")

          for line in failed:
              print(line)
          sys.exit(1 if failed else 0)
          PY

      - name: Validar docker-compose.yml
        run: |
          # O compose faz interpolacao de ${...} a partir do .env, que nunca e
          # versionado. O .env.example existe justamente para dar a CI um
          # conjunto completo de chaves e permitir validar a estrutura.
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Validar documentacao e memoria publica
        run: |
          make validate-public
          node --test scripts/docker-auto-update.test.mjs
          bash -n scripts/storage-maintenance.sh
          sh -n scripts/storage-health-maintenance.sh
          sh -n scripts/weekly-docs-review-entrypoint.sh

      - name: Validar fluxos Node-RED
        run: |
          npm --prefix nodered ci
          npm --prefix nodered run flows:validate
          node --check nodered/settings.js
          npm --prefix nodered run test:all

      - name: Testar bridge
        run: npm --prefix claude-bridge test
