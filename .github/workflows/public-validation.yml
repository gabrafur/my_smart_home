name: public-validation

# push covers main (direct and automated pushes); pull_request covers every
# branch through its merge result, so a PR branch is not validated twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Canonical public validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            nodered/package-lock.json
            validation/package-lock.json

      # Same interpreter as the Raspberry host (Debian trixie); ubuntu-latest moved to 3.14.
      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic Chrome for layout checks
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Run canonical validation
        run: make validate-public
        env:
          CODEX_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CODEX_CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
