name: public-validation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Canonical public validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            nodered/package-lock.json
            validation/package-lock.json

      - name: Install deterministic Chrome for layout checks
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Run canonical validation
        run: make validate-public
        env:
          CODEX_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CODEX_CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
