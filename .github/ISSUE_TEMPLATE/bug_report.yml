name: Bug report / Relato de bug
description: Report a reproducible problem using synthetic or sanitized data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private addresses, coordinates, device IDs, resident data, or real logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Problema
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction / Reprodução sintética
      description: Minimal steps and sanitized fixtures only.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision / Revisão
      placeholder: Commit SHA or release
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation / Validação
      description: Relevant command results without private output.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / Confirmação de privacidade
      options:
        - label: I removed credentials, household data, private runtime, and real logs.
          required: true
        - label: This is not a security vulnerability.
          required: true
