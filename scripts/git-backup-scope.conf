# Scope of the automated nightly backup.
#
# The backup exists to publish state written by the running services (Home
# Assistant, Node-RED, Zigbee2MQTT, update workers). Paths below are written by
# interactive authors, who publish their own finished work. Changes found
# there are left in the working tree, untouched and unstaged, and the backup
# of everything else continues.
#
#   defer <path prefix or file>   leave staged changes there to their author
#   keep  <path>                  worker-written file inside a deferred prefix
defer scripts/
defer docs/
defer .codex/
defer .agents/
defer .github/
defer .githooks/
defer AGENTS.md
defer CLAUDE.md
defer MEMORY.md
defer README.md
defer README.pt-BR.md
defer CONTRIBUTING.md
defer SECURITY.md
defer Makefile
keep scripts/alexa-media-upstream.json
keep scripts/kia-uvo-upstream.json
