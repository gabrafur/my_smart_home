version: 5
mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883
  user: CHANGE_ME
  password: CHANGE_ME
serial:
  # RFC 5737 example address. Replace with the coordinator host or use a
  # stable /dev/serial/by-id path for a local USB adapter.
  port: tcp://192.0.2.10:6638
  baudrate: 115200
  adapter: zstack
  disable_led: false
advanced:
  log_level: info
  channel: 26
  transmit_power: 20
  # For a NEW network only. Restore the original values for an existing one;
  # changing any of them can require pairing every device again.
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
frontend:
  enabled: true
  port: 8080
homeassistant:
  enabled: true
onboarding: false
permit_join: false
