# Tema "casa": neutros frios, azul como cor da interface e latão para
# o que está aceso. Verde, âmbar e vermelho ficam reservados a estados
# (seguro, atenção, falha). Os modos claro e escuro seguem o dispositivo.
casa:
  ha-card-border-radius: "16px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "0 1px 2px rgba(16, 24, 40, 0.06)"
  modes:
    light:
      primary-color: "#2b5f8a"
      accent-color: "#2b5f8a"
      primary-background-color: "#eef1f5"
      secondary-background-color: "#f5f7fa"
      lovelace-background: "#eef1f5"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      primary-text-color: "#1b2330"
      secondary-text-color: "#5f6b7a"
      divider-color: "#e0e5ec"
      sidebar-background-color: "#f7f9fb"
      sidebar-selected-icon-color: "#2b5f8a"
      sidebar-selected-text-color: "#2b5f8a"
      app-header-background-color: "#eef1f5"
      app-header-text-color: "#1b2330"
      state-icon-color: "#5f6b7a"
      state-active-color: "#c9952f"
      state-switch-on-color: "#c9952f"
      state-light-on-color: "#c9952f"
      state-input_boolean-on-color: "#2b5f8a"
      state-climate-cool-color: "#2b8fc4"
      state-climate-dry-color: "#c9952f"
      state-climate-fan_only-color: "#2b8fc4"
      state-lock-locked-color: "#2f855a"
      state-lock-unlocked-color: "#b7791f"
      state-person-home-color: "#2f855a"
      state-device_tracker-home-color: "#2f855a"
      state-alarm_control_panel-disarmed-color: "#2f855a"
      state-binary_sensor-connectivity-on-color: "#2f855a"
      success-color: "#2f855a"
      warning-color: "#b7791f"
      error-color: "#c0392b"
      info-color: "#2b5f8a"
    dark:
      primary-color: "#7fb2e0"
      accent-color: "#7fb2e0"
      primary-background-color: "#11151b"
      secondary-background-color: "#1a2029"
      lovelace-background: "#11151b"
      card-background-color: "#1a2029"
      ha-card-background: "#1a2029"
      primary-text-color: "#e6ebf2"
      secondary-text-color: "#98a4b4"
      divider-color: "#29313d"
      sidebar-background-color: "#151a21"
      sidebar-selected-icon-color: "#7fb2e0"
      sidebar-selected-text-color: "#7fb2e0"
      app-header-background-color: "#11151b"
      app-header-text-color: "#e6ebf2"
      state-icon-color: "#98a4b4"
      state-active-color: "#e0b057"
      state-switch-on-color: "#e0b057"
      state-light-on-color: "#e0b057"
      state-input_boolean-on-color: "#7fb2e0"
      state-climate-cool-color: "#6cc4e6"
      state-climate-dry-color: "#e0b057"
      state-climate-fan_only-color: "#6cc4e6"
      state-lock-locked-color: "#5cbf8a"
      state-lock-unlocked-color: "#e3a646"
      state-person-home-color: "#5cbf8a"
      state-device_tracker-home-color: "#5cbf8a"
      state-alarm_control_panel-disarmed-color: "#5cbf8a"
