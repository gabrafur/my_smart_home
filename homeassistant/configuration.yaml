
# Loads default set of integrations. Do not remove.
default_config:

# Enables wake_on_lan.send_magic_packet, used by automations that wake
# devices (e.g. TV Sala) explicitly now that implicit WOL is deprecated.
wake_on_lan:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes


homeassistant:
  packages: !include_dir_named packages

# Optional role adapter. An empty/missing private binding file is fail-closed:
# public role entities stay unavailable and no residential action is emitted.
public_bindings:
  path: /run/private-bindings/private-bindings.json

# Keep the native /map dashboard aligned with the explicit consolidated map.
consolidated_map:
  path: dashboards/location.yaml

lovelace:
  # Load custom cards through Lovelace's resource registry so the dashboard
  # waits for the module before instantiating the card. The version is the first
  # 12 characters of the asset's SHA-256 and is enforced by a regression test.
  resource_mode: yaml
  resources:
    - url: /local/codex-chat-card-v2.js?v=9abb539b80c1
      type: module
  dashboards:
    chat-assistants:
      mode: yaml
      title: Chat
      icon: mdi:chat-processing
      show_in_sidebar: true
      filename: dashboards/chat.yaml
    # Preserve the existing public route: changing this key changes the
    # dashboard URL, so `/creta-viagens` would otherwise become a 404.
    creta-viagens:
      mode: yaml
      title: Creta
      icon: mdi:car
      show_in_sidebar: true
      filename: dashboards/vehicle_primary.yaml
    painel-casa:
      mode: yaml
      title: Casa
      icon: mdi:home-variant-outline
      show_in_sidebar: true
      filename: dashboards/casa.yaml
    # English copies generated by scripts/dashboard-i18n.mjs for the admin,
    # whose profile is in English. require_admin keeps them out of the
    # Portuguese-speaking residents' sidebar; each admin hides the copy in the
    # language they do not use (docs/DASHBOARDS.md).
    casa-en:
      mode: yaml
      title: Home
      icon: mdi:home-variant-outline
      show_in_sidebar: true
      require_admin: true
      filename: dashboards/en/casa.yaml
    creta-en:
      mode: yaml
      title: Creta
      icon: mdi:car
      show_in_sidebar: true
      require_admin: true
      filename: dashboards/en/vehicle_primary.yaml
    # Maintenance: house status, Raspberry Pi health and Codex/RTX usage in a
    # single admin-only dashboard. Source: dashboards/sistema.yaml (Portuguese);
    # the registered file is its generated English copy.
    painel-sistema:
      mode: yaml
      title: System
      icon: mdi:server-network
      show_in_sidebar: true
      require_admin: true
      filename: dashboards/en/sistema.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
