
# Loads default set of integrations. Do not remove.
default_config:

# Enables wake_on_lan.send_magic_packet, used by automations that wake
# devices (e.g. TV Sala) explicitly now that implicit WOL is deprecated.
wake_on_lan:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/codex-chat-card.js?v=1


homeassistant:
  packages: !include_dir_named packages

lovelace:
  dashboards:
    chat-assistants:
      mode: yaml
      title: Chat
      icon: mdi:chat-processing
      show_in_sidebar: true
      filename: dashboards/chat.yaml
    creta-viagens:
      mode: yaml
      title: Creta
      icon: mdi:car
      show_in_sidebar: true
      filename: dashboards/creta.yaml
    raspberry-pi-system-health:
      mode: yaml
      title: Raspberry Pi - System Health
      icon: mdi:raspberry-pi
      show_in_sidebar: true
      filename: dashboards/raspberry_pi_health.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
