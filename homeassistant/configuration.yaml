
# Loads default set of integrations. Do not remove.
default_config:

# Enables wake_on_lan.send_magic_packet, used by automations that wake
# devices (e.g. TV Sala) explicitly now that implicit WOL is deprecated.
wake_on_lan:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes


homeassistant:
  packages: !include_dir_named packages

# Optional role adapter. An empty/missing private binding file is fail-closed:
# public role entities stay unavailable and no residential action is emitted.
public_bindings:
  path: /run/private-bindings/private-bindings.json

# Keep the native /map dashboard aligned with the explicit consolidated map.
consolidated_map:
  path: dashboards/location.yaml

lovelace:
  # Load custom cards through Lovelace's resource registry so the dashboard
  # waits for the module before instantiating the card. The version is the first
  # 12 characters of the asset's SHA-256 and is enforced by a regression test.
  resource_mode: yaml
  resources:
    - url: /local/codex-chat-card-v2.js?v=a4284ee80630
      type: module
  dashboards:
    chat-assistants:
      mode: yaml
      title: Chat
      icon: mdi:chat-processing
      show_in_sidebar: true
      filename: dashboards/chat.yaml
    # Preserve the existing public route: changing this key changes the
    # dashboard URL, so `/creta-viagens` would otherwise become a 404.
    creta-viagens:
      mode: yaml
      title: Creta
      icon: mdi:car
      show_in_sidebar: true
      filename: dashboards/vehicle_primary.yaml
    raspberry-pi-system-health:
      mode: yaml
      title: Raspberry Pi - System Health
      icon: mdi:raspberry-pi
      show_in_sidebar: true
      filename: dashboards/raspberry_pi_health.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
