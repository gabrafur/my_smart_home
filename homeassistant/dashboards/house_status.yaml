title: Placar da casa
views:
  - title: Placar
    path: house-status
    icon: mdi:home-heart
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Servidor
            icon: mdi:raspberry-pi
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.raspberry_pi_health
                name: Saúde geral
              - entity: sensor.raspberry_pi_load_5m
                name: Carga (5 min)
              - entity: sensor.raspberry_pi_memory_usage
                name: Memória usada (%)
              - entity: sensor.raspberry_pi_storage_usage
                name: Disco usado (%)
              - entity: sensor.raspberry_pi_cpu_temperature
                name: Temperatura
              - entity: sensor.raspberry_pi_uptime
                name: Uptime (dias)
      - type: grid
        cards:
          - type: heading
            heading: Rede e integrações
            icon: mdi:lan-connect
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.internet_connection
                name: Internet
              - entity: binary_sensor.vpn_primary_connection
                name: VPN
              - entity: binary_sensor.zigbee_network
                name: Rede Zigbee
              - entity: binary_sensor.tuya_devices
                name: Dispositivos Tuya
              - entity: input_boolean.nodered_runtime_incident
                name: Incidente no Node-RED
      - type: grid
        cards:
          - type: heading
            heading: Backup e atualizações
            icon: mdi:backup-restore
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.backup_last_successful_automatic_backup
                name: Último backup do HA
              - entity: sensor.backup_next_scheduled_automatic_backup
                name: Próximo backup do HA
              - entity: update.alexa_media_player_update
                name: Alexa Media
              - entity: update.kia_uvo_hyundai_bluelink_update
                name: Kia / Bluelink
              - entity: update.moni_mobile_alarm_update
                name: Alarme Moni
              - entity: update.slzb_mrw10u_zigbee_firmware
                name: Firmware Zigbee
      - type: grid
        cards:
          - type: heading
            heading: Cópias e restauração
            icon: mdi:database-check
          # Three separate results: a Git or offsite success never implies a tested restore.
          # Freshness comes classified from backup_results_status.py; nothing is computed here.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.backup_result_git
                name: Cópia no Git
              - type: attribute
                entity: sensor.backup_result_git
                attribute: freshness
                name: Cópia no Git — frescor do dado
              - type: attribute
                entity: sensor.backup_result_git
                attribute: last_attempt_at
                name: Cópia no Git — última tentativa (idade)
                format: relative
              - type: attribute
                entity: sensor.backup_result_git
                attribute: last_confirmed_at
                name: Cópia no Git — última confirmação
                format: relative
              - entity: sensor.backup_result_offsite
                name: Cópia externa
              - type: attribute
                entity: sensor.backup_result_offsite
                attribute: freshness
                name: Cópia externa — frescor do dado
              - type: attribute
                entity: sensor.backup_result_offsite
                attribute: last_attempt_at
                name: Cópia externa — última tentativa (idade)
                format: relative
              - type: attribute
                entity: sensor.backup_result_offsite
                attribute: last_confirmed_at
                name: Cópia externa — última confirmação
                format: relative
              - entity: sensor.backup_result_restore
                name: Restauração testada
              - type: attribute
                entity: sensor.backup_result_restore
                attribute: freshness
                name: Restauração testada — frescor do dado
              - type: attribute
                entity: sensor.backup_result_restore
                attribute: last_attempt_at
                name: Restauração testada — última tentativa (idade)
                format: relative
              - type: attribute
                entity: sensor.backup_result_restore
                attribute: last_confirmed_at
                name: Restauração testada — última confirmação
                format: relative
      - type: grid
        cards:
          - type: heading
            heading: Segurança
            icon: mdi:shield-home
          - type: entities
            show_header_toggle: false
            entities:
              # Status only: no row may expose arm/disarm or lock/unlock, even by an accidental tap.
              - type: simple-entity
                entity: alarm_control_panel.security_panel
                name: Alarme
                tap_action:
                  action: none
              - type: simple-entity
                entity: lock.vehicle_primary_door_lock
                name: Trava do carro
                tap_action:
                  action: none
      - type: grid
        cards:
          - type: heading
            heading: Baterias
            icon: mdi:battery-heart-variant
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.botao_portao_garagem_battery
                name: Botão do portão
              - entity: sensor.controlador_ir_battery
                name: Controlador IR
              - entity: sensor.lds_robot_battery
                name: Aspirador
