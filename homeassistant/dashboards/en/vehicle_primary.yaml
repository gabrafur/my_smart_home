  - title: Details
    path: detalhes
    icon: mdi:car-info
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Trips and consumption
            icon: mdi:map-marker-path
          - type: markdown
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %} {% set trips = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'trips') or [] %} {% set efficiency = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'fuel_efficiency') or {} %} {% if efficiency.data_sufficient | default(false) %} ## {{ format_number_ptbr(efficiency.km_per_l, 2) }} estimated km/L
              Effective window: {{ as_datetime(efficiency.sample_window_start).astimezone().strftime('%d/%m %H:%M') if efficiency.sample_window_start else 'unavailable' }}–{{ as_datetime(efficiency.sample_window_end).astimezone().strftime('%d/%m %H:%M') if efficiency.sample_window_end else 'unavailable' }}
              {{ format_number_ptbr(efficiency.samples_used) }} range/fuel samples · observed span of {{ format_number_ptbr(efficiency.fuel_span_percent, 1) }}%
              This is the median estimated from the range the car reports between 20% and 80% of the tank.
              Bluelink does not report liters used per trip. The values below are estimates modeled from the window average, distance and idle share of each trip. {% else %} ## Not enough data
              Window searched: up to {{ format_number_ptbr(efficiency.search_window_days | default(0)) }} days, per the available Recorder retention. The estimate needs at least 5 paired readings and a 10% change within the reliable tank range. {% endif %}
              {% if trips %} {% for trip in trips %} --- **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} · {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}{% if trip.end_time %}–{{ trip.end_time }}{% endif %}**
              {{ format_number_ptbr(trip.distance, 1) }} km · {{ format_number_ptbr(trip.duration_min) }} min · average {{ format_number_ptbr(trip.avg_speed, 1) }} km/h
              {% if trip.estimated_km_per_l is defined and trip.estimated_liters is defined %} ⛽ **{{ format_number_ptbr(trip.estimated_km_per_l, 2) }} estimated km/L** · {{ format_number_ptbr(trip.estimated_liters, 2) }} L modeled {% else %} ⛽ Per-trip estimate unavailable {% endif %} {% endfor %} {% else %} **No trips available for today and yesterday.** {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: History
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Engine and fuel · 48 hours
            hours_to_show: 48
            entities:
              - entity: binary_sensor.vehicle_primary_engine
                name: Engine
              - entity: sensor.vehicle_primary_fuel_level
                name: Fuel
          - type: history-graph
            title: Estimated consumption · 7 days
            hours_to_show: 168
            entities:
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: Estimated km/L
      - type: grid
        cards:
          - type: heading
            heading: Diagnostics
            icon: mdi:stethoscope
          - type: markdown
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %} {% set approaching_interval = state_attr('sensor.vehicle_primary_refresh_coordinator', 'approaching_interval_minutes') %} {% set away_interval = state_attr('sensor.vehicle_primary_refresh_coordinator', 'away_interval_minutes') %} {% set home_interval = state_attr('sensor.vehicle_primary_refresh_coordinator', 'home_interval_minutes') %} {% set quiet_start = state_attr('sensor.vehicle_primary_refresh_coordinator', 'quiet_start_hour') %} {% set quiet_end = state_attr('sensor.vehicle_primary_refresh_coordinator', 'quiet_end_hour') %} **Event-driven automatic refresh**
              The Bluelink server cache is checked every **15 minutes** without waking the car. If the provider rate-limits calls, polling backs off progressively up to **6 hours** without new bursts. Separately, a real wake uses **{{ format_number_ptbr(approaching_interval) }} minutes** when someone is near_home, **{{ format_number_ptbr(away_interval) }} minutes** when someone is away and **{{ format_number_ptbr(home_interval) }} minutes** in the healthy cycle when both are at home. Arrival keeps its priority even with pending data; otherwise recovery uses the away interval. An explicit provider block can still impose a longer backoff. Before repeating a wake without evidence, the flow re-reads the cache and only wakes the car if the data is still old. With both at home, automatic wakes pause between **{{ format_number_ptbr(quiet_start) }}h and {{ format_number_ptbr(quiet_end) }}h**. These five values come straight from the configurable blocks on the `contexto_vehicle_primary` canvas. The **Refresh now** button forces a wake and can move any deadline forward when there is no provider backoff.
              A cache check may republish entities without waking the car; the refresh only completes when Bluelink's own timestamp (`Última atualização`, last update) actually moves forward.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.vehicle_primary_last_updated_at
                name: State confirmed at
              - entity: sensor.vehicle_primary_last_scanned_at
                name: Cache checked at
              - entity: sensor.vehicle_primary_location_since_nodered
                name: At this location since
              - entity: sensor.garagem_vehicle_primary_recent_trip_info
                name: Trips loaded
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: Consumption baseline
              - entity: sensor.vehicle_primary_refresh_coordinator
                name: Refresh coordinator
              - entity: sensor.garagem_vehicle_primary_remote_command_status
                name: Last remote command
              - entity: sensor.integracao_vehicle_primary
                name: Integration maintenance
