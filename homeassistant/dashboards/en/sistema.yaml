                  min: 0
                  max: 100
                  severity:
                    green: 0
                    yellow: 90
                    red: 100
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.codex_uso_projetado_no_reset
                    state: unavailable
                card:
                  type: gauge
                  entity: sensor.codex_progresso_da_janela_semanal
                  name: Time elapsed in the window
                  min: 0
                  max: 100
                  severity:
                    green: 0
                    yellow: 70
                    red: 90
          - type: entities
            title: Plan and refresh
            show_header_toggle: false
            entities:
              - entity: sensor.codex_dados_de_limite
