      - type: grid
        cards:
          - type: heading
            heading: Local analysis and metrics
            icon: mdi:chart-timeline-variant
          - type: markdown
            content: These numbers describe only the sessions kept on this host. They help understand local work, but **do not represent the official plan limit**.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.codex_uso_projetado_no_reset
                above: -1
            card:
              type: entities
              title: Weekly window trend
              show_header_toggle: false
              entities:
                - entity: sensor.codex_previsao_ate_o_reset
                  name: Will it last until the reset?
                - entity: sensor.codex_ritmo_do_limite
                  name: Observed pace
                - entity: sensor.codex_uso_projetado_no_reset
                  name: Projected usage at reset
                - entity: sensor.codex_folga_projetada_no_reset
                  name: Projected headroom
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.codex_uso_projetado_no_reset
                state: unavailable
            card:
              type: markdown
              content: |-
                **Weekly window trend**
                ⏳ The projection is waiting for at least one hour of comparable observations in the same window. Until then, the fourth gauge shows only the elapsed time.
          - type: grid
            title: Recorded usage
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_sessoes_monitoradas
                name: Sessions
              - type: tile
                entity: sensor.codex_tokens_totais
                name: Total tokens
              - type: tile
                entity: sensor.codex_tokens_em_cache
                name: Cached tokens
              - type: tile
                entity: sensor.codex_tokens_de_saida
                name: Output tokens
              - type: tile
                entity: sensor.codex_velocidade_7_dias
                name: Hourly average · 7 days
          - type: markdown
            content: |-
              ## This computer's history
              This data comes only from sessions recorded **on this machine**. It is for analyzing local usage and **is not your plan's weekly balance**. The official limit is at the top of the dashboard and is checked automatically every 30 seconds.
          - type: markdown
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              ## Latest local activity

              {% set registrada_em = state_attr('sensor.codex_usage_raw', 'source_updated_at') %}
              {% set instante = as_timestamp(registrada_em, 0) | float(0) %}
              {% set idade_segundos = [0, (as_timestamp(now()) - instante) | int(0)] | max if instante > 0 else none %}
              **Last conversation recorded on this machine:**
              {% if idade_segundos is none %}
              no conversation recorded yet.
              {% elif idade_segundos < 60 %}
              just now.
              {% elif idade_segundos < 3600 %}
              {% set idade_minutos = (idade_segundos / 60) | int %}
              {{ format_number_ptbr(idade_minutos) }} minute{{ '' if idade_minutos == 1 else 's' }} ago.
              {% elif idade_segundos < 86400 %}
              {% set idade_horas = (idade_segundos / 3600) | int %}
              {{ format_number_ptbr(idade_horas) }} hour{{ '' if idade_horas == 1 else 's' }} ago.
              {% else %}
              on {{ instante | timestamp_custom('%d/%m/%Y at %H:%M', true) }}.
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Alerts and help
            icon: mdi:bell-outline
          - type: entities
            title: Alerts
            show_header_toggle: false
            entities:
              - entity: sensor.codex_nivel_de_alerta
                name: Current status
              - entity: input_boolean.codex_alertas_iphone
              - entity: input_boolean.codex_resumo_diario_iphone
              - entity: input_text.codex_ultimo_alerta_iphone
              - entity: input_datetime.codex_ultimo_alerta_iphone_em
          - type: markdown
            content: |-
              **How to read this**
              The plan limit is weekly and does not reset at the end of the day. Readings older than fifteen minutes are marked out of date and stop feeding alerts. The usage gauges keep the last known reading, explicitly labeled as such.
              The fourth chart shows a projection only after observing at least one hour of the same window. Before that, it shows only the time elapsed in the week, which needs no extrapolation.
              Cache efficiency measures reuse of input tokens; it is not balance, billing or answer quality. Usage on other computers may not appear in the local metrics.
              The official value is still at **Codex → Settings → Usage & billing**.
  - title: RTX 4070
    path: uso-rtx
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Now
            heading_style: title
            icon: mdi:expansion-card
          - type: tile
            entity: sensor.rtx_painel
            name: Local service
            grid_options:
              columns: full
            color: cyan
          - type: markdown
            content: |-
              {% set h = state_attr('sensor.rtx_painel', 'health') or {} %}
              **{{ h.get('reason', 'Waiting for the metrics producer') }}**

              Model: **{{ h.get('model') or '—' }}**
              {% if h.get('task') %}
              Current task: **{{ h.get('task') }}**
              {% endif %}

              {{ h.get('sample_reason', 'No recent sample') }}.
          - type: markdown
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set m = state_attr('sensor.rtx_painel', 'metrics') or {} %}
              {% macro number(v, d=0) %}{{ format_number_ptbr(v, d) if v is number else '—' }}{% endmacro %}
              | GPU | VRAM | Power |
              |:--:|:--:|:--:|
              | **{{ number(m.get('gpu')) }} %** | **{{ number(m.get('vram')) }} MiB** | **{{ number(m.get('power'), 1) }} W** |
          - type: heading
            heading: Context trend
            heading_style: title
            icon: mdi:chart-timeline-variant
          - type: tile
            entity: sensor.rtx_contexto_evitado_total
            name: Confirmed balance · preserved total
            grid_options:
              columns: full
            color: green
          - type: markdown
            title: Periods · UTC
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set periods = state_attr('sensor.rtx_painel', 'periods') or {} %}
              {% macro number(v) %}{{ format_number_ptbr(v) if v is number else '—' }}{% endmacro %}
              | Period | Attempts | Used | Balance · tokens |
              |:--|--:|--:|--:|
              {% for key, label in [('today', 'Today'), ('week', 'Week'), ('month', 'Month'), ('total', 'Total')] -%}
              {% set p = periods.get(key, {}) -%}
              | {{ label }} | {{ number(p.get('calls')) }} | {{ number(p.get('used')) }} | {{ number(p.get('net')) }} |
              {% endfor %}
          - type: markdown
            title: Last 7 days
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set rows = state_attr('sensor.rtx_painel', 'daily') or [] %}
              {% macro number(v) %}{{ format_number_ptbr(v) if v is number else '—' }}{% endmacro %}
              | Day · UTC | Attempts | Used | Balance · tokens |
              |:--|--:|--:|--:|
              {% for row in rows -%}
              | {{ as_timestamp(row.get('day')) | timestamp_custom('%d/%m', false) }} | {{ number(row.get('calls')) }} | {{ number(row.get('used')) }} | {{ number(row.get('net')) }} |
              {% endfor %}
