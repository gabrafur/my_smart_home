  - title: Codex
    path: uso-codex
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Official plan limit
            icon: mdi:chart-donut
          - type: markdown
            content: |
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set totals = state_attr('sensor.codex_usage_raw', 'totals') or {} %}
              {% set limite = state_attr('sensor.codex_usage_raw', 'rate_limit') or {} %}
              {% set consulta = state_attr('sensor.codex_usage_raw', 'rate_limit_refresh') or {} %}
              {% set reset_em = limite.get('resets_at') %}
              {% set janela = limite.get('window_type', 'unknown') %}
              {% if states('sensor.codex_usage_raw') == 'ok' %}
              {% if states('sensor.codex_dados_de_limite') == 'atual' and is_number(states('sensor.codex_limite_disponivel')) %}
              # {{ format_number_ptbr(states('sensor.codex_limite_disponivel')) }}% available

              **{{ format_number_ptbr(states('sensor.codex_limite_usado')) }}% used** in the plan's
              {{ 'weekly' if janela == 'weekly' else janela }} window
              {% if states('sensor.codex_plano') not in ['unknown', 'unavailable', 'desconhecido'] %}
              {{ states('sensor.codex_plano') | title }}.
              {% endif %}
              {% elif limite.get('remaining_percent') is number %}
              # Reading out of date

              Last known value: **{{ format_number_ptbr(limite.get('remaining_percent')) }}% available**.
              Check Codex → Settings → Usage & billing for the current balance.
              {% else %}
              # Waiting for data

              There is no plan limit reading yet.
              {% endif %}

              {% if reset_em %}
              **Reset:** {{ as_timestamp(reset_em) | timestamp_custom('%d/%m at %H:%M', true) }}
              {% endif %}
              {% if is_number(states('sensor.codex_atualizacao_do_limite_em')) %}
              **Next check:** in {{ format_number_ptbr(states('sensor.codex_atualizacao_do_limite_em')) }} seconds.
              {% endif %}
              {% if consulta.get('last_error') %}

              _The automatic Codex check is temporarily unavailable; these are the last data received._
              {% endif %}
              {% else %}
              # Collection unavailable

              Waiting for the first Codex CLI metric.
              {% endif %}
          - type: grid
            title: Key indicators
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.codex_limite_usado
                name: Used · last reading
                min: 0
                max: 100
                severity:
                  green: 0
                  yellow: 70
                  red: 90
              - type: gauge
                entity: sensor.codex_limite_disponivel
                name: Available · last reading
                min: 0
                max: 100
                severity:
                  red: 0
                  yellow: 10
                  green: 30
              - type: gauge
                entity: sensor.codex_eficiencia_de_cache
                name: Cache efficiency · local
                min: 0
                max: 100
                severity:
                  red: 0
                  yellow: 30
                  green: 60
              - type: conditional
