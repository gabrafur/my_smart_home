title: Map
views:
  - title: Map
    path: map
    icon: mdi:map-marker-multiple
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Live locations
            heading_style: title
            icon: mdi:map-marker-radius
          - type: map
            title: Locations
            show_all: true
            hours_to_show: 0
            default_zoom: 15
            auto_fit: true
            fit_zones: false
            cluster: false
            theme_mode: auto
            grid_options:
              columns: full
              rows: 6
      - type: grid
        cards:
          - type: heading
            heading: Current location
            heading_style: subtitle
            icon: mdi:crosshairs-gps
          - type: markdown
            title: Current status and source
            content: |-
              {% set items = states.device_tracker
                | selectattr('attributes.selected_location_source', 'defined')
                | sort(attribute='name') | list %}
              {% if items %}
              {% for item in items %}
              {% if item.state == 'home' %}
                {% set status_icon = '🏠' %}
                {% set status = 'Home' %}
              {% elif item.state == 'not_home' %}
                {% set status_icon = '📍' %}
                {% set status = 'Away' %}
              {% elif item.state == 'chegando' %}
                {% set status_icon = '🚗' %}
                {% set status = 'Arriving' %}
              {% elif item.state == 'unavailable' %}
                {% set status_icon = '⚠️' %}
                {% set status = 'Unavailable' %}
              {% elif item.state == 'unknown' %}
                {% set status_icon = '❔' %}
                {% set status = 'Unknown' %}
              {% else %}
                {% set status_icon = '📍' %}
                {% set status = item.state
                  | replace('_', ' ') | title %}
              {% endif %}
              ### {{ status_icon }} {{ item.name }}

              **{{ status }}** · location from **{{
                item.attributes.selected_location_source }}**

              {% if not loop.last %}---{% endif %}
              {% endfor %}
              {% else %}
              No consolidated locations are available.
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Source health
            heading_style: subtitle
            icon: mdi:clock-check-outline
          - type: markdown
            title: Last update by source
            content: |-
              {% set items = states.device_tracker
                | selectattr('attributes.location_sources', 'defined')
                | sort(attribute='name') | list %}
              {% if items %}
              {% for item in items %}
              {% if item.attributes.binding_role == 'vehicle_primary' %}
                {% set item_icon = '🚙' %}
              {% else %}
                {% set item_icon = '📱' %}
              {% endif %}
              ### {{ item_icon }} {{ item.name }}

              {% for source in item.attributes.location_sources -%}
              {% set gps_age = as_timestamp(now())
                - as_timestamp(source.location_observed_at) %}
              {% if gps_age <= 900 %}
                {% set gps_health = '🟢 Current GPS' %}
              {% elif gps_age <= 3600 %}
                {% set gps_health = '🟠 Aging GPS' %}
              {% else %}
                {% set gps_health = '🔴 Stale GPS' %}
              {% endif %}
              **{{ source.name }}** · {{ gps_health }}<br>
              🛰️ Last GPS change `{{ as_timestamp(source.location_observed_at)
                | timestamp_custom('%d/%m/%Y %H:%M:%S', true) }}`<br>
              🔄 Last update `{{ as_timestamp(source.last_updated)
                | timestamp_custom('%d/%m/%Y %H:%M:%S', true) }}`

              {% if not loop.last %}<br>{% endif %}
              {% endfor %}

              {% if not loop.last %}---{% endif %}
              {% endfor %}
              {% else %}
              No source updates are available.
              {% endif %}
