# Painel de manutenção, só para administradores (require_admin).
#
# Reúne o antigo "Placar da casa", o "Raspberry Pi - System Health" e as
# métricas de uso do Codex e da RTX que ficavam no painel Chat. Pendências
# técnicas ficam aqui, não na tela da casa. Ver docs/DASHBOARDS.md.
title: Sistema
views:
  - title: Saúde
    path: saude
    type: sections
    max_columns: 3
    dense_section_placement: true
    badges:
      - type: entity
        entity: sensor.raspberry_pi_health
        name: Servidor
        show_name: true
        show_state: true
      - type: entity
        entity: binary_sensor.internet_connection
        name: Internet
        show_name: true
        show_state: true
      - type: entity
        entity: binary_sensor.vpn_primary_connection
        name: VPN
        show_name: true
        show_state: true
      - type: entity
        entity: binary_sensor.zigbee_network
        name: Zigbee
        show_name: true
        show_state: true
      - type: entity
        entity: binary_sensor.tuya_devices
        name: Tuya
        show_name: true
        show_state: true
    sections:
      # Pendências técnicas: cada linha só aparece quando a condição é real.
      - type: grid
        cards:
          - type: heading
            heading: Pede atenção
            icon: mdi:alert-circle-outline
          - type: markdown
            text_only: true
            grid_options:
              columns: 12
            content: Nada pendente agora.
            visibility:
              - condition: state
                entity: sensor.raspberry_pi_health
                state: ok
              - condition: state
                entity: binary_sensor.internet_connection
                state: "on"
              - condition: state
                entity: binary_sensor.zigbee_network
                state: "on"
              - condition: state
                entity: binary_sensor.tuya_devices
                state: "on"
              - condition: state
                entity: input_boolean.nodered_runtime_incident
                state: "off"
              - condition: state_not
                entity: alarm_control_panel.alarme_moni_mobile
                state:
                  - unknown
                  - unavailable
          - type: tile
            entity: sensor.raspberry_pi_health
            name: Servidor fora do normal
            grid_options:
              columns: 12
            tap_action:
              action: navigate
              navigation_path: /painel-sistema/servidor
            visibility:
              - condition: state_not
                entity: sensor.raspberry_pi_health
                state: ok
          - type: tile
            entity: binary_sensor.internet_connection
            name: Internet fora do ar
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: binary_sensor.internet_connection
                state: "off"
          - type: tile
            entity: binary_sensor.zigbee_network
            name: Rede Zigbee fora do ar
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: binary_sensor.zigbee_network
                state: "off"
          - type: tile
            entity: binary_sensor.tuya_devices
            name: Dispositivos Tuya desconectados
            icon: mdi:lan-disconnect
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: binary_sensor.tuya_devices
                state: "off"
          - type: tile
            entity: input_boolean.nodered_runtime_incident
            name: Incidente no Node-RED
            grid_options:
              columns: 12
            tap_action:
              action: more-info
            visibility:
              - condition: state
                entity: input_boolean.nodered_runtime_incident
                state: "on"
          - type: tile
            entity: alarm_control_panel.alarme_moni_mobile
            name: Alarme sem estado conhecido
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: alarm_control_panel.alarme_moni_mobile
                state:
                  - unknown
                  - unavailable
          - type: tile
            entity: switch.refletores_jardim
            name: Refletores do jardim indisponíveis
            grid_options:
              columns: 12
            tap_action:
              action: more-info
            visibility:
              - condition: state
                entity: switch.refletores_jardim
                state: unavailable

      - type: grid
        cards:
          - type: heading
            heading: Servidor
            icon: mdi:raspberry-pi
            tap_action:
              action: navigate
              navigation_path: /painel-sistema/servidor
          - type: tile
            entity: sensor.raspberry_pi_cpu_temperature
            name: Temperatura
          - type: tile
            entity: sensor.raspberry_pi_load_5m
            name: Carga (5 min)
          - type: tile
            entity: sensor.raspberry_pi_memory_usage
            name: Memória
          - type: tile
            entity: sensor.raspberry_pi_storage_usage
            name: Disco
          - type: tile
            entity: sensor.raspberry_pi_uptime
            name: Ligado há
            grid_options:
              columns: 12
          - type: heading
            heading: Comandos
            icon: mdi:power-settings
            heading_style: subtitle
          - type: tile
            entity: script.raspberry_reiniciar
            name: Reiniciar Raspberry
            icon: mdi:restart
            tap_action:
              action: perform-action
              perform_action: script.raspberry_reiniciar
              confirmation:
                text: Reiniciar o Raspberry Pi? A casa fica sem automações por alguns minutos.
            icon_tap_action:
              action: none
          - type: tile
            entity: script.raspberry_desligar
            name: Desligar Raspberry
            icon: mdi:power
            tap_action:
              action: perform-action
              perform_action: script.raspberry_desligar
              confirmation:
                text: Desligar o Raspberry Pi? Ele só volta religando na tomada.
            icon_tap_action:
              action: none
          - type: tile
            entity: script.pc_reiniciar
            name: Reiniciar PC
            icon: mdi:restart
            tap_action:
              action: perform-action
              perform_action: script.pc_reiniciar
              confirmation:
                text: Reiniciar o PC do escritório?
            icon_tap_action:
              action: none
          - type: tile
            entity: script.pc_desligar
            name: Desligar PC
            icon: mdi:power
            tap_action:
              action: perform-action
              perform_action: script.pc_desligar
              confirmation:
                text: Desligar o PC do escritório?
            icon_tap_action:
              action: none

      - type: grid
        cards:
          - type: heading
            heading: Backup e atualizações
            icon: mdi:backup-restore
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.backup_last_successful_automatic_backup
                name: Último backup do HA
              - entity: sensor.backup_next_scheduled_automatic_backup
                name: Próximo backup do HA
              - entity: update.alexa_media_player_update
                name: Alexa Media
              - entity: update.kia_uvo_hyundai_bluelink_update
                name: Kia / Bluelink
              - entity: update.moni_mobile_alarm_update
                name: Alarme Moni
              - entity: update.slzb_mrw10u_zigbee_firmware
                name: Firmware Zigbee

      - type: grid
        cards:
          - type: heading
            heading: Cópias e restauração
            icon: mdi:database-check
          # Three separate results: a Git or offsite success never implies a tested restore.
          # Freshness comes classified from backup_results_status.py; nothing is computed here.
          - type: tile
            entity: sensor.backup_result_git
            name: Cópia no Git
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.backup_result_offsite
            name: Cópia externa
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.backup_result_restore
            name: Restauração testada
            grid_options:
              columns: 12
          - type: entities
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.backup_result_git
                attribute: freshness
                name: Git — frescor do dado
              - type: attribute
                entity: sensor.backup_result_git
                attribute: last_attempt_at
                name: Git — última tentativa
                format: relative
              - type: attribute
                entity: sensor.backup_result_git
                attribute: last_confirmed_at
                name: Git — última confirmação
                format: relative
              - type: attribute
                entity: sensor.backup_result_offsite
                attribute: freshness
                name: Externa — frescor do dado
              - type: attribute
                entity: sensor.backup_result_offsite
                attribute: last_attempt_at
                name: Externa — última tentativa
                format: relative
              - type: attribute
                entity: sensor.backup_result_offsite
                attribute: last_confirmed_at
                name: Externa — última confirmação
                format: relative
              - type: attribute
                entity: sensor.backup_result_restore
                attribute: freshness
                name: Restauração — frescor do dado
              - type: attribute
                entity: sensor.backup_result_restore
                attribute: last_attempt_at
                name: Restauração — última tentativa
                format: relative
              - type: attribute
                entity: sensor.backup_result_restore
                attribute: last_confirmed_at
                name: Restauração — última confirmação
                format: relative

      - type: grid
        cards:
          - type: heading
            heading: Rede e baterias
            icon: mdi:lan-connect
          - type: tile
            entity: binary_sensor.internet_connection
            name: Internet
          - type: tile
            entity: binary_sensor.vpn_primary_connection
            name: VPN
          - type: tile
            entity: binary_sensor.zigbee_network
            name: Rede Zigbee
          - type: tile
            entity: binary_sensor.tuya_devices
            name: Dispositivos Tuya
          - type: tile
            entity: input_boolean.nodered_runtime_incident
            name: Incidente no Node-RED
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
          - type: tile
            entity: sensor.botao_portao_garagem_battery
            name: Botão do portão
          - type: tile
            entity: sensor.controlador_ir_battery
            name: Controlador IR
          - type: tile
            entity: sensor.lds_robot_battery
            name: Aspirador

  - title: Servidor
    path: servidor
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Visão geral
            icon: mdi:raspberry-pi
          - type: entities
            title: Status geral
            show_header_toggle: false
            entities:
              - entity: sensor.raspberry_pi_health
                name: Saúde geral
              - entity: sensor.raspberry_pi_uptime
                name: Uptime
              - entity: sensor.raspberry_pi_last_boot
                name: Última inicialização
              - entity: binary_sensor.raspberry_pi_network_link
                name: Conectividade
              - entity: sensor.raspberry_pi_ip_address
                name: IP atual
              - entity: sensor.raspberry_pi_metrics_raw
                name: Coleta bruta
          - type: grid
            title: Indicadores principais
            columns: 3
            square: false
            cards:
              - type: gauge
                entity: sensor.raspberry_pi_cpu_temperature
                name: Temperatura
                min: 30
                max: 90
                severity: { green: 0, yellow: 75, red: 82 }
              - type: gauge
                entity: sensor.raspberry_pi_cpu_usage
                name: CPU
                min: 0
                max: 100
                severity: { green: 0, yellow: 85, red: 95 }
              - type: gauge
                entity: sensor.raspberry_pi_memory_usage
                name: Memória
                min: 0
                max: 100
                severity: { green: 0, yellow: 80, red: 90 }
              - type: gauge
                entity: sensor.raspberry_pi_swap_usage
                name: Swap
                min: 0
                max: 100
                severity: { green: 0, yellow: 25, red: 50 }
              - type: gauge
                entity: sensor.raspberry_pi_storage_usage
                name: Armazenamento
                min: 0
                max: 100
                severity: { green: 0, yellow: 80, red: 90 }
              - type: gauge
                entity: sensor.raspberry_pi_load_5m
                name: Load 5m
                min: 0
                max: 16
                severity: { green: 0, yellow: 4.8, red: 8 }
          - type: grid
            title: Ações manuais
            columns: 2
            square: false
            cards:
              - type: button
                entity: binary_sensor.raspberry_pi_storage_manual_running
                name: Executar Storage Health
                icon: mdi:harddisk
                show_state: true
                state_color: true
                tap_action:
                  action: perform-action
                  perform_action: input_button.press
                  target:
                    entity_id: input_button.storage_health_manual_run
                  confirmation:
                    text: A manutenção remove caches Docker sem uso, preserva 2 GB de cache recente e limpa backups de flows e logs npm expirados. Deseja continuar?
              - type: button
                entity: binary_sensor.revisao_documental_em_execucao
                name: Rodar revisão documental
                icon: mdi:file-document-refresh-outline
                show_state: true
                state_color: true
                tap_action:
                  action: perform-action
                  perform_action: input_button.press
                  target:
                    entity_id: input_button.weekly_documentation_review_run
                  confirmation:
                    text: A revisão pode editar, criar commit e enviar alterações. Deseja continuar?

      - type: grid
        cards:
          - type: heading
            heading: Armazenamento e infraestrutura
            icon: mdi:server
          - type: entities
            title: Armazenamento
            show_header_toggle: false
            entities:
              - entity: sensor.raspberry_pi_storage_usage
                name: Uso
              - entity: sensor.raspberry_pi_storage_used
                name: Usado
              - entity: sensor.raspberry_pi_storage_free
                name: Livre
              - entity: sensor.raspberry_pi_recorder_storage_usage
                name: Recorder no armazenamento
              - entity: sensor.raspberry_pi_storage_inodes_usage
                name: Inodes usados
              - entity: sensor.raspberry_pi_raspberry_storage_status
                name: Status Node-RED
              - entity: sensor.raspberry_pi_storage_health_last_run
                name: Última verificação do Storage Health
              - entity: sensor.raspberry_pi_raspberry_storage_growth_24h
                name: Crescimento em 24 h
              - entity: sensor.raspberry_pi_raspberry_storage_growth_7d
                name: Crescimento em 7 dias
              - entity: sensor.raspberry_pi_storage_history_coverage
                name: Histórico disponível para tendências
              - entity: sensor.raspberry_pi_raspberry_storage_last_maintenance
                name: Última limpeza segura
              - entity: sensor.raspberry_pi_raspberry_storage_last_reclaimed
                name: Recuperado na última manutenção
              - entity: binary_sensor.raspberry_pi_storage_warning
                name: Armazenamento em atenção
              - entity: binary_sensor.raspberry_pi_storage_critical
                name: Armazenamento crítico
          - type: entities
            title: Diagnóstico e limpeza automática
            show_header_toggle: false
            entities:
              - type: section
                label: Docker — total agregado, não somar com os subconjuntos
              - entity: sensor.raspberry_pi_storage_maintenance_docker
                name: Total lógico do Docker
              - entity: sensor.raspberry_pi_storage_maintenance_docker_build_cache
                name: Cache de build lógico
              - entity: sensor.raspberry_pi_storage_maintenance_docker_build_cache_reclaimable
                name: Cache marcado como recuperável pelo Docker
              - entity: sensor.raspberry_pi_storage_maintenance_docker_reclaimable_untagged
                name: Imagens sem tag elegíveis para limpeza
              - entity: sensor.raspberry_pi_storage_maintenance_docker_protected_untagged
                name: Imagens sem tag protegidas pelo repositório
              - entity: sensor.raspberry_pi_storage_maintenance_docker_recent_untagged
                name: Imagens sem tag recentes, em carência
              - entity: sensor.raspberry_pi_storage_maintenance_docker_unused_tagged
                name: Imagens com tag sem container — revisão
              - type: section
                label: Host e Home Assistant — itens independentes
              - entity: sensor.raspberry_pi_storage_maintenance_vs_code_server
                name: VS Code Server
              - entity: sensor.raspberry_pi_storage_maintenance_recorder
                name: Recorder alocado
              - entity: sensor.raspberry_pi_storage_maintenance_recorder_reclaimable
                name: Recorder recuperável após repack
              - type: section
                label: Backups — os dois itens abaixo formam o total
              - entity: sensor.raspberry_pi_storage_maintenance_backup_archives
                name: Backups operacionais TAR
              - entity: sensor.raspberry_pi_storage_maintenance_manual_snapshots
                name: Snapshots manuais de rollback
              - entity: sensor.raspberry_pi_storage_maintenance_expired_manual_snapshots
                name: Snapshots fora da retenção de 14 dias
              - type: section
                label: Última execução da limpeza
              - entity: sensor.raspberry_pi_storage_maintenance_result
                name: Resultado da manutenção
          - type: entities
            title: Disponibilidade da infraestrutura
            show_header_toggle: false
            entities:
              - entity: binary_sensor.internet_connection
                name: Internet
              - entity: sensor.internet_connection_state
                name: Estado detalhado da internet
              - type: attribute
                entity: sensor.internet_connection_state
                attribute: last_outage
                name: Última queda da internet
              - type: attribute
                entity: sensor.internet_connection_state
                attribute: last_recovery
                name: Última recuperação da internet
              - entity: binary_sensor.zigbee_network
                name: Rede Zigbee
              - entity: sensor.zigbee_network_state
                name: Estado detalhado do Zigbee
              - type: attribute
                entity: sensor.zigbee_network_state
                attribute: last_outage
                name: Última queda do Zigbee
              - type: attribute
                entity: sensor.zigbee_network_state
                attribute: last_recovery
                name: Última recuperação do Zigbee
          - type: entities
            title: Revisão documental semanal
            show_header_toggle: false
            entities:
              - entity: sensor.revisao_semanal_da_documentacao
                name: Estado atual
              - type: attribute
                entity: sensor.revisao_semanal_da_documentacao
                attribute: next_run
                name: Próxima execução (UTC)
              - type: attribute
                entity: sensor.revisao_semanal_da_documentacao
                attribute: last_result
                name: Último resultado
              - type: attribute
                entity: sensor.revisao_semanal_da_documentacao
                attribute: last_finished
                name: Última conclusão (UTC)
              - type: attribute
                entity: sensor.revisao_semanal_da_documentacao
                attribute: last_reason
                name: Motivo
              - type: attribute
                entity: sensor.revisao_semanal_da_documentacao
                attribute: last_commit
                name: Commit final

      - type: grid
        cards:
          - type: heading
            heading: Processamento
            icon: mdi:memory
          - type: entities
            title: CPU
            show_header_toggle: false
            entities:
              - entity: sensor.raspberry_pi_cpu_usage
                name: Uso atual
              - entity: sensor.raspberry_pi_cpu_temperature
                name: Temperatura
              - entity: sensor.raspberry_pi_load_1m
                name: Load 1m
              - entity: sensor.raspberry_pi_load_5m
                name: Load 5m
              - entity: sensor.raspberry_pi_load_15m
                name: Load 15m
              - entity: sensor.raspberry_pi_cpu_frequency
                name: Frequência
              - entity: binary_sensor.raspberry_pi_cpu_warning
