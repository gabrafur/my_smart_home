title: Creta
views:
  - title: Visão geral
    path: vehicle_primary
    icon: mdi:car
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Estado
            icon: mdi:car-connected
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set engine = is_state('binary_sensor.vehicle_primary_engine', 'on') %}
              {% set updated = states('sensor.vehicle_primary_last_updated_at') %}
              {% set updated_ts = as_timestamp(updated, none) %}
              {% set age_min = ((as_timestamp(now()) - updated_ts) / 60) | round(0) if updated_ts else none %}
              {% set refresh_state = states('sensor.vehicle_primary_refresh_coordinator') %}
              {% set refresh_reason = state_attr('sensor.vehicle_primary_refresh_coordinator', 'reason') %}

              # {{ 'Em uso' if engine else 'Estacionado' }}

              {% if refresh_state == 'waiting' and refresh_reason == 'quiet_hours_both_home' %}
              🟢 **Pausa noturna programada** · ambos em casa; o próximo wake pode ocorrer a partir das 06h{% if age_min is not none %}. Último dado do carro há {{ format_number_ptbr(age_min) }} min{% endif %}.
              {% elif age_min is none %}
              🔴 **Sem telemetria válida** · o Bluelink ainda não forneceu uma leitura utilizável.
              {% elif age_min <= 30 %}
              🟢 **Dados atualizados** · leitura confirmada há {{ format_number_ptbr(age_min) }} min.
              {% elif age_min <= 90 %}
              🟡 **Leitura ficando antiga** · última confirmação há {{ format_number_ptbr(age_min) }} min.
              {% else %}
              🔴 **Telemetria desatualizada** · última confirmação há {{ format_number_ptbr(age_min) }} min.
              {% endif %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.vehicle_primary_fuel_level
                name: Combustível
                icon: mdi:gas-station
              - type: tile
                entity: sensor.garagem_vehicle_primary_total_driving_range
                name: Autonomia
                icon: mdi:map-marker-distance
              - type: markdown
                content: >-
                  {% from 'formatting.jinja' import format_number_ptbr %}
                  {% set odometer = states('sensor.garagem_vehicle_primary_odometer') %}
                  **Odômetro**

                  ## {{ format_number_ptbr(odometer) ~ ' km' if is_number(odometer) else 'Indisponível' }}
              - type: markdown
                content: >-
                  {% from 'formatting.jinja' import format_number_ptbr %}
                  {% set entity = states.sensor.garagem_vehicle_primary_estimated_fuel_efficiency %}
                  {% set value = entity.state if entity else 'unknown' %}
                  {% set samples = entity.attributes.samples_used | default(0) if entity else 0 %}
                  {% set window_days = entity.attributes.search_window_days | default(0) if entity else 0 %}
                  **Consumo estimado**

                  {% if value not in ['unknown', 'unavailable', 'none'] %}
                  ## {{ format_number_ptbr(value, 2) }} km/L
                  {{ format_number_ptbr(samples) }} amostras confiáveis · até {{ format_number_ptbr(window_days) }} dias
                  {% else %}
                  ## Dados insuficientes
                  Janela pesquisada: até {{ format_number_ptbr(window_days) }} dias
                  {% endif %}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: binary_sensor.vehicle_primary_engine
                name: Motor
                icon: mdi:engine
              - type: tile
                entity: sensor.vehicle_primary_car_battery_level
                name: Bateria 12 V
                icon: mdi:car-battery
              - type: tile
                entity: binary_sensor.vehicle_primary_fuel_low_level
                name: Reserva
                icon: mdi:fuel

      - type: grid
        cards:
          - type: heading
            heading: Último estacionamento e viagens
            icon: mdi:map-marker-check
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set engine = is_state('binary_sensor.vehicle_primary_engine', 'on') %}
              {% set tracker = states.device_tracker.vehicle_primary %}
              {% set persistent_since = states('sensor.vehicle_primary_current_location_since') %}
              {% set persistent_since_ts = as_timestamp(persistent_since, none) %}
              {% set tracker_since_ts = as_timestamp(tracker.last_changed, none) if tracker and tracker.state not in ['unknown', 'unavailable'] else none %}
              {% set location_since_ts = persistent_since_ts if persistent_since_ts else tracker_since_ts %}
              {% set location_since_text = location_since_ts | timestamp_custom('%d/%m às %H:%M', true) if location_since_ts else none %}
              {% if engine %}
              🔵 **Veículo em uso** · o mapa mostra o último estacionamento confirmado{% if location_since_text %}, nesta localização desde {{ location_since_text }}{% endif %}. O Bluelink Brasil não fornece a posição enquanto o veículo está em movimento.
              {% elif not tracker or tracker.state in ['unknown', 'unavailable'] or location_since_ts is none %}
              🔴 **Estacionamento ainda não confirmado** · a posição será exibida quando o Bluelink confirmar o veículo estacionado.
              {% else %}
              🟢 **Estacionamento confirmado** · nesta localização desde {{ location_since_text }}.
              {% endif %}
          - type: map
            entities:
              - entity: device_tracker.vehicle_primary
            hours_to_show: 12
            default_zoom: 15
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set trips = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'trips') or [] %}
              {% set efficiency = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'fuel_efficiency') or {} %}
              {% if trips %}
              **{{ format_number_ptbr(trips | length) }} viagem(ns) recentes**

              {% if efficiency.km_per_l is defined and efficiency.km_per_l is not none %}
              ⛽ {{ format_number_ptbr(efficiency.km_per_l, 2) }} km/L · referência de {{ format_number_ptbr(efficiency.samples_used) }} amostras
              {% endif %}

              {% for trip in trips[:2] %}
              **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}** · {{ format_number_ptbr(trip.distance, 1) }} km · {{ format_number_ptbr(trip.duration_min) }} min
              {% endfor %}

              {% if trips | length > 2 %}
              *Mais viagens em Detalhes.*
              {% endif %}
              {% else %}
              **Nenhuma viagem recente.**
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Ações e alertas
            icon: mdi:car-key
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: input_button.vehicle_primary_force_refresh_now
                name: Atualizar agora
                icon: mdi:refresh
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: input_button.press
                  target:
                    entity_id: input_button.vehicle_primary_force_refresh_now
                hold_action:
                  action: none
              - type: tile
                entity: button.vehicle_primary_start_hazard_lights_and_horn
                name: Localizar (segure)
                icon: mdi:car-emergency
                hide_state: true
                tap_action:
                  action: none
                hold_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: locate
                  confirmation:
                    text: Acionar a buzina e as luzes do Creta por aproximadamente 30 segundos?
              - type: tile
                entity: lock.vehicle_primary_door_lock
                name: Travar portas
                icon: mdi:lock
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: lock
                  confirmation:
                    text: Travar as portas do Creta remotamente?
                icon_tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: lock
                  confirmation:
                    text: Travar as portas do Creta remotamente?
                hold_action:
                  action: none
                icon_hold_action:
                  action: none
              - type: tile
                entity: lock.vehicle_primary_door_lock
                name: Destravar portas
                icon: mdi:lock-open-variant
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: unlock
                  confirmation:
                    text: Destravar as portas do Creta remotamente?
                icon_tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: unlock
                  confirmation:
                    text: Destravar as portas do Creta remotamente?
                hold_action:
                  action: none
                icon_hold_action:
                  action: none
          - type: markdown
            content: >-
              {% set command = states('sensor.garagem_vehicle_primary_remote_command_status') %}
              {% set action = state_attr('sensor.garagem_vehicle_primary_remote_command_status', 'command') %}
              {% set reason = state_attr('sensor.garagem_vehicle_primary_remote_command_status', 'reason') %}
              {% set labels = {
                'unlock': 'destravar as portas',
                'lock': 'travar as portas',
                'climate_on': 'ligar o carro e o ar',
                'climate_off': 'desligar o carro e o ar',
                'hazard_lights_and_horn': 'acionar luzes e buzina'
              } %}
              {% set label = labels.get(action, 'executar o comando remoto') %}
              **Último comando remoto**

              {% if command == 'requesting' %}🔵 **Comando em andamento** · aguardando a confirmação final para {{ label }}.
              {% elif command == 'accepted' %}🟢 **Comando confirmado** · o veículo concluiu a solicitação para {{ label }}.
              {% elif command == 'cooldown' %}🟡 **Comando em espera** · aguarde o cooldown antes de tentar novamente.
              {% elif command == 'failed' %}🔴 **Falha no último comando** · o veículo não confirmou a solicitação para {{ label }}{% if reason %}: {{ reason }}{% else %}.{% endif %}
              {% else %}🔵 Os comandos aguardam a confirmação final do Bluelink; falhas geram aviso no celular e no Home Assistant.
              {% endif %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.vehicle_primary_climate
                name: Ligar carro + ar
                icon: mdi:car-seat-cooler
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: climate_on
                  confirmation:
                    text: O veículo está em P, com portas e porta-malas fechados e travados? Ligar o motor e o ar-condicionado remotamente?
                icon_tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: climate_on
                  confirmation:
                    text: O veículo está em P, com portas e porta-malas fechados e travados? Ligar o motor e o ar-condicionado remotamente?
                hold_action:
                  action: none
                icon_hold_action:
                  action: none
              - type: tile
                entity: switch.vehicle_primary_climate
                name: Desligar carro + ar
                icon: mdi:car-off
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: climate_off
                  confirmation:
                    text: Desligar o motor e o ar-condicionado remotamente?
                icon_tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: climate_off
                  confirmation:
                    text: Desligar o motor e o ar-condicionado remotamente?
                hold_action:
                  action: none
                icon_hold_action:
                  action: none
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set refresh = states.sensor.vehicle_primary_refresh_coordinator %}
              {% set refresh_state = refresh.state if refresh else 'unavailable' %}
              {% set refresh_reason = state_attr('sensor.vehicle_primary_refresh_coordinator', 'reason') %}
              {% set refresh_failure = state_attr('sensor.vehicle_primary_refresh_coordinator', 'last_failure_class') %}
              {% set remaining = state_attr('sensor.vehicle_primary_refresh_coordinator', 'remaining_seconds') | int(0) %}
              {% set api_retry = states('sensor.vehicle_primary_api_retry_at') %}
              {% set api_status = state_attr('sensor.vehicle_primary_api_retry_at', 'status') %}
              {% set api_retry_ts = as_timestamp(api_retry, none) %}
              {% set api_remaining_s = ([0, api_retry_ts - as_timestamp(now())] | max) | round(0) if api_retry_ts is not none else none %}
              {% set api_remaining_min = ((api_remaining_s + 59) / 60) | int if api_remaining_s is not none and api_remaining_s > 0 else 0 %}
              {% set scanned = states('sensor.vehicle_primary_last_scanned_at') %}
              {% set scanned_ts = as_timestamp(scanned, none) %}
              {% set cache_age_s = (as_timestamp(now()) - scanned_ts) | round(0) if scanned_ts else none %}
              {% set cache_age_min = (cache_age_s / 60) | round(0) if cache_age_s is not none else none %}
              {% set updated = states('sensor.vehicle_primary_last_updated_at') %}
              {% set updated_ts = as_timestamp(updated, none) %}
              {% set data_age_min = ((as_timestamp(now()) - updated_ts) / 60) | round(0) if updated_ts else none %}
              {% set request_ts = as_timestamp(state_attr('sensor.vehicle_primary_refresh_coordinator', 'last_request_at'), none) %}
              {% set data_after_wake = updated_ts is not none and request_ts is not none and updated_ts >= request_ts - 60 %}
              {% set remaining_min = ((remaining + 59) / 60) | int if remaining > 0 else 0 %}
              {% set both_home = is_state('device_tracker.resident_primary_location', 'home') and is_state('device_tracker.resident_secondary_location', 'home') %}
              {% set coordinator_interval_min = state_attr('sensor.vehicle_primary_refresh_coordinator', 'interval_minutes') | int(0) %}
              {% set interval_min = coordinator_interval_min if coordinator_interval_min in [15, 30] else (30 if both_home else 15) %}

              **Atualização dos dados**

              {% if cache_age_s is not none and cache_age_s <= 1080 %}🟢 **Servidor consultado há {{ format_number_ptbr(cache_age_min) }} min** · esta consulta não acorda o carro.
              {% elif cache_age_s is not none %}🟡 **Servidor sem consulta há {{ format_number_ptbr(cache_age_min) }} min** · o esperado é uma consulta a cada 15 min.
              {% else %}🔴 **Consulta ao servidor indisponível**.
              {% endif %}

              {% if data_age_min is none %}🔴 **Sem dados confirmados do carro**.
              {% elif data_age_min <= 30 %}🟢 **Dados do carro recebidos há {{ format_number_ptbr(data_age_min) }} min**.
              {% elif data_age_min <= 90 %}🟡 **Dados do carro recebidos há {{ format_number_ptbr(data_age_min) }} min**.
              {% else %}🔴 **Dados do carro recebidos há {{ format_number_ptbr(data_age_min) }} min**.
              {% endif %}

              {% if api_status == 'rate_limited' %}🟡 **Integração Bluelink ainda indisponível**{% if api_remaining_min > 0 %} · API liberada para nova tentativa em cerca de {{ format_number_ptbr(api_remaining_min) }} min{% else %} · API liberada para nova tentativa agora{% endif %}.
              {% elif refresh_state == 'waiting' and refresh_reason == 'quiet_hours_both_home' %}🟢 **Wake periódico pausado até 06h** · ambos estão em casa.
              {% elif refresh_state in ['refreshing', 'in_flight', 'awaiting_evidence'] %}🔵 **Wake em andamento** · aguardando o Bluelink publicar dados do carro.
              {% elif data_after_wake %}🟢 **Último wake confirmado por dados novos**{% if remaining_min > 0 %} · próximo ciclo em cerca de {{ format_number_ptbr(remaining_min) }} min{% endif %}.
              {% elif refresh_state == 'backoff' and (refresh_failure == 'integration_unavailable' or (refresh_failure == 'api_error' and cache_age_s is none and data_age_min is none)) %}🟡 **Integração Bluelink ainda indisponível** · aguardando a API informar uma nova janela de tentativa.
              {% elif refresh_state in ['probing_cache', 'backoff'] %}🟡 **O último wake ainda não produziu dados novos**{% if refresh_state == 'probing_cache' %} · verificando agora o cache do servidor antes de outro wake{% elif remaining_min > 0 %} · nova verificação em cerca de {{ format_number_ptbr(remaining_min) }} min{% endif %}.
              {% elif refresh_state == 'cooldown' %}🟢 **Próximo wake periódico em cerca de {{ format_number_ptbr(remaining_min) }} min** · ciclo atual de {{ format_number_ptbr(interval_min) }} min.
              {% elif refresh_state == 'waiting' %}🟡 **Wake aguardando localização válida** · a política será reavaliada quando o contexto dos moradores estiver disponível.
              {% elif refresh_state in ['unknown', 'unavailable'] %}🔴 **Coordenador de wake indisponível**.
              {% else %}🟢 **Wake pronto** · ciclo atual de {{ format_number_ptbr(interval_min) }} min.
              {% endif %}
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.vehicle_primary_front_left_door
                name: Porta dianteira esquerda
              - entity: binary_sensor.vehicle_primary_front_right_door
                name: Porta dianteira direita
              - entity: binary_sensor.vehicle_primary_back_left_door
                name: Porta traseira esquerda
              - entity: binary_sensor.vehicle_primary_back_right_door
                name: Porta traseira direita
              - entity: binary_sensor.vehicle_primary_trunk
                name: Porta-malas
              - entity: binary_sensor.vehicle_primary_tire_pressure_all
                name: Alerta de pneus

  - title: Detalhes
    path: detalhes
    icon: mdi:car-info
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Viagens e consumo
            icon: mdi:map-marker-path
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set trips = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'trips') or [] %}
              {% set efficiency = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'fuel_efficiency') or {} %}
              {% if efficiency.data_sufficient | default(false) %}
              ## {{ format_number_ptbr(efficiency.km_per_l, 2) }} km/L estimados

              Janela efetiva: {{ as_datetime(efficiency.sample_window_start).astimezone().strftime('%d/%m %H:%M') if efficiency.sample_window_start else 'indisponível' }}–{{ as_datetime(efficiency.sample_window_end).astimezone().strftime('%d/%m %H:%M') if efficiency.sample_window_end else 'indisponível' }}

              {{ format_number_ptbr(efficiency.samples_used) }} amostras de autonomia/combustível · faixa observada de {{ format_number_ptbr(efficiency.fuel_span_percent, 1) }}%

              Esta é a mediana estimada pelo alcance informado pelo veículo entre 20% e 80% do tanque.

              O Bluelink não fornece litros consumidos por viagem. Os valores abaixo são estimativas modeladas pela média da janela, distância e proporção de marcha lenta de cada trajeto.
              {% else %}
              ## Dados insuficientes

              Janela pesquisada: até {{ format_number_ptbr(efficiency.search_window_days | default(0)) }} dias, conforme a retenção disponível do Recorder. A estimativa requer ao menos 5 leituras pareadas e uma variação de 10% na faixa confiável do tanque.
              {% endif %}

              {% if trips %}
              {% for trip in trips %}
              ---
              **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} · {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}{% if trip.end_time %}–{{ trip.end_time }}{% endif %}**

              {{ format_number_ptbr(trip.distance, 1) }} km · {{ format_number_ptbr(trip.duration_min) }} min · média {{ format_number_ptbr(trip.avg_speed, 1) }} km/h

              {% if trip.estimated_km_per_l is defined and trip.estimated_liters is defined %}
              ⛽ **{{ format_number_ptbr(trip.estimated_km_per_l, 2) }} km/L estimados** · {{ format_number_ptbr(trip.estimated_liters, 2) }} L modelados
              {% else %}
              ⛽ Estimativa individual indisponível
              {% endif %}
              {% endfor %}
              {% else %}
              **Nenhuma viagem disponível para hoje e ontem.**
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Histórico
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Motor e combustível · 48 horas
            hours_to_show: 48
            entities:
              - entity: binary_sensor.vehicle_primary_engine
                name: Motor
              - entity: sensor.vehicle_primary_fuel_level
                name: Combustível
          - type: history-graph
            title: Consumo estimado · 7 dias
            hours_to_show: 168
            entities:
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: km/L estimados

      - type: grid
        cards:
          - type: heading
            heading: Diagnóstico
            icon: mdi:stethoscope
          - type: markdown
            content: >-
              **Atualização automática orientada a eventos**

              O cache do servidor Bluelink é consultado a cada **15 minutos** sem acordar o carro. Se o provedor limitar as chamadas, o polling entra em backoff progressivo de até **6 horas** sem criar novas rajadas. Separadamente, o wake real usa **15 minutos** quando alguém está fora ou chegando e **30 minutos** no ciclo saudável quando ambos estão em casa; recuperação e backoff usam **15 minutos** fora da pausa noturna. Antes de repetir um wake sem evidência, o fluxo relê o cache e só acorda o carro se os dados continuarem antigos. Com os dois em casa, wakes automáticos ficam pausados entre **00h e 06h**. O botão **Atualizar agora** força um wake e pode antecipar qualquer prazo quando não há backoff do provedor.

              A consulta ao cache pode republicar entidades sem acordar o carro; o refresh só é concluído quando o timestamp do próprio Bluelink (`Última atualização`) realmente avança.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.vehicle_primary_last_updated_at
                name: Estado confirmado em
              - entity: sensor.vehicle_primary_last_scanned_at
                name: Cache consultado em
              - entity: sensor.vehicle_primary_current_location_since
                name: Nesta localização desde
              - entity: sensor.garagem_vehicle_primary_recent_trip_info
                name: Viagens carregadas
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: Base de consumo
              - entity: sensor.vehicle_primary_refresh_coordinator
                name: Coordenador de refresh
              - entity: sensor.garagem_vehicle_primary_remote_command_status
                name: Último comando remoto
              - entity: sensor.integracao_vehicle_primary
                name: Manutenção da integração
