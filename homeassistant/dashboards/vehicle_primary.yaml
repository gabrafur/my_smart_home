title: Creta
views:
  - title: Visão geral
    path: vehicle_primary
    icon: mdi:car
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Estado
            icon: mdi:car-connected
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set engine = is_state('binary_sensor.vehicle_primary_engine', 'on') %}
              {% set updated = states('sensor.vehicle_primary_last_updated_at') %}
              {% set updated_ts = as_timestamp(updated, none) %}
              {% set age_min = ((as_timestamp(now()) - updated_ts) / 60) | round(0) if updated_ts else none %}

              # {{ 'Em uso' if engine else 'Estacionado' }}

              {% if age_min is none %}
              🔴 Sem telemetria válida
              {% elif age_min <= 15 %}
              🟢 Atualizado há {{ format_number_ptbr(age_min) }} min
              {% elif age_min <= 90 %}
              🟡 Leitura de {{ format_number_ptbr(age_min) }} min atrás
              {% else %}
              🔴 Leitura de {{ format_number_ptbr(age_min) }} min atrás
              {% endif %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.vehicle_primary_fuel_level
                name: Combustível
                icon: mdi:gas-station
              - type: tile
                entity: sensor.garagem_vehicle_primary_total_driving_range
                name: Autonomia
                icon: mdi:map-marker-distance
              - type: markdown
                content: >-
                  {% from 'formatting.jinja' import format_number_ptbr %}
                  {% set odometer = states('sensor.garagem_vehicle_primary_odometer') %}
                  **Odômetro**

                  ## {{ format_number_ptbr(odometer) ~ ' km' if is_number(odometer) else 'Indisponível' }}
              - type: markdown
                content: >-
                  {% from 'formatting.jinja' import format_number_ptbr %}
                  {% set entity = states.sensor.garagem_vehicle_primary_estimated_fuel_efficiency %}
                  {% set value = entity.state if entity else 'unknown' %}
                  {% set trips = entity.attributes.trips_considered | default(0) if entity else 0 %}
                  {% set window_days = entity.attributes.search_window_days | default(0) if entity else 0 %}
                  **Consumo estimado**

                  {% if value not in ['unknown', 'unavailable', 'none'] %}
                  ## {{ format_number_ptbr(value, 2) }} km/L
                  {{ format_number_ptbr(trips) }} viagem(ns) · até {{ format_number_ptbr(window_days) }} dias
                  {% else %}
                  ## Dados insuficientes
                  Janela pesquisada: até {{ format_number_ptbr(window_days) }} dias
                  {% endif %}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: binary_sensor.vehicle_primary_engine
                name: Motor
                icon: mdi:engine
              - type: tile
                entity: lock.vehicle_primary_door_lock
                name: Travas
              - type: tile
                entity: binary_sensor.vehicle_primary_fuel_low_level
                name: Reserva
                icon: mdi:fuel

      - type: grid
        cards:
          - type: heading
            heading: Último estacionamento e viagens
            icon: mdi:map-marker-check
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set engine = is_state('binary_sensor.vehicle_primary_engine', 'on') %}
              {% set location_updated = states('sensor.vehicle_primary_location_last_updated') %}
              {% set location_ts = as_timestamp(location_updated, none) %}
              {% set age_min = ((as_timestamp(now()) - location_ts) / 60) | round(0) if location_ts else none %}
              {% if engine %}
              ⚠️ **Veículo em uso**

              O mapa mostra o **último estacionamento confirmado**{% if age_min is not none %}, há {{ format_number_ptbr(age_min) }} min{% endif %}. O Bluelink Brasil não fornece a posição enquanto o veículo está em movimento.
              {% elif age_min is none %}
              🔴 **Estacionamento ainda não confirmado**

              A posição será exibida depois que o Bluelink confirmar o veículo estacionado.
              {% elif age_min <= 15 %}
              🟢 **Último estacionamento confirmado há {{ format_number_ptbr(age_min) }} min**
              {% else %}
              🟡 **Último estacionamento confirmado há {{ format_number_ptbr(age_min) }} min**

              Esta é a última posição estacionada informada pelo Bluelink, não uma localização GPS em tempo real.
              {% endif %}
          - type: map
            entities:
              - entity: device_tracker.vehicle_primary
            hours_to_show: 12
            default_zoom: 15
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set trips = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'trips') or [] %}
              {% set efficiency = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'fuel_efficiency') or {} %}
              {% if trips %}
              **{{ format_number_ptbr(trips | length) }} viagem(ns) recentes**

              {% if efficiency.km_per_l is defined and efficiency.km_per_l is not none %}
              ⛽ {{ format_number_ptbr(efficiency.km_per_l, 2) }} km/L · {{ format_number_ptbr(efficiency.estimated_distance, 1) }} km analisados
              {% endif %}

              {% for trip in trips[:2] %}
              **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}** · {{ format_number_ptbr(trip.distance, 1) }} km · {{ format_number_ptbr(trip.duration_min) }} min
              {% endfor %}

              {% if trips | length > 2 %}
              *Mais viagens em Detalhes.*
              {% endif %}
              {% else %}
              **Nenhuma viagem recente.**
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Ações e alertas
            icon: mdi:car-key
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: input_button.vehicle_primary_force_refresh_now
                name: Atualizar
                icon: mdi:refresh
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: input_button.press
                  target:
                    entity_id: input_button.vehicle_primary_force_refresh_now
                hold_action:
                  action: none
              - type: tile
                entity: button.vehicle_primary_start_hazard_lights_and_horn
                name: Localizar (segure)
                icon: mdi:car-emergency
                hide_state: true
                tap_action:
                  action: none
                hold_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: locate
                  confirmation:
                    text: Acionar a buzina e as luzes do Creta por aproximadamente 30 segundos?
          - type: markdown
            content: >-
              {% set command = states('sensor.garagem_vehicle_primary_remote_command_status') %}
              **Localizar por luz e buzina**

              {% if command == 'requesting' %}↻ Comando em andamento.
              {% elif command == 'accepted' %}🟢 Comando aceito pelo veículo.
              {% elif command in ['failed', 'cooldown'] %}🔴 O último comando falhou ou ainda está em cooldown.
              {% else %}Segure o botão **Localizar (segure)** e confirme para acionar luzes e buzina.
              {% endif %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.vehicle_primary_climate
                name: Ligar carro + ar
                icon: mdi:car-seat-cooler
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: climate_on
                  confirmation:
                    text: O veículo está em P, com portas e porta-malas fechados e travados? Ligar o motor e o ar-condicionado remotamente?
                icon_tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: climate_on
                  confirmation:
                    text: O veículo está em P, com portas e porta-malas fechados e travados? Ligar o motor e o ar-condicionado remotamente?
                hold_action:
                  action: none
                icon_hold_action:
                  action: none
              - type: tile
                entity: switch.vehicle_primary_climate
                name: Desligar carro + ar
                icon: mdi:car-off
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: climate_off
                  confirmation:
                    text: Desligar o motor e o ar-condicionado remotamente?
                icon_tap_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: climate_off
                  confirmation:
                    text: Desligar o motor e o ar-condicionado remotamente?
                hold_action:
                  action: none
                icon_hold_action:
                  action: none
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set refresh = states.sensor.vehicle_primary_refresh_coordinator %}
              {% set refresh_state = refresh.state if refresh else 'unavailable' %}
              {% set remaining = state_attr('sensor.vehicle_primary_refresh_coordinator', 'remaining_seconds') | int(0) %}
              {% set attempt = state_attr('sensor.vehicle_primary_refresh_coordinator', 'attempt') | int(0) %}

              **Atualização dos dados**

              {% if refresh_state == 'refreshing' %}↻ **Atualizando dados**
              {% elif refresh_state == 'backoff' %}🟡 O Bluelink ainda não confirmou uma leitura nova.

              **Nova tentativa automática em {{ format_number_ptbr(remaining) }} s**{% if attempt > 0 %} · tentativa {{ format_number_ptbr(attempt) }}{% endif %}
              {% elif refresh_state == 'cooldown' %}🟢 **Dados atualizados**
              {% elif refresh_state == 'waiting' %}⚪ **Aguardando movimento**
              {% elif refresh_state in ['unknown', 'unavailable'] %}🔴 **Atualização indisponível**
              {% else %}⚪ **Atualização pronta**
              {% endif %}
          - type: tile
            entity: sensor.vehicle_primary_car_battery_level
            name: Bateria 12 V
            icon: mdi:car-battery
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.vehicle_primary_front_left_door
                name: Porta dianteira esquerda
              - entity: binary_sensor.vehicle_primary_front_right_door
                name: Porta dianteira direita
              - entity: binary_sensor.vehicle_primary_back_left_door
                name: Porta traseira esquerda
              - entity: binary_sensor.vehicle_primary_back_right_door
                name: Porta traseira direita
              - entity: binary_sensor.vehicle_primary_trunk
                name: Porta-malas
              - entity: binary_sensor.vehicle_primary_tire_pressure_all
                name: Alerta de pneus

  - title: Detalhes
    path: detalhes
    icon: mdi:car-info
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Viagens e consumo
            icon: mdi:map-marker-path
          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set trips = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'trips') or [] %}
              {% set efficiency = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'fuel_efficiency') or {} %}
              {% if efficiency.data_sufficient | default(false) %}
              ## {{ format_number_ptbr(efficiency.km_per_l, 2) }} km/L estimados

              Janela efetiva: {{ as_datetime(efficiency.trip_window_start).astimezone().strftime('%d/%m %H:%M') if efficiency.trip_window_start else 'indisponível' }}–{{ as_datetime(efficiency.trip_window_end).astimezone().strftime('%d/%m %H:%M') if efficiency.trip_window_end else 'indisponível' }}

              {{ format_number_ptbr(efficiency.trips_considered) }} de {{ format_number_ptbr(efficiency.trips_available) }} viagem(ns) · {{ format_number_ptbr(efficiency.estimated_distance, 1) }} km · {{ format_number_ptbr(efficiency.estimated_liters, 2) }} L
              {% else %}
              ## Dados insuficientes

              Janela pesquisada: até {{ format_number_ptbr(efficiency.search_window_days | default(0)) }} dias, conforme a retenção disponível do Recorder. A estimativa requer queda de combustível e odômetro antes/depois da mesma viagem.
              {% endif %}

              {% if trips %}
              {% for trip in trips %}
              ---
              **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} · {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}{% if trip.end_time %}–{{ trip.end_time }}{% endif %}**

              {{ format_number_ptbr(trip.distance, 1) }} km · {{ format_number_ptbr(trip.duration_min) }} min · média {{ format_number_ptbr(trip.avg_speed, 1) }} km/h

              {% if trip.estimated_km_per_l is defined %}
              ⛽ **{{ format_number_ptbr(trip.estimated_km_per_l, 2) }} km/L** nesta viagem
              {% elif efficiency.data_sufficient | default(false) %}
              ⛽ **{{ format_number_ptbr(efficiency.km_per_l, 2) }} km/L** · média da janela
              {% else %}
              ⛽ Consumo sem amostras suficientes
              {% endif %}
              {% endfor %}
              {% else %}
              **Nenhuma viagem disponível para hoje e ontem.**
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Histórico
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Motor e combustível · 48 horas
            hours_to_show: 48
            entities:
              - entity: binary_sensor.vehicle_primary_engine
                name: Motor
              - entity: sensor.vehicle_primary_fuel_level
                name: Combustível
          - type: history-graph
            title: Consumo estimado · 7 dias
            hours_to_show: 168
            entities:
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: km/L estimados

      - type: grid
        cards:
          - type: heading
            heading: Diagnóstico
            icon: mdi:stethoscope
          - type: markdown
            content: >-
              **Atualização automática orientada a eventos**

              Mudanças de zona ou deslocamentos GPS significativos solicitam uma nova leitura. O coordenador evita chamadas simultâneas, aplica backoff de **1, 2, 4, 8 e 15 minutos** e nunca acorda o veículo mais de uma vez dentro de 15 minutos.

              A consulta ao cache pode avançar sem acordar o carro; o refresh só é concluído quando um timestamp observado realmente muda.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.vehicle_primary_last_updated_at
                name: Estado confirmado em
              - entity: sensor.vehicle_primary_last_scanned_at
                name: Consulta executada em
              - entity: sensor.vehicle_primary_location_last_updated
                name: Último estacionamento confirmado
              - entity: sensor.garagem_vehicle_primary_recent_trip_info
                name: Viagens carregadas
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: Base de consumo
              - entity: sensor.vehicle_primary_refresh_coordinator
                name: Coordenador de refresh
              - entity: sensor.garagem_vehicle_primary_remote_command_status
                name: Último comando remoto
              - entity: sensor.integracao_vehicle_primary
                name: Manutenção da integração
