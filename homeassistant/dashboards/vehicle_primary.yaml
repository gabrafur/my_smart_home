title: Creta
views:
  - title: Visão geral
    path: vehicle_primary
    icon: mdi:car
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Estado
            icon: mdi:car-connected
          - type: markdown
            content: >-
              {% set engine = is_state('binary_sensor.vehicle_primary_engine', 'on') %}
              {% set updated = states('sensor.vehicle_primary_last_updated_at') %}
              {% set updated_ts = as_timestamp(updated, none) %}
              {% set age_min = ((as_timestamp(now()) - updated_ts) / 60) | round(0) if updated_ts else none %}

              # {{ 'Em uso' if engine else 'Estacionado' }}

              {% if age_min is none %}
              🔴 Sem telemetria válida
              {% elif age_min <= 15 %}
              🟢 Atualizado há {{ age_min | int }} min
              {% elif age_min <= 90 %}
              🟡 Leitura de {{ age_min | int }} min atrás
              {% else %}
              🔴 Leitura de {{ age_min | int }} min atrás
              {% endif %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.vehicle_primary_fuel_level
                name: Combustível
                icon: mdi:gas-station
              - type: tile
                entity: sensor.garagem_vehicle_primary_total_driving_range
                name: Autonomia
                icon: mdi:map-marker-distance
              - type: markdown
                content: >-
                  {% set odometer = states('sensor.garagem_vehicle_primary_odometer') %}
                  **Odômetro**

                  ## {{ ('{:,.0f}'.format(odometer | float) | replace(',', '.')) ~ ' km' if is_number(odometer) else 'Indisponível' }}
              - type: markdown
                content: >-
                  {% set entity = states.sensor.garagem_vehicle_primary_estimated_fuel_efficiency %}
                  {% set value = entity.state if entity else 'unknown' %}
                  {% set trips = entity.attributes.trips_considered | default(0) if entity else 0 %}
                  {% set window_days = entity.attributes.search_window_days | default(0) if entity else 0 %}
                  **Consumo estimado**

                  {% if value not in ['unknown', 'unavailable', 'none'] %}
                  ## {{ value }} km/L
                  {{ trips }} viagem(ns) · até {{ window_days }} dias
                  {% else %}
                  ## Dados insuficientes
                  Janela pesquisada: até {{ window_days }} dias
                  {% endif %}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: binary_sensor.vehicle_primary_engine
                name: Motor
                icon: mdi:engine
              - type: tile
                entity: lock.vehicle_primary_door_lock
                name: Travas
              - type: tile
                entity: binary_sensor.vehicle_primary_fuel_low_level
                name: Reserva
                icon: mdi:fuel

      - type: grid
        cards:
          - type: heading
            heading: Localização e viagens
            icon: mdi:map-marker
          - type: map
            entities:
              - entity: device_tracker.vehicle_primary
            hours_to_show: 12
            default_zoom: 15
          - type: markdown
            content: >-
              {% set trips = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'trips') or [] %}
              {% set efficiency = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'fuel_efficiency') or {} %}
              {% if trips %}
              **{{ trips | length }} viagem(ns) recentes**

              {% if efficiency.km_per_l is defined and efficiency.km_per_l is not none %}
              ⛽ {{ efficiency.km_per_l }} km/L · {{ efficiency.estimated_distance }} km analisados
              {% endif %}

              {% for trip in trips[:2] %}
              **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}** · {{ trip.distance }} km · {{ trip.duration_min }} min
              {% endfor %}

              {% if trips | length > 2 %}
              *Mais viagens em Detalhes.*
              {% endif %}
              {% else %}
              **Nenhuma viagem recente.**
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Ações e alertas
            icon: mdi:car-key
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: input_button.vehicle_primary_force_refresh_now
                name: Atualizar
                icon: mdi:refresh
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: input_button.press
                  target:
                    entity_id: input_button.vehicle_primary_force_refresh_now
                hold_action:
                  action: none
              - type: tile
                entity: button.vehicle_primary_start_hazard_lights_and_horn
                name: Localizar
                icon: mdi:car-emergency
                hide_state: true
                tap_action:
                  action: none
                hold_action:
                  action: perform-action
                  perform_action: public_bindings.call
                  data:
                    role: vehicle_primary
                    action: locate
                  confirmation:
                    text: Acionar a buzina e as luzes do Creta por aproximadamente 30 segundos?
          - type: markdown
            content: >-
              {% set refresh = states.sensor.vehicle_primary_refresh_coordinator %}
              {% set refresh_state = refresh.state if refresh else 'unavailable' %}
              {% set remaining = state_attr('sensor.vehicle_primary_refresh_coordinator', 'remaining_seconds') | int(0) %}
              {% set command = states('sensor.garagem_vehicle_primary_remote_command_status') %}

              {% if refresh_state == 'refreshing' %}↻ **Atualizando dados**
              {% elif refresh_state == 'backoff' %}🟡 **Nova tentativa em {{ remaining }} s**
              {% elif refresh_state == 'cooldown' %}🟢 **Dados atualizados**
              {% elif refresh_state == 'waiting' %}⚪ **Aguardando movimento**
              {% elif refresh_state in ['unknown', 'unavailable'] %}🔴 **Atualização indisponível**
              {% else %}⚪ **Atualização pronta**
              {% endif %}

              {% if command == 'requesting' %}↻ **Localizando veículo**
              {% elif command == 'accepted' %}🟢 **Localização acionada**
              {% elif command in ['failed', 'cooldown'] %}🔴 **Falha no último comando**
              {% else %}
              Segure **Localizar** para acionar luzes e buzina.
              {% endif %}
          - type: tile
            entity: sensor.vehicle_primary_car_battery_level
            name: Bateria 12 V
            icon: mdi:car-battery
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.vehicle_primary_front_left_door
                name: Porta dianteira esquerda
              - entity: binary_sensor.vehicle_primary_front_right_door
                name: Porta dianteira direita
              - entity: binary_sensor.vehicle_primary_back_left_door
                name: Porta traseira esquerda
              - entity: binary_sensor.vehicle_primary_back_right_door
                name: Porta traseira direita
              - entity: binary_sensor.vehicle_primary_trunk
                name: Porta-malas
              - entity: binary_sensor.vehicle_primary_tire_pressure_all
                name: Alerta de pneus

  - title: Detalhes
    path: detalhes
    icon: mdi:car-info
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Viagens e consumo
            icon: mdi:map-marker-path
          - type: markdown
            content: >-
              {% set trips = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'trips') or [] %}
              {% set efficiency = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'fuel_efficiency') or {} %}
              {% if efficiency.data_sufficient | default(false) %}
              ## {{ efficiency.km_per_l }} km/L estimados

              Janela efetiva: {{ as_datetime(efficiency.trip_window_start).astimezone().strftime('%d/%m %H:%M') if efficiency.trip_window_start else 'indisponível' }}–{{ as_datetime(efficiency.trip_window_end).astimezone().strftime('%d/%m %H:%M') if efficiency.trip_window_end else 'indisponível' }}

              {{ efficiency.trips_considered }} de {{ efficiency.trips_available }} viagem(ns) · {{ efficiency.estimated_distance }} km · {{ efficiency.estimated_liters }} L
              {% else %}
              ## Dados insuficientes

              Janela pesquisada: até {{ efficiency.search_window_days | default(0) }} dias, conforme a retenção disponível do Recorder. A estimativa requer queda de combustível e odômetro antes/depois da mesma viagem.
              {% endif %}

              {% if trips %}
              {% for trip in trips %}
              ---
              **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} · {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}{% if trip.end_time %}–{{ trip.end_time }}{% endif %}**

              {{ trip.distance }} km · {{ trip.duration_min }} min · média {{ trip.avg_speed }} km/h

              {% if trip.estimated_km_per_l is defined %}
              ⛽ **{{ trip.estimated_km_per_l }} km/L** nesta viagem
              {% elif efficiency.data_sufficient | default(false) %}
              ⛽ **{{ efficiency.km_per_l }} km/L** · média da janela
              {% else %}
              ⛽ Consumo sem amostras suficientes
              {% endif %}
              {% endfor %}
              {% else %}
              **Nenhuma viagem disponível para hoje e ontem.**
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Histórico
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Motor e combustível · 48 horas
            hours_to_show: 48
            entities:
              - entity: binary_sensor.vehicle_primary_engine
                name: Motor
              - entity: sensor.vehicle_primary_fuel_level
                name: Combustível
          - type: history-graph
            title: Consumo estimado · 7 dias
            hours_to_show: 168
            entities:
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: km/L estimados

      - type: grid
        cards:
          - type: heading
            heading: Diagnóstico
            icon: mdi:stethoscope
          - type: markdown
            content: >-
              **Atualização automática orientada a eventos**

              Mudanças de zona ou deslocamentos GPS significativos solicitam uma nova leitura. O coordenador evita chamadas simultâneas, aplica backoff de **1, 2, 4, 8 e 15 minutos** e nunca acorda o veículo mais de uma vez dentro de 15 minutos.

              A consulta ao cache pode avançar sem acordar o carro; o refresh só é concluído quando um timestamp observado realmente muda.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.vehicle_primary_last_updated_at
                name: Estado confirmado em
              - entity: sensor.vehicle_primary_last_scanned_at
                name: Consulta executada em
              - entity: sensor.vehicle_primary_location_last_updated
                name: Posição confirmada em
              - entity: sensor.garagem_vehicle_primary_recent_trip_info
                name: Viagens carregadas
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: Base de consumo
              - entity: sensor.vehicle_primary_refresh_coordinator
                name: Coordenador de refresh
              - entity: sensor.garagem_vehicle_primary_remote_command_status
                name: Último comando remoto
              - entity: sensor.integracao_vehicle_primary
                name: Manutenção da integração
