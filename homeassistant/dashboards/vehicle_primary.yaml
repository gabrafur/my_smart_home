title: vehicle_primary
views:
  - title: vehicle_primary
    path: vehicle_primary
    icon: mdi:car
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Estado do veículo
            icon: mdi:car-connected
          - type: markdown
            content: >-
              {% set engine = is_state('binary_sensor.vehicle_primary_engine', 'on') %}
              {% set location = states('device_tracker.vehicle_primary') %}
              {% set updated = states('sensor.vehicle_primary_last_updated_at') %}
              {% set updated_ts = as_timestamp(updated, none) %}
              {% set age_min = ((as_timestamp(now()) - updated_ts) / 60) | round(0) if updated_ts else none %}

              # {{ 'Em uso' if engine else 'Estacionado' }}

              **Local:** {{ state_attr('device_tracker.vehicle_primary', 'friendly_name') if location in ['unknown', 'unavailable'] else location | replace('_', ' ') | title }}

              {% if age_min is none %}
              🔴 **Sem telemetria válida** · aguardando dados do Bluelink.
              {% elif age_min <= 15 %}
              🟢 **Dados recentes** · atualizados há {{ age_min | int }} min.
              {% elif age_min <= 90 %}
              🟡 **Dados em cache** · última leitura há {{ age_min | int }} min.
              {% else %}
              🔴 **Dados antigos** · última leitura há {{ age_min | int }} min.
              {% endif %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.vehicle_primary_fuel_level
                name: Combustível
                icon: mdi:gas-station
              - type: tile
                entity: sensor.garagem_vehicle_primary_total_driving_range
                name: Autonomia
                icon: mdi:map-marker-distance
              - type: tile
                entity: sensor.garagem_vehicle_primary_odometer
                name: Odômetro
                icon: mdi:speedometer
              - type: markdown
                content: >-
                  {% set entity = states.sensor.garagem_vehicle_primary_estimated_fuel_efficiency %}
                  {% set value = entity.state if entity else 'unknown' %}
                  {% set trips = entity.attributes.trips_considered | default(0) if entity else 0 %}
                  **Consumo estimado**

                  {% if value not in ['unknown', 'unavailable', 'none'] %}
                  ## {{ value }} km/L
                  {{ trips }} viagem(ns) com amostras confiáveis
                  {% else %}
                  ## Dados insuficientes
                  Janela pesquisada: hoje e ontem.
                  {% endif %}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: binary_sensor.vehicle_primary_engine
                name: Motor
                icon: mdi:engine
              - type: tile
                entity: lock.vehicle_primary_door_lock
                name: Travas
              - type: tile
                entity: binary_sensor.vehicle_primary_fuel_low_level
                name: Reserva
                icon: mdi:fuel
          - type: heading
            heading: Localização
            icon: mdi:map-marker
          - type: map
            entities:
              - entity: device_tracker.vehicle_primary
            hours_to_show: 12
            default_zoom: 15
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.vehicle_primary_location_last_updated
                name: Posição recebida em
              - entity: sensor.vehicle_primary_last_updated_at
                name: Telemetria confirmada em

      - type: grid
        cards:
          - type: heading
            heading: Atualização dos dados
            icon: mdi:cloud-sync
          - type: markdown
            content: >-
              {% set refresh = states.sensor.vehicle_primary_refresh_coordinator %}
              {% set state = refresh.state if refresh else 'unavailable' %}
              {% set remaining = state_attr('sensor.vehicle_primary_refresh_coordinator', 'remaining_seconds') | int(0) %}
              {% set attempt = state_attr('sensor.vehicle_primary_refresh_coordinator', 'attempt') | int(0) %}
              {% set last_vehicle = states('sensor.vehicle_primary_last_updated_at') %}
              {% set last_scan = states('sensor.vehicle_primary_last_scanned_at') %}
              {% set reason = state_attr('sensor.vehicle_primary_refresh_coordinator', 'reason') %}

              {% if state == 'refreshing' %}
              ## ↻ Consultando Bluelink
              Tentativa {{ attempt }} · {{ reason | default('atualização automática', true) | replace('_', ' ') }}
              {% elif state == 'backoff' %}
              ## 🟡 Aguardando nova tentativa
              Tentativa {{ attempt }} · em {{ remaining }} s
              {% elif state == 'cooldown' %}
              ## 🟢 Atualizado
              Próximo refresh em {{ (remaining / 60) | round(0, 'floor') | int }} min {{ remaining % 60 }} s
              {% elif state == 'waiting' %}
              ## ⚪ Aguardando movimento
              O próximo refresh será solicitado por movimento ou mudança de zona.
              {% elif state in ['unknown', 'unavailable'] %}
              ## 🔴 Coordenador indisponível
              Aguardando a telemetria do Node-RED.
              {% else %}
              ## ⚪ Pronto
              Próxima decisão automática em até 30 s.
              {% endif %}

              **Veículo:** {{ relative_time(as_datetime(last_vehicle)) if last_vehicle not in ['unknown', 'unavailable'] else 'sem leitura válida' }}<br>
              **Bluelink:** {{ relative_time(as_datetime(last_scan)) if last_scan not in ['unknown', 'unavailable'] else 'sem leitura válida' }}
          - type: button
            entity: input_button.vehicle_primary_force_refresh_now
            name: Forçar atualização agora
            icon: mdi:refresh
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.vehicle_primary_force_refresh_now
            hold_action:
              action: none
          - type: heading
            heading: Viagens recentes
            icon: mdi:map-marker-path
          - type: markdown
            content: >-
              {% set trips = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'trips') or [] %}
              {% set efficiency = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'fuel_efficiency') or {} %}
              {% if trips %}
              **{{ trips | length }} viagem(ns) nos últimos dois dias**

              {% if efficiency.km_per_l is defined and efficiency.km_per_l is not none %}
              ⛽ {{ efficiency.km_per_l }} km/L estimados · {{ efficiency.estimated_distance }} km analisados
              {% endif %}

              {% for trip in trips[:3] %}
              ---
              **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} · {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}{% if trip.end_time %}–{{ trip.end_time }}{% endif %}**

              {{ trip.distance }} km · {{ trip.duration_min }} min · média {{ trip.avg_speed }} km/h{% if trip.estimated_km_per_l is defined %} · {{ trip.estimated_km_per_l }} km/L{% endif %}
              {% endfor %}

              {% if trips | length > 3 %}
              *Veja todas as viagens na aba Detalhes.*
              {% endif %}
              {% else %}
              **Nenhuma viagem disponível para hoje e ontem.**
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Comandos do veículo
            icon: mdi:car-key
          - type: markdown
            content: >-
              {% set command = states('sensor.garagem_vehicle_primary_remote_command_status') %}
              {% if command == 'requesting' %}
              ## ↻ Localizando veículo...
              Aguardando confirmação do Bluelink.
              {% elif command == 'accepted' %}
              ## 🟢 Comando aceito pelo Bluelink
              Buzina e luzes acionadas por aproximadamente 30 segundos.
              {% elif command in ['failed', 'cooldown'] %}
              ## 🔴 Não foi possível acionar o veículo
              Consulte os detalhes do último comando antes de tentar novamente.
              {% else %}
              **Localizar veículo**

              O comando oficial aciona buzina e luzes por aproximadamente 30 segundos.
              {% endif %}
          - type: button
            entity: button.vehicle_primary_start_hazard_lights_and_horn
            name: Localizar veículo · segure para acionar
            icon: mdi:car-emergency
            show_state: false
            tap_action:
              action: none
            hold_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.vehicle_primary_start_hazard_lights_and_horn
              confirmation:
                text: Acionar a buzina e as luzes do vehicle_primary por aproximadamente 30 segundos?
          - type: heading
            heading: Alertas e confiabilidade
            icon: mdi:car-battery
          - type: markdown
            content: >-
              {% set battery = states('sensor.vehicle_primary_car_battery_level') %}
              {% if battery not in ['unknown', 'unavailable'] %}
              ## Bateria 12 V: {{ battery }}%
              Leitura confiável recebida do veículo.
              {% else %}
              ## Bateria 12 V: aguardando leitura
              O valor bruto foi descartado por baixa confiabilidade.
              {% endif %}
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.vehicle_primary_front_left_door
                name: Porta dianteira esquerda
              - entity: binary_sensor.vehicle_primary_front_right_door
                name: Porta dianteira direita
              - entity: binary_sensor.vehicle_primary_back_left_door
                name: Porta traseira esquerda
              - entity: binary_sensor.vehicle_primary_back_right_door
                name: Porta traseira direita
              - entity: binary_sensor.vehicle_primary_trunk
                name: Porta-malas
              - entity: binary_sensor.vehicle_primary_tire_pressure_all
                name: Alerta de pneus

  - title: Detalhes
    path: detalhes
    icon: mdi:car-info
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Viagens e consumo
            icon: mdi:map-marker-path
          - type: markdown
            content: >-
              {% set trips = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'trips') or [] %}
              {% set efficiency = state_attr('sensor.garagem_vehicle_primary_recent_trip_info', 'fuel_efficiency') or {} %}
              {% if efficiency.data_sufficient %}
              ## {{ efficiency.km_per_l }} km/L estimados

              Janela efetiva: {{ as_datetime(efficiency.trip_window_start).astimezone().strftime('%d/%m %H:%M') if efficiency.trip_window_start else 'indisponível' }}–{{ as_datetime(efficiency.trip_window_end).astimezone().strftime('%d/%m %H:%M') if efficiency.trip_window_end else 'indisponível' }}

              {{ efficiency.trips_considered }} de {{ efficiency.trips_available }} viagem(ns) · {{ efficiency.estimated_distance }} km · {{ efficiency.estimated_liters }} L
              {% else %}
              ## Dados insuficientes

              Janela pesquisada: hoje e ontem. A estimativa requer queda de combustível e odômetro antes/depois da mesma viagem.
              {% endif %}

              {% if trips %}
              {% for trip in trips %}
              ---
              **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} · {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}{% if trip.end_time %}–{{ trip.end_time }}{% endif %}**

              {{ trip.distance }} km · {{ trip.duration_min }} min · média {{ trip.avg_speed }} km/h{% if trip.estimated_km_per_l is defined %} · **{{ trip.estimated_km_per_l }} km/L**{% endif %}
              {% endfor %}
              {% else %}
              **Nenhuma viagem disponível para hoje e ontem.**
              {% endif %}
          - type: heading
            heading: Histórico
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Motor e combustível · 48 horas
            hours_to_show: 48
            entities:
              - entity: binary_sensor.vehicle_primary_engine
                name: Motor
              - entity: sensor.vehicle_primary_fuel_level
                name: Combustível
          - type: history-graph
            title: Consumo estimado · 7 dias
            hours_to_show: 168
            entities:
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: km/L estimados

      - type: grid
        cards:
          - type: heading
            heading: Diagnóstico
            icon: mdi:stethoscope
          - type: markdown
            content: >-
              **Atualização automática orientada a eventos**

              Mudanças de zona ou deslocamentos GPS significativos solicitam uma nova leitura. O coordenador evita chamadas simultâneas, aplica backoff de **1, 2, 4, 8 e 15 minutos** e nunca acorda o veículo mais de uma vez dentro de 15 minutos.

              A consulta ao cache pode avançar sem acordar o carro; o refresh só é concluído quando um timestamp observado realmente muda.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.vehicle_primary_last_updated_at
                name: Estado confirmado em
              - entity: sensor.vehicle_primary_last_scanned_at
                name: Consulta executada em
              - entity: sensor.vehicle_primary_location_last_updated
                name: Posição confirmada em
              - entity: sensor.garagem_vehicle_primary_recent_trip_info
                name: Viagens carregadas
              - entity: sensor.garagem_vehicle_primary_estimated_fuel_efficiency
                name: Base de consumo
              - entity: sensor.vehicle_primary_refresh_coordinator
                name: Coordenador de refresh
              - entity: sensor.garagem_vehicle_primary_remote_command_status
                name: Último comando remoto
              - entity: sensor.integracao_vehicle_primary
                name: Manutenção da integração
