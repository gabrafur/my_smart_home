              da métrica antiga e não representa cobrança oficial da OpenAI.

          - type: statistics-graph
            title: Chamadas operacionais — últimos 7 dias
            chart_type: bar
            period: day
            days_to_show: 7
            stat_types:
              - max
            entities:
