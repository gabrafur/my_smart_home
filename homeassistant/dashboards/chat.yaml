          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set totals = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('totals') or {} %}
              {% set calls = totals.get('operational_calls', 0) | int(0) %}
              {% set failed = totals.get('operational_failed_calls', 0) | int(0) %}
              {% set completed = [calls - failed, 0] | max %}
              {% set accepted = totals.get('operational_quality_validated_calls', 0) | int(0) %}
              {% set rejected = totals.get('operational_quality_rejected_calls', 0) | int(0) %}
              {% set not_beneficial = totals.get('operational_not_beneficial_calls', 0) | int(0) %}
              {% set gated = accepted + rejected + not_beneficial %}
              {% set unclassified = [completed - gated, 0] | max %}
              {% set approved = accepted + not_beneficial %}
              {% set accepted_measured = totals.get('operational_quality_validated_measured_calls', 0) | int(0) %}
              {% set accepted_unmeasured = [accepted - accepted_measured, 0] | max %}
              {% set primary_used = totals.get('operational_primary_context_used_calls', 0) | int(0) %}
              {% set usage_unconfirmed = totals.get('operational_primary_context_unconfirmed_calls', 0) | int(0) %}
              {% set gate_unmeasured = totals.get('quality_validation_unmeasured_calls', 0) | int(0) %}
              {% set unmeasured_gross = totals.get('quality_validation_unmeasured_gross_tokens', 0) | float(0) %}
              **Reconciliação:** tentativas = sem falha técnica + falhas técnicas;
              sem falha técnica = sem classificação + avaliados pelo gate;
              avaliados = rejeitados + fidelidade aprovada; fidelidade aprovada =
              fiéis sem ganho + aprovados sem custo mensurável + aprovados com custo mensurado.

              **Conferência atual:** {{ format_number_ptbr(calls) }} =
              {{ format_number_ptbr(completed) }} + {{ format_number_ptbr(failed) }};
              {{ format_number_ptbr(completed) }} = {{ format_number_ptbr(unclassified) }} +
              {{ format_number_ptbr(gated) }}; {{ format_number_ptbr(gated) }} =
              {{ format_number_ptbr(rejected) }} + {{ format_number_ptbr(approved) }};
              {{ format_number_ptbr(approved) }} = {{ format_number_ptbr(not_beneficial) }} +
              {{ format_number_ptbr(accepted_unmeasured) }} + {{ format_number_ptbr(accepted_measured) }};
              {{ format_number_ptbr(accepted_measured) }} =
              {{ format_number_ptbr(usage_unconfirmed) }} + {{ format_number_ptbr(primary_used) }}.

              {% if accepted_unmeasured > 0 %}
              ⚠️ {{ format_number_ptbr(accepted_unmeasured) }} resultados aprovados
              não têm custo do verificador separável. Seus {{ format_number_ptbr(unmeasured_gross) }}
              tokens brutos auditáveis valem zero no saldo líquido. Ao todo,
              {{ format_number_ptbr(gate_unmeasured) }} avaliações antigas não têm
              custo separável, incluindo resultados rejeitados que já valem zero.
              {% endif %}

              **Fora do waterfall operacional:** {{ format_number_ptbr(totals.get('diagnostic_calls', 0)) }}
              benchmarks diagnósticos.

              **Fallbacks explicitamente informados:** {{ format_number_ptbr(totals.get('fallbacks_reported', 0)) }}.
              Essa contagem se sobrepõe a falhas e descartes; por isso não é
              somada como uma etapa independente do waterfall.

              **Como ler:** os indicadores de chamadas e resultados explicitam
              cada saída do fluxo até um resultado utilizável e mensurável. Os quatro últimos mudam para tokens:
              contexto OpenAI evitado, aprovado e entregue ao modelo principal − tokens locais de entrada e
              saída do gate desses resultados = saldo líquido equivalente. Como os
              tokenizadores são diferentes, esse saldo é um índice conservador,
              não uma contagem faturável. A redução útil divide o saldo pela base
              contrafactual: tokens Codex totais preservados + saldo útil. Falhas,
              rejeições, fallbacks, uso não confirmado e demais tokens fora dos
              resultados úteis permanecem no denominador e valem zero no numerador.

