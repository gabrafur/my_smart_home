                name: Usados pelo chat
                color: green
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_total_codex_tokens
                name: Tokens totais
                color: blue
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_total_attempted
                name: Contexto tentado
                color: blue
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_total_gross
                name: Contexto evitado
                color: blue
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_total_gate
                name: Custo da validação
                color: amber
                vertical: true
              - type: tile
