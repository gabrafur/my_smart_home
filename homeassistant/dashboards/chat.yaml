title: Chat
views:
  - title: Codex
    path: codex
    icon: mdi:robot-outline
    panel: true
    cards:
      - type: custom:codex-chat-card-v2
        title: Codex
        history_limit: 200
  - title: Uso
    path: uso-codex
    icon: mdi:chart-donut
    cards:
      - type: markdown
        content: |
          # Uso do Codex monitorado neste host

          {% set totals = state_attr('sensor.codex_usage_raw', 'totals') or {} %}
          {% set limite = state_attr('sensor.codex_usage_raw', 'rate_limit') or {} %}
          {% set reset_em = limite.get('resets_at') %}
          {% if states('sensor.codex_usage_raw') == 'ok' %}
          **Uso monitorado:** {{ '{:,.0f}'.format(totals.get('total_tokens', 0) | int).replace(',', '.') }} tokens em
          {{ totals.get('sessions', 0) | int }} sessões do bridge e do Codex local.

          {% if states('sensor.codex_dados_de_limite') == 'atual' and is_number(states('sensor.codex_limite_disponivel')) %}
          **Plano {{ states('sensor.codex_plano') | title }}:**
          {{ states('sensor.codex_limite_disponivel') | round(0) }}% disponível
          ({{ states('sensor.codex_limite_usado') | round(0) }}% usado).
          {% elif limite.get('remaining_percent') is number %}
          **Última leitura do limite:** {{ limite.get('remaining_percent') | round(0) }}% disponível
          ({{ limite.get('used_percent') | round(0) }}% usado). Este dado está desatualizado e
          não é usado em alertas nem projeções.
          {% else %}
          Ainda não há uma leitura do limite do plano.
          {% endif %}

          {% if reset_em %}
          **Próximo reset:** {{ as_timestamp(reset_em) | timestamp_custom('%d/%m às %H:%M', true) }}.
          {% endif %}
          {% else %}
          Aguardando a primeira métrica do Codex CLI.
          {% endif %}

          _Atualização local em até 2 segundos, sem chamada à API nem consumo do plano._

      - type: grid
        title: Última leitura do limite do plano
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.codex_limite_usado
            name: Usado
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 70
              red: 90
          - type: gauge
            entity: sensor.codex_limite_disponivel
            name: Disponível
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 10
              green: 30

      - type: entities
        title: Saldo e renovação
        show_header_toggle: false
        entities:
          - entity: sensor.codex_dados_de_limite
            name: Dados do limite
          - entity: sensor.codex_creditos_extras
            name: Créditos extras
          - entity: sensor.codex_plano
            name: Plano
          - entity: sensor.codex_proximo_reset
            name: Próximo reset
          - entity: sensor.codex_ultima_atualizacao_do_limite
            name: Atualização do limite
          - entity: sensor.codex_ultima_metrica
            name: Última atividade registrada
          - entity: sensor.codex_usage_raw
            name: Estado da coleta
          - entity: script.codex_atualizar_uso_agora
            name: Atualizar agora
            icon: mdi:refresh

      - type: markdown
        content: >-
          ## Autonomia

          {% set previsao = states('sensor.codex_previsao_ate_o_reset') %}
          {% if states('sensor.codex_dados_de_limite') != 'atual' %}
          ⏳ A projeção do limite aguarda uma leitura atual do Codex.
          {% elif previsao == 'aguenta' %}
          ✅ **No ritmo atual, o limite aguenta até o reset**, com
          aproximadamente **{{ states('sensor.codex_folga_projetada_no_reset') }}% de folga**.
          {% elif previsao == 'atenção' %}
          ⚠️ **Deve aguentar, mas com pouca folga.** A projeção chega a
          {{ states('sensor.codex_uso_projetado_no_reset') }}% no reset.
          {% elif previsao == 'não aguenta' %}
          🔴 **O ritmo atual pode esgotar o limite antes do reset.**
          {% else %}
          ⏳ Ainda não há tempo suficiente nesta janela para uma projeção confiável.
          {% endif %}

          Confiança da estimativa: **{{ state_attr('sensor.codex_previsao_ate_o_reset', 'confianca') | default('baixa', true) }}**.

      - type: grid
        title: Eficiência e projeção
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.codex_eficiencia_de_cache
            name: Eficiência de cache
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 30
              green: 60
          - type: gauge
            entity: sensor.codex_uso_projetado_no_reset
            name: Uso projetado no reset
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 90
              red: 100

      - type: entities
        title: Velocidade de consumo
        show_header_toggle: false
        entities:
          - entity: sensor.codex_previsao_ate_o_reset
            name: Aguenta até o reset?
          - entity: sensor.codex_velocidade_7_dias
            name: Média de tokens — 7 dias
          - entity: sensor.codex_ritmo_do_limite
            name: Ritmo médio do limite
          - entity: sensor.codex_folga_projetada_no_reset
            name: Folga projetada

      - type: grid
        title: Consumo registrado neste bridge
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.codex_tokens_totais
            name: Tokens totais
          - type: tile
            entity: sensor.codex_tokens_em_cache
            name: Tokens em cache
          - type: tile
            entity: sensor.codex_tokens_de_saida
            name: Tokens de saída
          - type: tile
            entity: sensor.codex_sessoes_monitoradas
            name: Sessões monitoradas

      - type: history-graph
        title: Uso do limite — últimos 7 dias
        hours_to_show: 168
        entities:
          - entity: sensor.codex_limite_usado
            name: Usado

      - type: entities
        title: Alertas e notificações
        show_header_toggle: false
        entities:
          - entity: sensor.codex_nivel_de_alerta
            name: Situação atual
          - entity: input_boolean.codex_alertas_iphone
          - entity: input_boolean.codex_resumo_diario_iphone
          - entity: input_number.codex_alerta_aviso_percentual
          - entity: input_number.codex_alerta_critico_percentual
          - entity: input_number.codex_alerta_cache_minimo
          - entity: input_number.codex_alerta_saldo_creditos
          - entity: input_text.codex_ultimo_alerta_iphone
          - entity: input_datetime.codex_ultimo_alerta_iphone_em

      - type: markdown
        content: >-
          **Como ler estes números**

          O limite do plano e o saldo extra vêm dos eventos locais do Codex CLI.
          Uma leitura de limite com mais de dois minutos fica marcada como desatualizada;
          ainda aparece como último valor conhecido, mas não alimenta alertas nem projeções.
          Os tokens somam apenas as sessões preservadas pelo bridge deste host;
          usos feitos em outros computadores podem não aparecer nessa soma.

          “Eficiência de cache” mede quantos tokens de entrada foram reaproveitados;
          ela reduz trabalho repetido, mas não mede a qualidade semântica das respostas.
          A autonomia é uma projeção linear do ritmo médio da janela atual e pode
          mudar se o uso acelerar.

          O saldo oficial da conta continua disponível em **Codex → Settings → Usage**.

  - title: RTX 4070
    path: uso-rtx
    icon: mdi:expansion-card-variant
    cards:
      - type: markdown
        content: >-
          # RTX 4070 / Local AI

          {% set live = states('sensor.codex_rtx_ao_vivo') %}
          {% if live == 'em uso' %}
          🟢 **Inferência local ativa** — {{ state_attr('sensor.codex_rtx_ao_vivo', 'tarefa') }} ·
          {{ state_attr('sensor.codex_rtx_ao_vivo', 'modelo') }}.
          {% elif live == 'desatualizado' %}
          🟡 **Sinal da RTX desatualizado.** A última verificação de saúde tem mais de dois
          minutos; aguardando a próxima confirmação do bridge antes de afirmar que a RTX está pronta.
          {% elif live == 'sem sinal' %}
          🔴 **Sem sinal do bridge Local AI.** O painel tentará novamente automaticamente.
          {% else %}
          ⚪ RTX pronta para o Codex; aguardando uma tarefa elegível.
          {% endif %}

          Atualização do job ativo: aproximadamente uma vez por segundo; a confirmação de
          disponibilidade é renovada pelo bridge a cada minuto.

          {% set chats = state_attr('sensor.codex_rtx_ao_vivo', 'chats_ativos') or [] %}
          {% if chats %}
          ## Chats usando a RTX agora

          {% for chat in chats %}
          - **{{ chat.chat_name or ('Chat Codex #' ~ chat.chat_id) }}** — {{ chat.task }} · {{ chat.model }} ·
            GPU {{ chat.gpu_util_percent if chat.gpu_util_percent is not none else 'amostrando' }}% ·
            VRAM {{ chat.vram_mib if chat.vram_mib is not none else 'amostrando' }} MiB
          {% endfor %}

          Nomes explícitos enviados pelo chat aparecem aqui; caso contrário, o
          identificador curto é usado sem revelar conteúdo da conversa.
          {% endif %}

      - type: grid
        title: Atualização
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.codex_rtx_ultima_atualizacao
            name: Última atualização
          - type: button
            name: Atualizar agora
            icon: mdi:refresh
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.codex_atualizar_rtx_agora

      - type: grid
        title: RTX ao vivo
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.codex_rtx_ao_vivo
            name: Estado
          - type: tile
            entity: sensor.codex_rtx_gpu_agora
            name: GPU agora
          - type: tile
            entity: sensor.codex_rtx_vram_agora
            name: VRAM agora
          - type: tile
            entity: sensor.codex_rtx_potencia_agora
            name: Potência agora

      - type: grid
        title: Infraestrutura Local AI
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.codex_local_ai_status
            name: Local AI
          - type: tile
            entity: sensor.codex_rtx_4070
            name: RTX 4070
          - type: tile
            entity: sensor.codex_ollama_local
            name: Ollama
          - type: tile
            entity: sensor.codex_modelo_local
            name: Modelo local

      - type: grid
        title: Roteamento inteligente — hoje
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.codex_decisoes_de_roteamento_hoje
            name: Tarefas avaliadas
          - type: tile
            entity: sensor.codex_tarefas_local_ai_elegiveis_hoje
            name: Local AI elegível
          - type: tile
            entity: sensor.codex_rtx_usos_hoje
            name: RTX usada
          - type: tile
            entity: sensor.codex_oportunidades_rtx_perdidas_hoje
            name: Oportunidades perdidas
          - type: tile
            entity: sensor.codex_local_ai_indisponivel_hoje
            name: RTX indisponível
          - type: tile
            entity: sensor.codex_chamadas_local_ai_desnecessarias_hoje
            name: Chamadas desnecessárias

      - type: grid
        title: Cobertura de economia de contexto
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.codex_taxa_de_delegacao_rtx
            name: Taxa de delegação RTX
          - type: tile
            entity: sensor.codex_cobertura_ponderada_de_economia_rtx
            name: Cobertura ponderada
          - type: tile
            entity: sensor.codex_tokens_potenciais_evitaveis_estimados
            name: Potencial evitável
          - type: tile
            entity: sensor.codex_tokens_openai_evitados_hoje_estimados
            name: Evitado hoje

      - type: grid
        title: Contexto e memória — hoje
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.codex_contexto_inicial_observavel
            name: Startup observável
          - type: tile
            entity: sensor.codex_memoria_recuperada_hoje
            name: Memória recuperada
          - type: tile
            entity: sensor.codex_memoria_enviada_ao_modelo_principal_hoje
            name: Enviada ao GPT
          - type: tile
            entity: sensor.codex_contexto_de_memoria_evitado_hoje
            name: Contexto evitado
          - type: tile
            entity: sensor.codex_compressao_de_memoria
            name: Compressão de memória
          - type: tile
            entity: sensor.codex_sobrecargas_de_memoria_hoje
            name: Sobrecargas

      - type: markdown
        content: >-
          {% set memory = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('memory') or {} %}
          {% set startup = memory.get('startup_context') or {} %}
          {% set today = (memory.get('periods') or {}).get('today') or {} %}
          ## Startup context

          **AGENTS / instructions observáveis:** ~{{ startup.get('observable_startup_context_tokens', 0) }} tokens
          (global: ~{{ startup.get('global_agents_tokens', 0) }} · repositório: ~{{ startup.get('repo_agents_tokens', 0) }}).

          **Repo memory preload:** {{ startup.get('repo_memory_tokens', 0) }} tokens ·
          **Retrieved memory:** ~{{ today.get('memory_tokens_retrieved', 0) }} tokens ·
          **Sent to primary model:** ~{{ today.get('memory_tokens_sent_to_primary_model', 0) }} tokens ·
          **Memory avoided:** ~{{ today.get('memory_tokens_avoided', 0) }} tokens.

          {% if startup.get('total_startup_context_tokens') is none %}
          O envelope interno do Codex e a memória privada automática não expõem contagem de tokens; este card mostra somente o contexto observável e indica estimativas quando aplicável.
          {% endif %}

      - type: entities
        title: Última decisão de memória
        show_header_toggle: false
        entities:
          - entity: sensor.codex_ultima_decisao_de_memoria
            name: Decisão

      - type: markdown
        content: >-
          {% set decision = state_attr('sensor.codex_usage_raw', 'local_ai') or {} %}
          {% set memory = decision.get('memory') or {} %}
          {% set latest = (memory.get('latest_decisions') or [])[0] if memory.get('latest_decisions') else {} %}
          {% if latest %}
          ## Last memory routing

          **Topic:** {{ latest.get('topic') }} · **Files found:** {{ latest.get('files_found') }}

          Raw memory: ~{{ latest.get('memory_tokens_retrieved', 0) }} tokens ·
          sent to Local AI: ~{{ latest.get('memory_tokens_sent_to_local_ai', 0) }} ·
          sent to primary: ~{{ latest.get('memory_tokens_sent_to_primary_model', 0) }} ·
          avoided: ~{{ latest.get('memory_tokens_avoided', 0) }}.

          **Decision:** {{ latest.get('decision') }} · {{ latest.get('reason') }}
          {% else %}
          ## Last memory routing

          Memory retrieval: **SKIPPED** — ainda não há decisão registrada nesta telemetria.
          {% endif %}

      - type: entities
        title: Última decisão de roteamento
        show_header_toggle: false
        entities:
          - entity: sensor.codex_ultima_decisao_de_roteamento_local_ai
            name: Decisão

      - type: markdown
        content: >-
          {% set task = state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'tarefa') %}
          {% set decision = states('sensor.codex_ultima_decisao_de_roteamento_local_ai') %}
          {% if task %}
          ## Última decisão Local AI

          **Task:** {{ task }}

          **Eligible:** {{ 'YES' if state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'elegivel') else 'NO' }}

          **RTX available:** {{ 'YES' if state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'rtx_disponivel') else 'NO' }}

          **Decision:** {{ decision }}

          **Reason:** {{ state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'motivo') }}

          Input: ~{{ state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'input_tokens_estimados') }} tokens ·
          expected saving: ~{{ state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'economia_esperada_tokens') }} tokens ·
          actual saving: {{ state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'economia_real_tokens') if state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'economia_real_tokens') is not none else 'not measured' }}.
          {% else %}
          ## Última decisão Local AI

          Ainda não há uma decisão de roteamento registrada.
          {% endif %}

      - type: markdown
        content: >-
          {% set routing = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('routing') or {} %}
          {% set missed = routing.get('latest_decisions', []) | selectattr('decision', 'eq', 'ROUTING_MISSED_OPPORTUNITY') | list %}
          ## Oportunidades RTX perdidas

          **Hoje:** {{ states('sensor.codex_oportunidades_rtx_perdidas_hoje') }} ·
          potencial de contexto evitável acumulado: ~{{ ((routing.get('totals') or {}).get('potential_tokens_avoidable', 0)) }} tokens.

          {% if missed %}
          {% for item in missed %}
          - {{ item.get('task_type') }} · ~{{ item.get('expected_tokens_saved') }} tokens potenciais · {{ item.get('reason') }}
          {% endfor %}
          {% else %}
          Nenhuma oportunidade perdida recente registrada.
          {% endif %}

      - type: grid
        title: Tokens OpenAI economizados (estimativa)
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.codex_tokens_openai_evitados_hoje_estimados
            name: Hoje
          - type: tile
            entity: sensor.codex_tokens_openai_evitados_semana_estimados
            name: Esta semana
          - type: tile
            entity: sensor.codex_tokens_openai_evitados_mes_estimados
            name: Este mês
          - type: tile
            entity: sensor.codex_tokens_openai_evitados_estimados
            name: Total

      - type: markdown
        content: >-
          **Chamadas** medem quantas tarefas locais foram tentadas; **tokens economizados**
          estimam a redução entre o contexto enviado ao Local AI e seu resumo retornado.
          São unidades diferentes e não devem ser comparadas no mesmo gráfico. A estimativa
          não representa cobrança oficial da OpenAI.

      - type: grid
        title: Resumo do uso Local AI
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.codex_chamadas_local_ai_hoje
            name: Chamadas hoje
          - type: tile
            entity: sensor.codex_chamadas_local_ai_com_sucesso
            name: Concluídas
          - type: tile
            entity: sensor.codex_falhas_local_ai
            name: Falhas
          - type: tile
            entity: sensor.codex_taxa_de_falhas_local_ai
            name: Taxa de falhas
          - type: tile
            entity: sensor.codex_reducao_de_contexto_local_ai
            name: Redução de contexto
          - type: tile
            entity: sensor.codex_fallbacks_local_ai_informados
            name: Fallbacks

      - type: entities
        title: Diagnóstico recente
        show_header_toggle: false
        entities:
          - entity: sensor.codex_ultima_falha_local_ai
            name: Última falha recente
          - entity: sensor.codex_ultimo_job_local_ai
            name: Último job

      - type: markdown
        content: >-
          {% set task = state_attr('sensor.codex_ultimo_job_local_ai', 'tarefa') %}
          {% set status = states('sensor.codex_ultimo_job_local_ai') %}
          {% if task and status == 'success' %}
          ## Último job de GPU

          **{{ task }}** · {{ state_attr('sensor.codex_ultimo_job_local_ai', 'modelo') }} ·
          {{ state_attr('sensor.codex_ultimo_job_local_ai', 'duracao_s') }} s ·
          {{ state_attr('sensor.codex_ultimo_job_local_ai', 'tokens_por_segundo') }} tok/s

          GPU pico: **{{ state_attr('sensor.codex_ultimo_job_local_ai', 'pico_gpu_percentual') }}%** ·
          VRAM pico: **{{ state_attr('sensor.codex_ultimo_job_local_ai', 'pico_vram_mib') }} MiB** ·
          Contexto: **{{ state_attr('sensor.codex_ultimo_job_local_ai', 'tokens_contexto_entrada') }} →
          {{ state_attr('sensor.codex_ultimo_job_local_ai', 'tokens_contexto_saida') }} tokens** ·
          redução **~{{ state_attr('sensor.codex_ultimo_job_local_ai', 'reducao_contexto_percentual') }}%** ·
          contexto OpenAI evitado **~{{ state_attr('sensor.codex_ultimo_job_local_ai', 'tokens_openai_evitados_estimados') }} tokens** ·
          {{ state_attr('sensor.codex_ultimo_job_local_ai', 'processador') or 'processador não amostrado' }}.

          Overhead do envelope OpenAI: **não mensurado**; a economia é uma estimativa de
          conteúdo pelo método `{{ state_attr('sensor.codex_ultimo_job_local_ai', 'metodo_contagem_tokens') }}`.
          {% elif task and status == 'failed' %}
          ## Último job de GPU

          A última execução de **{{ task }}** falhou em
          {{ state_attr('sensor.codex_ultimo_job_local_ai', 'duracao_s') }} s
          ({{ state_attr('sensor.codex_ultimo_job_local_ai', 'erro_tipo') or 'tipo não informado' }}).
          Nenhum token economizado é contabilizado para uma execução sem sucesso.
          {% else %}
          ## Último job de GPU

          Nenhuma inferência local foi registrada ainda.
          {% endif %}

      - type: history-graph
        title: Tokens OpenAI economizados — últimos 7 dias
        hours_to_show: 168
        entities:
          - entity: sensor.codex_tokens_openai_evitados_estimados
            name: Tokens economizados (estimativa)

      - type: history-graph
        title: Chamadas Local AI — últimos 7 dias
        hours_to_show: 168
        entities:
          - entity: sensor.codex_chamadas_local_ai
            name: Chamadas Local AI

      - type: history-graph
        title: Taxa de falhas Local AI — últimos 7 dias
        hours_to_show: 168
        entities:
          - entity: sensor.codex_taxa_de_falhas_local_ai
            name: Total
          - entity: sensor.codex_taxa_de_falhas_qwen_2_5_coder_7b
            name: qwen2.5-coder:7b
          - entity: sensor.codex_taxa_de_falhas_qwen_3_8b
            name: qwen3:8b
          - entity: sensor.codex_taxa_de_falhas_qwen_2_5_coder_1_5b
            name: qwen2.5-coder:1.5b-base
          - entity: sensor.codex_taxa_de_falhas_qwen_3_14b
            name: qwen3:14b

  - title: Assistentes
    path: assistentes
    icon: mdi:account-group-outline
    cards:
      - type: markdown
        content: >-
          Escolha o assistente conforme a tarefa. Para conversar com o Codex,
          use a aba **Codex** deste painel.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: conversation.claude_conversation
            name: Claude padrão
            icon: mdi:message-text-outline
            tap_action:
              action: assist
              pipeline_id: 0179ef9e2add41ba9b61f00b93
              start_listening: false
          - type: tile
            entity: conversation.claude_conversation
            name: Home Assistant
            icon: mdi:home-assistant
            tap_action:
              action: assist
              pipeline_id: 01kjk6wmvkw3aw4khx374yf5an
              start_listening: false
          - type: tile
            entity: conversation.claude_code_full_access
            name: Claude Code (Full Access)
            icon: mdi:console-line
            tap_action:
              action: assist
              pipeline_id: 0179ef9e2add41ba9b61f00b91
              start_listening: false
