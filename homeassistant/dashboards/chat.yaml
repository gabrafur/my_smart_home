              **Saídas acumuladas:** {{ format_number_ptbr(totals.get('operational_failed_calls', 0)) }} falhas técnicas ·
              {{ format_number_ptbr(unclassified) }} sem classificação de qualidade ·
              {{ format_number_ptbr(totals.get('operational_quality_rejected_calls', 0)) }} descartes pelo gate ·
              {{ format_number_ptbr(totals.get('operational_not_beneficial_calls', 0)) }} fiéis sem ganho líquido ·
              {{ format_number_ptbr(totals.get('diagnostic_calls', 0)) }} diagnósticos fora do fluxo.

              {% if unmeasured > 0 %}
              ⚠️ {{ format_number_ptbr(unmeasured) }} resultados do legado não
              separam os tokens do verificador. Seus {{ format_number_ptbr(unmeasured_gross) }}
              tokens brutos ficam fora da etapa mensurável e valem zero líquido.
              {% endif %}

              **Como ler:** os seis primeiros indicadores acompanham a perda
              de volume até um resultado utilizável e mensurável. Os quatro últimos mudam para tokens:
              contexto OpenAI evitado e aprovado − tokens locais de entrada e
              saída do gate dos aprovados = saldo líquido equivalente. Como os
              tokenizadores são diferentes, esse saldo é um índice conservador,
              não uma contagem faturável. A redução útil divide o saldo por todo
              o contexto tentado. Diagnósticos e fallbacks ficam fora porque não
              substituem contexto operacional.

