                name: Cobertura do custo do gate
                color: amber
              - type: tile
                entity: sensor.codex_cobertura_da_classificacao_operacional_hoje
                name: Cobertura da classificação
                color: cyan

          - type: markdown
            content: >-
              **Como ler:** *contexto evitado validado* é o delta estimado pelo
              tokenizer OpenAI somente dos resultados aprovados; *custo do gate*
              usa tokens locais do verificador; *saldo líquido equivalente* é a
              diferença conservadora entre ambos. *Redução útil operacional*
              divide esse saldo por todo o contexto tentado, portanto descartes
              e falhas valem zero no numerador. *Fiéis sem ganho líquido* passam
              na qualidade, mas o custo do gate elimina a economia. *Aproveitamento*
              mede aprovados na fidelidade entre todos os resultados com gate;
              *cobertura do custo* mostra
              quanto do gate tem contagem separável; *cobertura da classificação*
              separa tentativas operacionais, diagnósticos e legado.

          - type: markdown
            title: Referência controlada de qualidade
            content: >-
              **Benchmark offline v3 · 24/08/2026:** `qwen2.5-coder:14b`
              com verificador independente `qwen3:8b` · **0/12 resultados
              utilizáveis** · redução ponderada **0,0%** · mediana por tentativa
              **0,0%** · 298,2 s de inferência local.

              O antigo **23,2%** veio de uma única execução com autoavaliação e
              permanece apenas como histórico. Este benchmark mede compressão e
              fidelidade das fixtures; não executa o modelo principal nos dois
              braços e, portanto, não é uma previsão da redução operacional.

