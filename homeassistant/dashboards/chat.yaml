          - type: markdown
            content: >-
              **Como ler:** cada barra é o total diário de tentativas que
              pretendiam substituir contexto do modelo principal. Resultados
              aceitos, descartes e falhas entram; benchmarks diagnósticos ficam fora.

          - type: statistics-graph
            title: Taxa média diária de falhas técnicas — últimos 7 dias
            chart_type: bar
            period: day
            days_to_show: 7
            stat_types:
              - mean
            entities:
              - entity: sensor.codex_taxa_de_falhas_local_ai_hoje
                name: Média diária

          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set today = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('periods') or {}).get('today') or {} %}
              {% set calls = today.get('operational_calls', 0) | float(0) %}
              {% set failed = today.get('operational_failed_calls', 0) | float(0) %}
              {% set rejected = today.get('operational_quality_rejected_calls', 0) | float(0) %}
              {% set not_beneficial = today.get('operational_not_beneficial_calls', 0) | float(0) %}
              **Hoje:** falhas técnicas **{{ format_number_ptbr((failed / calls * 100) if calls > 0 else 0, 1) }}%** ·
              descartes por qualidade **{{ format_number_ptbr((rejected / calls * 100) if calls > 0 else 0, 1) }}%** ·
              sem ganho líquido **{{ format_number_ptbr((not_beneficial / calls * 100) if calls > 0 else 0, 1) }}%** ·
              resultados não aproveitados **{{ format_number_ptbr(((failed + rejected + not_beneficial) / calls * 100) if calls > 0 else 0, 1) }}%**.

              **Como ler:** cada barra é a média temporal das leituras de
              `falhas operacionais / tentativas operacionais` dentro do dia UTC; o valor corrente de hoje
              aparece acima. O gráfico mostra somente erros técnicos.
              Rejeições de fidelidade e resultados sem ganho líquido não entram
              como falha técnica, mas entram em *resultados não aproveitados* e
              reduzem a **Redução útil** com economia zero, seguindo o teste A/B.

          - type: markdown
            title: RTX em uso — últimas 48 horas
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set local = state_attr('sensor.codex_usage_raw', 'local_ai') or {} %}
              {% set full_history = state_attr('sensor.codex_rtx_historico_48h_raw', 'jobs') %}
              {% set jobs = full_history if full_history is not none else local.get('latest_jobs', []) %}
              | Horário | Tarefa / modelo | Resultado / fidelidade | Duração | Saldo eq. |
              |:--|:--|:--|--:|--:|
              {% for job in jobs -%}
              {% set timestamp = as_timestamp(job.get('finished_at') or job.get('started_at'), none) -%}
              {% set status = job.get('status', '—') -%}
              {% set discard_reason = job.get('discard_reason') -%}
              {% set result = '🟠 sem ganho líquido' if status == 'discarded' and discard_reason == 'insufficient_net_savings' else '🟠 qualidade rejeitada' if status == 'discarded' else '✅ utilizado' if status == 'success' and job.get('quality_accepted') == true else '🔴 falhou' if status == 'failed' else status -%}
              {% set quality = (format_number_ptbr(job.get('quality_score_percent')) ~ '%') if job.get('quality_score_percent') is number else '—' -%}
              | {{ timestamp | timestamp_custom('%d/%m %H:%M', true) if timestamp is number else '—' }} | `{{ job.get('task', '—') }}`<br>`{{ job.get('model', '—') }}` | {{ result }}<br>Fidelidade: {{ quality }} | {{ (format_number_ptbr(job.get('duration_seconds'), 1) ~ ' s') if job.get('duration_seconds') is number else '—' }} | {{ format_number_ptbr(job.get('useful_context_tokens_avoided', 0)) }} |
              {% else -%}
              | — | Nenhuma inferência registrada nesta janela | — | — | 0 |
              {% endfor %}

              **Como ler:** *utilizado* passou pela fidelidade e gerou economia
              líquida suficiente; *sem ganho líquido* preservou o conteúdo, mas
              o delta após o custo do gate ficou abaixo do mínimo; *qualidade
              rejeitada* falhou na fidelidade; *falhou* é erro técnico.
              Fidelidade não é economia. Todo resultado não utilizado aparece
              com **zero tokens úteis líquidos**. A tabela omite benchmarks e é
              atualizada a cada 30 segundos.

              {% if full_history is none %}
              _Exibindo temporariamente os jobs recentes do feed principal até a próxima recarga programada do Home Assistant._
              {% endif %}

