title: Chat
views:
  - title: Codex
    path: codex
    icon: mdi:robot-outline
    panel: true
    cards:
      - type: custom:codex-chat-card-v2
        title: Codex
        history_limit: 200
  - title: Alexa
    path: alexa
    icon: mdi:account-voice
    cards:
      - type: entities
        title: Mensagem para Alexa
        show_header_toggle: false
        entities:
          - entity: input_text.alexa_mensagem
            name: Texto a ser lido
      - type: button
        entity: button.ler_mensagem_na_alexa
        name: Ler na Alexa
        icon: mdi:send
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.ler_mensagem_na_alexa
      - type: markdown
        content: >-
          Digite a mensagem acima e toque em **Ler na Alexa**. Mensagens vazias
          são ignoradas, e o texto é enviado somente para a Alexa principal.
  - title: Uso
    path: uso-codex
    icon: mdi:chart-donut
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Limite oficial do plano
            icon: mdi:chart-donut
          - type: markdown
            content: |
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set totals = state_attr('sensor.codex_usage_raw', 'totals') or {} %}
              {% set limite = state_attr('sensor.codex_usage_raw', 'rate_limit') or {} %}
              {% set consulta = state_attr('sensor.codex_usage_raw', 'rate_limit_refresh') or {} %}
              {% set reset_em = limite.get('resets_at') %}
              {% set janela = limite.get('window_type', 'desconhecida') %}
              {% if states('sensor.codex_usage_raw') == 'ok' %}
              {% if states('sensor.codex_dados_de_limite') == 'atual' and is_number(states('sensor.codex_limite_disponivel')) %}
              # {{ format_number_ptbr(states('sensor.codex_limite_disponivel')) }}% disponível

              **{{ format_number_ptbr(states('sensor.codex_limite_usado')) }}% usado** na janela
              {{ 'semanal' if janela == 'weekly' else janela }} do plano
              {% if states('sensor.codex_plano') not in ['unknown', 'unavailable', 'desconhecido'] %}
              {{ states('sensor.codex_plano') | title }}.
              {% endif %}
              {% elif limite.get('remaining_percent') is number %}
              # Leitura desatualizada

              Último valor conhecido: **{{ format_number_ptbr(limite.get('remaining_percent')) }}% disponível**.
              Confira Codex → Settings → Usage & billing para o saldo atual.
              {% else %}
              # Aguardando dados

              Ainda não há uma leitura do limite do plano.
              {% endif %}

              {% if reset_em %}
              **Reset:** {{ as_timestamp(reset_em) | timestamp_custom('%d/%m às %H:%M', true) }}
              {% endif %}
              {% if is_number(states('sensor.codex_atualizacao_do_limite_em')) %}
              **Próxima consulta:** em {{ format_number_ptbr(states('sensor.codex_atualizacao_do_limite_em')) }} segundos.
              {% endif %}
              {% if consulta.get('last_error') %}

              _A consulta automática ao Codex está temporariamente indisponível; estes são os últimos dados recebidos._
              {% endif %}
              {% else %}
              # Coleta indisponível

              Aguardando a primeira métrica do Codex CLI.
              {% endif %}
          - type: grid
            title: Indicadores principais
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.codex_limite_usado
                name: Usado · última leitura
                min: 0
                max: 100
                severity: { green: 0, yellow: 70, red: 90 }
              - type: gauge
                entity: sensor.codex_limite_disponivel
                name: Disponível · última leitura
                min: 0
                max: 100
                severity: { red: 0, yellow: 10, green: 30 }
              - type: gauge
                entity: sensor.codex_eficiencia_de_cache
                name: Eficiência de cache · local
                min: 0
                max: 100
                severity: { red: 0, yellow: 30, green: 60 }
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.codex_uso_projetado_no_reset
                    above: -1
                card:
                  type: gauge
                  entity: sensor.codex_uso_projetado_no_reset
                  name: Uso projetado no reset
                  min: 0
                  max: 100
                  severity: { green: 0, yellow: 90, red: 100 }
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.codex_uso_projetado_no_reset
                    state: unavailable
                card:
                  type: gauge
                  entity: sensor.codex_progresso_da_janela_semanal
                  name: Tempo decorrido na janela
                  min: 0
                  max: 100
                  severity: { green: 0, yellow: 70, red: 90 }
          - type: entities
            title: Plano e atualização
            show_header_toggle: false
            entities:
              - entity: sensor.codex_dados_de_limite
                name: Estado da leitura
              - entity: sensor.codex_plano
                name: Plano
              - entity: sensor.codex_creditos_extras
                name: Créditos extras
              - entity: sensor.codex_proximo_reset
                name: Reset semanal
              - entity: sensor.codex_ultima_atualizacao_do_limite
                name: Leitura recebida em
              - entity: sensor.codex_atualizacao_do_limite_em
                name: Próxima consulta em
              - entity: sensor.codex_proxima_atualizacao_do_limite
                name: Próxima consulta às
              - entity: script.codex_atualizar_uso_agora
                name: Atualizar agora
                icon: mdi:refresh

      - type: grid
        cards:
          - type: heading
            heading: Análise e métricas locais
            icon: mdi:chart-timeline-variant
          - type: markdown
            content: >-
              Estes números descrevem somente as sessões preservadas neste host.
              Eles ajudam a entender o trabalho local, mas **não representam o limite
              oficial do plano**.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.codex_uso_projetado_no_reset
                above: -1
            card:
              type: entities
              title: Tendência da janela semanal
              show_header_toggle: false
              entities:
                - entity: sensor.codex_previsao_ate_o_reset
                  name: Aguenta até o reset?
                - entity: sensor.codex_ritmo_do_limite
                  name: Ritmo observado
                - entity: sensor.codex_uso_projetado_no_reset
                  name: Uso projetado no reset
                - entity: sensor.codex_folga_projetada_no_reset
                  name: Folga projetada
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.codex_uso_projetado_no_reset
                state: unavailable
            card:
              type: markdown
              content: >-
                **Tendência da janela semanal**

                ⏳ Projeção aguardando pelo menos uma hora de observações comparáveis
                na mesma janela. Até lá, o quarto gauge mostra somente o tempo decorrido.
          - type: grid
            title: Consumo registrado
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_sessoes_monitoradas
                name: Sessões
              - type: tile
                entity: sensor.codex_tokens_totais
                name: Tokens totais
              - type: tile
                entity: sensor.codex_tokens_em_cache
                name: Tokens em cache
              - type: tile
                entity: sensor.codex_tokens_de_saida
                name: Tokens de saída
              - type: tile
                entity: sensor.codex_velocidade_7_dias
                name: Média por hora · 7 dias
          - type: markdown
            content: >-
              ## Histórico deste computador

              Estes dados vêm apenas das sessões registradas **nesta máquina**.
              Eles servem para analisar o uso local e **não são o saldo semanal do
              seu plano**. O limite oficial fica no topo do painel e é consultado
              automaticamente a cada 30 segundos.
          - type: markdown
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              ## Última atividade local

              {% set registrada_em = state_attr('sensor.codex_usage_raw', 'source_updated_at') %}
              {% set instante = as_timestamp(registrada_em, 0) | float(0) %}
              {% set idade_segundos = [0, (as_timestamp(now()) - instante) | int(0)] | max if instante > 0 else none %}
              **Última conversa registrada nesta máquina:**
              {% if idade_segundos is none %}
              ainda não há conversa registrada.
              {% elif idade_segundos < 60 %}
              agora mesmo.
              {% elif idade_segundos < 3600 %}
              {% set idade_minutos = (idade_segundos / 60) | int %}
              há {{ format_number_ptbr(idade_minutos) }} minuto{{ '' if idade_minutos == 1 else 's' }}.
              {% elif idade_segundos < 86400 %}
              {% set idade_horas = (idade_segundos / 3600) | int %}
              há {{ format_number_ptbr(idade_horas) }} hora{{ '' if idade_horas == 1 else 's' }}.
              {% else %}
              em {{ instante | timestamp_custom('%d/%m/%Y às %H:%M', true) }}.
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Alertas e ajuda
            icon: mdi:bell-outline
          - type: entities
            title: Alertas
            show_header_toggle: false
            entities:
              - entity: sensor.codex_nivel_de_alerta
                name: Situação atual
              - entity: input_boolean.codex_alertas_iphone
              - entity: input_boolean.codex_resumo_diario_iphone
              - entity: input_text.codex_ultimo_alerta_iphone
              - entity: input_datetime.codex_ultimo_alerta_iphone_em
          - type: markdown
            content: >-
              **Como interpretar**

              O limite do plano é semanal e não zera ao fim do dia. Leituras com
              mais de quinze minutos ficam marcadas como desatualizadas e deixam de
              alimentar alertas. Os gauges de uso preservam a última leitura conhecida,
              identificada explicitamente como tal.

              O quarto gráfico mostra uma projeção somente depois de observar pelo menos
              uma hora da mesma janela. Antes disso, ele mostra apenas o tempo decorrido
              na semana, que não depende de extrapolação.

              A eficiência de cache mede reaproveitamento de tokens de entrada; não
              é saldo, cobrança nem qualidade das respostas. Usos feitos em outros
              computadores podem não aparecer nas métricas locais.

              O valor oficial continua disponível em **Codex → Settings → Usage & billing**.

  - title: RTX 4070
    path: uso-rtx
    icon: mdi:expansion-card-variant
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Agora
            heading_style: title
            icon: mdi:expansion-card
          - type: tile
            entity: sensor.rtx_painel
            name: Serviço local
            grid_options:
              columns: full
            color: cyan
          - type: markdown
            content: |-
              {% set h = state_attr('sensor.rtx_painel', 'health') or {} %}
              **{{ h.get('reason', 'Aguardando o produtor de métricas') }}**

              Modelo: **{{ h.get('model') or '—' }}**
              {% if h.get('task') %}
              Tarefa atual: **{{ h.get('task') }}**
              {% endif %}

              {{ h.get('sample_reason', 'Sem amostra recente') }}.
          - type: markdown
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set m = state_attr('sensor.rtx_painel', 'metrics') or {} %}
              {% macro number(v, d=0) %}{{ format_number_ptbr(v, d) if v is number else '—' }}{% endmacro %}
              | GPU | VRAM | Potência |
              |:--:|:--:|:--:|
              | **{{ number(m.get('gpu')) }} %** | **{{ number(m.get('vram')) }} MiB** | **{{ number(m.get('power'), 1) }} W** |
          - type: heading
            heading: Evolução do contexto
            heading_style: title
            icon: mdi:chart-timeline-variant
          - type: tile
            entity: sensor.rtx_contexto_evitado_total
            name: Saldo confirmado · total preservado
            grid_options:
              columns: full
            color: green
          - type: markdown
            title: Períodos · UTC
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set periods = state_attr('sensor.rtx_painel', 'periods') or {} %}
              {% macro number(v) %}{{ format_number_ptbr(v) if v is number else '—' }}{% endmacro %}
              | Período | Tentativas | Usados | Saldo · tokens |
              |:--|--:|--:|--:|
              {% for key, label in [('today', 'Hoje'), ('week', 'Semana'), ('month', 'Mês'), ('total', 'Total')] -%}
              {% set p = periods.get(key, {}) -%}
              | {{ label }} | {{ number(p.get('calls')) }} | {{ number(p.get('used')) }} | {{ number(p.get('net')) }} |
              {% endfor %}
          - type: markdown
            title: Últimos 7 dias
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set rows = state_attr('sensor.rtx_painel', 'daily') or [] %}
              {% macro number(v) %}{{ format_number_ptbr(v) if v is number else '—' }}{% endmacro %}
              | Dia · UTC | Tentativas | Usados | Saldo · tokens |
              |:--|--:|--:|--:|
              {% for row in rows -%}
              | {{ as_timestamp(row.get('day')) | timestamp_custom('%d/%m', false) }} | {{ number(row.get('calls')) }} | {{ number(row.get('used')) }} | {{ number(row.get('net')) }} |
              {% endfor %}
              {% if not rows %}Sem série diária disponível.{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Resultado de hoje · UTC
            heading_style: title
            icon: mdi:chart-box-outline
          - type: grid
            title: Waterfall — hoje · UTC
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.rtx_waterfall_today_calls
                name: Tentativas
                color: blue
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_completed
                name: Sem falha técnica
                color: cyan
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_failed
                name: Falhas técnicas
                color: red
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_without_gate
                name: Sem classificação
                color: amber
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_gated
                name: Avaliados pelo gate
                color: purple
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_rejected
                name: Rejeitados pelo gate
                color: red
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_accepted
                name: Fidelidade aprovada
                color: cyan
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_no_gain
                name: Fiéis sem ganho
                color: amber
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_without_cost
                name: Custo não mensurado
                color: amber
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_measured
                name: Custo mensurado
                color: green
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_unconfirmed
                name: Uso não confirmado
                color: amber
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_used
                name: Usados pelo chat
                color: green
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_codex_tokens
                name: Tokens totais
                color: blue
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_attempted
                name: Contexto tentado
                color: blue
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_gross
                name: Contexto evitado
                color: blue
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_gate
                name: Custo da validação
                color: amber
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_net
                name: Saldo líquido
                color: green
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_today_overall_reduction
                name: Redução no total
                color: green
                vertical: true
          - type: markdown
            content: |-
              As etapas mostram tentativas, qualidade, custo mensurado e uso confirmado. Depois, os valores passam a representar tokens estimados.

              **Contexto evitado − custo da validação = saldo líquido equivalente.** A redução no total compara esse saldo com tokens Codex mais saldo; a redução do contexto tentado usa outra base.

              O saldo é um índice de contexto, **não uma medição da cobrança OpenAI**. Uso não confirmado, descartes e diagnósticos não contam economia. Valores desconhecidos indicam ausência de dados ou de base para a taxa.
          - type: markdown
            title: Atenção de roteamento · hoje
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set r = state_attr('sensor.rtx_painel', 'routing') or {} %}
              {% macro number(v, d=0) %}{{ format_number_ptbr(v, d) if v is number else '—' }}{% endmacro %}
              | Ocorrência | Quantidade |
              |:--|--:|
              | Oportunidades elegíveis perdidas | {{ number(r.get('missed_opportunities')) }} |
              | Serviço indisponível em tarefa elegível | {{ number(r.get('confirmed_unavailable_tasks')) }} |
              | Disponibilidade desconhecida | {{ number(r.get('availability_unknown_tasks')) }} |
              | Falhas após delegação | {{ number(r.get('failed_tasks')) }} |

              Elegíveis: **{{ number(r.get('eligible_tasks')) }}** · disponíveis: **{{ number(r.get('eligible_and_available_tasks')) }}** · disponibilidade: **{{ number(r.get('availability_percent'), 1) }} %**.
          - type: heading
            heading: Execuções recentes
            heading_style: title
            icon: mdi:history
          - type: markdown
            title: Últimas 48 horas
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set jobs = state_attr('sensor.rtx_painel', 'jobs') or [] %}
              {{ state_attr('sensor.rtx_painel', 'history_reason') or 'Aguardando histórico' }}.

              {% for job in jobs %}
              **{{ job.get('task') }} · {{ job.get('result') }}**

              {% if job.get('at') %}{{ as_timestamp(job.get('at')) | timestamp_custom('%d/%m %H:%M', true) }} · {% endif %}{{ format_number_ptbr(job.get('duration'), 1) if job.get('duration') is number else '—' }} s · saldo **{{ format_number_ptbr(job.get('net')) if job.get('net') is number else '—' }} tokens**

              Modelo: {{ job.get('model') }} · processador: {{ job.get('processor') }}

              ---
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Total acumulado
            heading_style: title
            icon: mdi:shield-check-outline
          - type: grid
            title: Waterfall — total preservado
