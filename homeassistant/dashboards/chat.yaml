              - type: tile
                entity: sensor.rtx_waterfall_total_overall_reduction
                name: Redução no total
                color: green
                vertical: true
          - type: markdown
            content: |-
              As etapas mostram tentativas, qualidade, custo mensurado e uso confirmado. Depois, os valores passam a representar tokens estimados.

              **Contexto evitado − custo da validação = saldo líquido equivalente.** A redução no total compara esse saldo com tokens Codex mais saldo; a redução do contexto tentado usa outra base.

              O saldo é um índice de contexto, **não uma medição da cobrança OpenAI**. Uso não confirmado, descartes e diagnósticos não contam economia. Valores desconhecidos indicam ausência de dados ou de base para a taxa.
          - type: markdown
            title: Fora da contagem operacional
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set p = (state_attr('sensor.rtx_painel', 'periods') or {}).get('today', {}) %}
              Diagnósticos e benchmarks: **{{ format_number_ptbr(p.get('diagnostics')) if p.get('diagnostics') is number else '—' }}**.

              Chamadas sem classificação de origem: **{{ format_number_ptbr(p.get('unclassified')) if p.get('unclassified') is number else '—' }}**.

              Testes de inferência comprovam funcionamento. A economia exige resultado aprovado, custo mensurado e recibo de entrega ao modelo principal.
          - type: heading
            heading: Amostras da GPU
            heading_style: title
            icon: mdi:chart-line
          - type: statistics-graph
            title: GPU · picos em 48 horas
            chart_type: line
            period: 5minute
            days_to_show: 2
            stat_types: [max]
            entities:
              - entity: sensor.rtx_metricas_gpu
                name: GPU
          - type: statistics-graph
            title: VRAM · picos em 48 horas
            chart_type: line
            period: 5minute
            days_to_show: 2
            stat_types: [max]
            entities:
              - entity: sensor.rtx_metricas_vram
                name: VRAM
          - type: statistics-graph
            title: Potência · picos em 48 horas
            chart_type: line
            period: 5minute
            days_to_show: 2
            stat_types: [max]
            entities:
              - entity: sensor.rtx_metricas_potencia
                name: Potência
          - type: heading
            heading: Entenda os dados
            heading_style: title
            icon: mdi:information-outline
          - type: markdown
            title: Como este chat usa a RTX
            content: |-
              **Disponível** indica que a RTX está pronta para tarefas locais elegíveis. O chat principal continua no modelo escolhido no Codex.

              Os contadores de **Local AI** incluem também trabalho na CPU; não comprovam uso exclusivo da GPU.
          - type: markdown
            title: Integridade dos dados
            content: |-
