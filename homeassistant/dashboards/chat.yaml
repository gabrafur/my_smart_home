          - type: markdown
            content: >-
              **Como ler:** estes percentuais diagnosticam a qualidade da medição
              e ficam separados do waterfall. *Aproveitamento de qualidade* mede
              resultados fiéis entre os avaliados pelo gate; *gates com custo
              mensurado* mede avaliações cujo custo local foi registrado;
              *eventos com classificação* mede a cobertura da telemetria
              operacional; *resultados efetivamente usados* usa todas as tentativas
              operacionais como denominador; e *uso com confirmação* mede quanto
              dos aprovados mensuráveis teve entrega comprovada ao modelo principal.
              Nenhum deles significa economia de tokens isoladamente.

          - type: markdown
            title: Redução útil líquida por tarefa — total preservado
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set rows = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('tasks', []) %}
              {% if rows %}
              | Tarefa | Tentativas | Uso confirmado | Saldo líquido | Redução ponderada |
              |:--|--:|--:|--:|--:|
              {% for item in rows if (item.get('operational_calls', 0) | int(0)) > 0 -%}
              | `{{ item.get('task') }}` | {{ format_number_ptbr(item.get('operational_calls', 0)) }} | {{ format_number_ptbr(item.get('operational_primary_context_used_calls', 0)) }} | {{ format_number_ptbr(item.get('confirmed_useful_context_tokens_avoided', 0)) }} tokens | {{ format_number_ptbr(item.get('useful_reduction_percent', 0), 1) }}% |
              {% endfor %}
              {% else %}
              Ainda não há agregados por tarefa na versão atual da telemetria.
              {% endif %}

              Tentativas rejeitadas, falhas, fallbacks e saídas sem confirmação
              de uso permanecem no denominador da própria tarefa e somam zero.

          - type: markdown
            title: Redução por gerador / verificador — total preservado
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set pairs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('model_pairs', []) %}
              {% if pairs %}
              | Gerador | Verificador | Tentativas | Uso confirmado | Saldo líquido | Redução ponderada |
              |:--|:--|--:|--:|--:|--:|
              {% for item in pairs if (item.get('operational_calls', 0) | int(0)) > 0 -%}
              | `{{ item.get('generator_model') }}` | `{{ item.get('verifier_model') }}`{% if item.get('independent_verifier') != true %} ⚠️{% endif %} | {{ format_number_ptbr(item.get('operational_calls', 0)) }} | {{ format_number_ptbr(item.get('operational_primary_context_used_calls', 0)) }} | {{ format_number_ptbr(item.get('confirmed_useful_context_tokens_avoided', 0)) }} tokens | {{ format_number_ptbr(item.get('useful_reduction_percent', 0), 1) }}% |
              {% endfor %}
              {% else %}
              Ainda não há agregados por par de modelos na versão atual da telemetria.
              {% endif %}

              ⚠️ indica autoavaliação ou histórico sem verificador mensurado;
              ambos reivindicam zero sem confirmação independente de uso.

          - type: markdown
            title: Benchmark RTX — alto potencial além de logs
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set basis = state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'base_de_medicao') or {} %}
              {% set totals = state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'totais') or {} %}
              {% set rows = state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'atividades') or [] %}
              {% set status = states('sensor.codex_benchmark_rtx_alto_potencial') %}
              {% set idade_s = state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'idade_benchmark_s') %}
              {% set ground_truth = state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'independencia_ground_truth') %}
              {% set decisao = state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'decisao_operacional') %}
              {% set adversarial = state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'cenarios_adversariais') or {} %}
              {% set badges = {
                'measured': '🟢 MEDIDO',
                'recomputed': '🟣 RECALCULADO',
                'estimated': '🟡 ESTIMADO',
                'simulated': '🔵 SIMULADO',
                'not_applicable': '⚪ NÃO APLICÁVEL',
                'insufficient_sample': '⚪ AMOSTRA INSUFICIENTE',
                'legacy_schema': '⚪ SCHEMA LEGADO',
                'not_tested': '⚪ NÃO TESTADO'
              } %}
              {% if rows %}
              **Execução:** `{{ state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'benchmark_run_id') or '—' }}` · **schema:** {{ format_number_ptbr(state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'schema_version'), 0) if state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'schema_version') is number else 'não informado' }} · **modelo:** `{{ state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'modelo') or '—' }}`

              **Data:** {{ state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'ultima_execucao') or 'não informada' }} · **idade:** {{ (format_number_ptbr((idade_s | float(0)) / 86400, 1) ~ ' dias') if idade_s is number else 'não informada' }} · **artefato recalculado:** {{ state_attr('sensor.codex_benchmark_rtx_alto_potencial', 'artefato_recalculado_em') or 'não' }}

              **Evidência:** inferência local {{ badges.get(basis.get('local_inference'), '⚪ NÃO INFORMADO') }} · GPU {{ badges.get(basis.get('gpu_telemetry'), '⚪ NÃO INFORMADO') }} · tokens GPT {{ badges.get(basis.get('gpt_tokens'), '⚪ NÃO INFORMADO') }} · GPT direto {{ badges.get(basis.get('gpt_direct_execution'), '⚪ NÃO INFORMADO') }} · qualidade GPT {{ badges.get(basis.get('gpt_final_quality'), '⚪ NÃO INFORMADO') }}.

              **Ground truth:** `{{ ground_truth or 'não informado' }}` · **decisão:** `{{ decisao or 'não informada' }}`.

              **Guardrails adversariais:** {{ format_number_ptbr(adversarial.get('adversarial_guardrails_passed')) if adversarial.get('adversarial_guardrails_passed') is number else 'indisponível' }}/{{ format_number_ptbr(adversarial.get('adversarial_scenarios_total')) if adversarial.get('adversarial_scenarios_total') is number else 'indisponível' }} cenários simulados tratados · outputs do modelo aceitos/rejeitados: {{ format_number_ptbr(adversarial.get('adversarial_model_outputs_accepted')) if adversarial.get('adversarial_model_outputs_accepted') is number else 'indisponível' }}/{{ format_number_ptbr(adversarial.get('adversarial_model_outputs_rejected')) if adversarial.get('adversarial_model_outputs_rejected') is number else 'indisponível' }}. Sucesso do guardrail não é sucesso do modelo.

              | Casos totais | Elegíveis | Tentativas RTX | Inferências | Saídas úteis | Useful rate entre tentativas | Cobertura end-to-end | Fallbacks |
              |--:|--:|--:|--:|--:|--:|--:|--:|
              | {{ format_number_ptbr(totals.get('total_cases')) if totals.get('total_cases') is number else 'indisponível' }} | {{ format_number_ptbr(totals.get('eligible_cases')) if totals.get('eligible_cases') is number else 'indisponível' }} | {{ format_number_ptbr(totals.get('rtx_attempted_cases')) if totals.get('rtx_attempted_cases') is number else 'indisponível' }} | {{ format_number_ptbr(totals.get('local_inference_calls')) if totals.get('local_inference_calls') is number else 'indisponível' }} | {{ format_number_ptbr(totals.get('useful_cases')) if totals.get('useful_cases') is number else 'indisponível' }} | {{ (format_number_ptbr((totals.get('useful_rtx_rate_among_attempts') | float(0)) * 100, 2) ~ '%') if totals.get('useful_rtx_rate_among_attempts') is number else 'indisponível' }} | {{ (format_number_ptbr((totals.get('end_to_end_useful_coverage') | float(0)) * 100, 2) ~ '%') if totals.get('end_to_end_useful_coverage') is number else 'indisponível' }} | {{ format_number_ptbr(totals.get('fallback_cases')) if totals.get('fallback_cases') is number else 'indisponível' }} |

              | Ocorrências críticas | Casos com erro crítico | Contexto GPT direto | Contexto GPT roteado | Tokens GPT potencialmente evitados | Redução estimada de contexto GPT | Latência local acumulada |
              |--:|--:|--:|--:|--:|--:|--:|
              | {{ format_number_ptbr(totals.get('critical_error_occurrences')) if totals.get('critical_error_occurrences') is number else 'indisponível' }} | {{ format_number_ptbr(totals.get('cases_with_critical_error')) if totals.get('cases_with_critical_error') is number else 'indisponível' }} | {{ format_number_ptbr(totals.get('estimated_baseline_gpt_tokens')) if totals.get('estimated_baseline_gpt_tokens') is number else 'indisponível' }} **ESTIMADO/SIMULADO** | {{ format_number_ptbr(totals.get('estimated_routed_gpt_tokens')) if totals.get('estimated_routed_gpt_tokens') is number else 'indisponível' }} **ESTIMADO/SIMULADO** | {{ format_number_ptbr(totals.get('estimated_avoided_gpt_tokens')) if totals.get('estimated_avoided_gpt_tokens') is number else 'indisponível' }} **ESTIMADO** | {{ (format_number_ptbr((totals.get('estimated_weighted_gpt_context_reduction') | float(0)) * 100, 2) ~ '%') if totals.get('estimated_weighted_gpt_context_reduction') is number else 'indisponível' }} **ESTIMADO/SIMULADO** | {{ (format_number_ptbr(totals.get('local_added_latency_total_seconds'), 3) ~ ' s') if totals.get('local_added_latency_total_seconds') is number else 'indisponível' }} **MEDIDO** |

              | Atividade | Casos totais | Elegíveis | Tentativas | Inferências | Aceitas | Useful rate/tentativas | Cobertura end-to-end | Fallbacks | Casos críticos | Qualidade RTX | Qualidade determinística | p50 RTX | p50 determinístico | Vantagem operacional | Decisão |
              |:--|--:|--:|--:|--:|--:|--:|--:|--:|--:|--:|--:|--:|--:|:--:|:--|
              {% for item in rows -%}
              | `{{ item.get('activity') }}`{% if item.get('sample_status') == 'insufficient_sample' %} ⚪{% endif %} | {{ format_number_ptbr(item.get('total_cases')) if item.get('total_cases') is number else 'indisponível' }} | {{ format_number_ptbr(item.get('eligible_cases')) if item.get('eligible_cases') is number else 'indisponível' }} | {{ format_number_ptbr(item.get('rtx_attempted_cases')) if item.get('rtx_attempted_cases') is number else 'indisponível' }} | {{ format_number_ptbr(item.get('local_inference_calls')) if item.get('local_inference_calls') is number else 'indisponível' }} | {{ format_number_ptbr(item.get('accepted_cases')) if item.get('accepted_cases') is number else 'indisponível' }} | {{ (format_number_ptbr((item.get('useful_rtx_rate_among_attempts') | float(0)) * 100, 2) ~ '%') if item.get('useful_rtx_rate_among_attempts') is number else 'indisponível' }} | {{ (format_number_ptbr((item.get('end_to_end_useful_coverage') | float(0)) * 100, 2) ~ '%') if item.get('end_to_end_useful_coverage') is number else 'indisponível' }} | {{ format_number_ptbr(item.get('fallback_cases')) if item.get('fallback_cases') is number else 'indisponível' }} | {{ format_number_ptbr(item.get('cases_with_critical_error')) if item.get('cases_with_critical_error') is number else 'indisponível' }} | {{ (format_number_ptbr((item.get('rtx_quality_score') | float(0)) * 100, 2) ~ '%') if item.get('rtx_quality_score') is number else 'indisponível' }} | {{ (format_number_ptbr((item.get('baseline_quality_score') | float(0)) * 100, 2) ~ '%') if item.get('baseline_quality_score') is number else 'indisponível' }} | {{ (format_number_ptbr(item.get('rtx_latency_p50_seconds'), 3) ~ ' s') if item.get('rtx_latency_p50_seconds') is number else 'indisponível' }} | {{ (format_number_ptbr(item.get('baseline_latency_p50_seconds'), 6) ~ ' s') if item.get('baseline_latency_p50_seconds') is number else 'indisponível' }} | {{ 'SIM' if item.get('rtx_operational_advantage') == true else 'NÃO' if item.get('rtx_operational_advantage') == false else 'indisponível' }} | `{{ item.get('decision') or 'não informada' }}` |
              {% endfor %}

              **Capacidade** (houve saída aceita), **utilidade no benchmark**,
              **redução estimada de contexto**, **vantagem operacional** e
              **aptidão para produção** são critérios distintos. Nenhuma das cinco
              atividades possui vantagem operacional ou habilitação de produção.
              `summarize-log` está excluído e permanece em benchmark separado; estes dados não
              entram nos contadores operacionais.
              {% else %}
              {{ badges.get(status, '⚪ AMOSTRA INSUFICIENTE') }} — nenhum artefato
              de benchmark sanitizado foi carregado pelo bridge.
              {% endif %}

          - type: markdown
            title: Referência controlada de qualidade
            content: >-
              **Benchmark offline v4 · 24/08/2026:** gerador
              `qwen2.5-coder:14b`, 8 fixtures de desenvolvimento/holdout e 2
              repetições. Tanto `qwen3:8b` quanto `qwen3:14b` produziram **2/16
              candidatos selecionáveis**, **4.096 tokens líquidos offline** e
              redução ponderada **13,6%**, com mediana por tentativa **0,0%**.
              O 14B reduziu falsos rejeites de **9 para 6**, mas elevou a taxa do
              gate sem aumentar o saldo líquido; portanto não foi promovido.

              Somente `summarize-log` de 3.000–5.999 tokens apresentou benefício
              (65,8% nesta amostra). Os 14 casos abaixo de 3.000 tokens ficaram em
              0%. O antigo **23,2%** veio de autoavaliação e permanece histórico.
              O v4 ainda é offline: não executa o modelo principal nos dois braços,
              logo a economia operacional confirmada desta bateria é **0**.

          - type: markdown
            title: Economia útil diária — últimos 7 dias
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set local = state_attr('sensor.codex_usage_raw', 'local_ai') or {} %}
              {% set daily = local.get('daily_series', []) %}
              {% set values = daily | map(attribute='useful_context_tokens_avoided') | list %}
              {% set peak = values | max if values else 0 %}
              {% if daily %}
              {% for item in daily %}
              {% set value = item.get('useful_context_tokens_avoided', 0) | float(0) %}
              {% set reduction = item.get('useful_reduction_percent') %}
              {% set raw_blocks = ((value * 20 / peak) | int) if peak > 0 else 0 %}
              {% set blocks = [1, raw_blocks] | max if value > 0 else 0 %}
              **{{ item.get('day')[8:10] }}/{{ item.get('day')[5:7] }}** `{{ '█' * blocks }}{{ '░' * (20 - blocks) }}` **{{ format_number_ptbr(value) }} tokens** · {{ (format_number_ptbr(reduction, 1) ~ '%') if reduction is number else '—' }}

              {% endfor %}
              {% else %}
              Série diária ainda não recebida do bridge.
              {% endif %}

              **Como ler:** as barras vêm diretamente dos agregados diários UTC
              preservados pela telemetria, portanto os dias anteriores aparecem
              imediatamente e não dependem do histórico de uma entidade recém-criada.
              Somente resultados utilizados, com custo mensurado e saldo positivo,
              elevam a barra; descartes, falhas, benchmarks e legado sem custo
              separável valem zero. O valor é um saldo equivalente, não cobrança oficial.

          - type: markdown
            title: Fluxo operacional diário — últimos 7 dias
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set daily = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('daily_series', []) %}
              {% if daily %}
              {% for item in daily %}
              {% set calls = item.get('operational_calls', 0) | int(0) %}
              {% set failed = item.get('operational_failed_calls', 0) | int(0) %}
              {% set rejected = item.get('operational_quality_rejected_calls', 0) | int(0) %}
              {% set no_gain = item.get('operational_not_beneficial_calls', 0) | int(0) %}
              {% set accepted = item.get('operational_quality_validated_calls', 0) | int(0) %}
              {% set measured = item.get('operational_quality_validated_measured_calls', 0) | int(0) %}
              {% set used = item.get('operational_primary_context_used_calls', 0) | int(0) %}
              {% set usage_unconfirmed = item.get('operational_primary_context_unconfirmed_calls', 0) | int(0) %}
              {% set accepted_unmeasured = [accepted - measured, 0] | max %}
              {% set unclassified = [calls - failed - rejected - no_gain - accepted, 0] | max %}
              **{{ item.get('day')[8:10] }}/{{ item.get('day')[5:7] }} · {{ format_number_ptbr(calls) }} tentativas**
              {% if calls == 0 %}
              _Sem atividade operacional._
              {% else %}
              {% set ns = namespace(first=true) %}
              {% if used > 0 %}🟢 **{{ format_number_ptbr(used) }} usadas**{% set ns.first = false %}{% endif %}{% if usage_unconfirmed > 0 %}{{ ' · ' if not ns.first else '' }}🟡 **{{ format_number_ptbr(usage_unconfirmed) }} sem uso confirmado**{% set ns.first = false %}{% endif %}{% if rejected > 0 %}{{ ' · ' if not ns.first else '' }}🟠 **{{ format_number_ptbr(rejected) }} rejeitadas**{% set ns.first = false %}{% endif %}{% if no_gain > 0 %}{{ ' · ' if not ns.first else '' }}⚖️ **{{ format_number_ptbr(no_gain) }} sem ganho**{% set ns.first = false %}{% endif %}{% if failed > 0 %}{{ ' · ' if not ns.first else '' }}🔴 **{{ format_number_ptbr(failed) }} falhas**{% set ns.first = false %}{% endif %}{% if unclassified > 0 %}{{ ' · ' if not ns.first else '' }}⚪ **{{ format_number_ptbr(unclassified) }} sem classificação**{% set ns.first = false %}{% endif %}{% if accepted_unmeasured > 0 %}{{ ' · ' if not ns.first else '' }}🟡 **{{ format_number_ptbr(accepted_unmeasured) }} sem custo mensurado**{% endif %}

              Saldo líquido: **{{ format_number_ptbr(item.get('useful_context_tokens_avoided', 0)) }} tokens**
              {% endif %}

              {% endfor %}
              {% else %}
              Série diária ainda não recebida do bridge.
              {% endif %}

              **Como ler:** cada linha é o waterfall daquele dia UTC e vem dos
              mesmos agregados preservados usados por **Waterfall — hoje · UTC** e
              **total preservado**. *Tentativas* mede volume; categorias zeradas
              são ocultadas para facilitar a leitura. *Úteis* são resultados
              utilizados com custo do gate mensurado; rejeições, fiéis sem ganho,
              falhas e itens sem classificação ou custo valem zero na Redução
              útil líquida. Aprovação sem confirmação de uso também vale zero.
              Benchmarks ficam fora.

