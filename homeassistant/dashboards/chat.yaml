          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set today = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('periods') or {}).get('today') or {} %}
              {% set calls = today.get('operational_calls', 0) | int(0) %}
              {% set failed = today.get('operational_failed_calls', 0) | int(0) %}
              {% set completed = [calls - failed, 0] | max %}
              {% set accepted = today.get('operational_quality_validated_calls', 0) | int(0) %}
              {% set rejected = today.get('operational_quality_rejected_calls', 0) | int(0) %}
              {% set not_beneficial = today.get('operational_not_beneficial_calls', 0) | int(0) %}
              {% set gated = accepted + rejected + not_beneficial %}
              {% set unclassified = [completed - gated, 0] | max %}
              {% set approved = accepted + not_beneficial %}
              {% set accepted_measured = today.get('operational_quality_validated_measured_calls', 0) | int(0) %}
              {% set accepted_unmeasured = [accepted - accepted_measured, 0] | max %}
              {% set primary_used = today.get('operational_primary_context_used_calls', 0) | int(0) %}
              {% set usage_unconfirmed = today.get('operational_primary_context_unconfirmed_calls', 0) | int(0) %}
              **Conferência de hoje:** {{ format_number_ptbr(calls) }} =
              {{ format_number_ptbr(completed) }} + {{ format_number_ptbr(failed) }};
              {{ format_number_ptbr(completed) }} = {{ format_number_ptbr(unclassified) }} +
              {{ format_number_ptbr(gated) }}; {{ format_number_ptbr(gated) }} =
              {{ format_number_ptbr(rejected) }} + {{ format_number_ptbr(approved) }};
              {{ format_number_ptbr(approved) }} = {{ format_number_ptbr(not_beneficial) }} +
              {{ format_number_ptbr(accepted_unmeasured) }} + {{ format_number_ptbr(accepted_measured) }};
              {{ format_number_ptbr(accepted_measured) }} =
              {{ format_number_ptbr(usage_unconfirmed) }} + {{ format_number_ptbr(primary_used) }}.

              **Como ler:** este bloco usa as mesmas etapas, fórmulas e unidades
              do **Waterfall — total preservado**, mas inclui somente eventos do
              dia UTC atual. *contexto evitado validado* é somente o delta dos
              resultados aprovados, com custo mensurável e uso confirmado; contexto evitado validado − custo do gate = saldo
              líquido equivalente; a redução útil divide esse saldo pela base
              contrafactual de hoje: tokens Codex totais + saldo útil. Uso não
              confirmado, descartes, fallbacks, falhas e demais tokens fora dos
              resultados úteis valem zero no numerador.

