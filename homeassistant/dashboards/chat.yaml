              - type: tile
                entity: sensor.rtx_waterfall_total_without_gate
                name: Sem classificação
                color: amber
                vertical: true
              - type: tile
                entity: sensor.rtx_waterfall_total_gated
                name: Avaliados pelo gate
                color: purple
