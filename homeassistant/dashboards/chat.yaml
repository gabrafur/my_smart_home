title: Chat
views:
  - title: Codex
    path: codex
    icon: mdi:robot-outline
    panel: true
    cards:
      - type: custom:codex-chat-card-v2
        title: Codex
        history_limit: 200
  - title: Uso
    path: uso-codex
    icon: mdi:chart-donut
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Limite oficial do plano
            icon: mdi:chart-donut
          - type: markdown
            content: |
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set totals = state_attr('sensor.codex_usage_raw', 'totals') or {} %}
              {% set limite = state_attr('sensor.codex_usage_raw', 'rate_limit') or {} %}
              {% set consulta = state_attr('sensor.codex_usage_raw', 'rate_limit_refresh') or {} %}
              {% set reset_em = limite.get('resets_at') %}
              {% set janela = limite.get('window_type', 'desconhecida') %}
              {% if states('sensor.codex_usage_raw') == 'ok' %}
              {% if states('sensor.codex_dados_de_limite') == 'atual' and is_number(states('sensor.codex_limite_disponivel')) %}
              # {{ format_number_ptbr(states('sensor.codex_limite_disponivel')) }}% disponível

              **{{ format_number_ptbr(states('sensor.codex_limite_usado')) }}% usado** na janela
              {{ 'semanal' if janela == 'weekly' else janela }} do plano
              {% if states('sensor.codex_plano') not in ['unknown', 'unavailable', 'desconhecido'] %}
              {{ states('sensor.codex_plano') | title }}.
              {% endif %}
              {% elif limite.get('remaining_percent') is number %}
              # Leitura desatualizada

              Último valor conhecido: **{{ format_number_ptbr(limite.get('remaining_percent')) }}% disponível**.
              Confira Codex → Settings → Usage & billing para o saldo atual.
              {% else %}
              # Aguardando dados

              Ainda não há uma leitura do limite do plano.
              {% endif %}

              {% if reset_em %}
              **Reset:** {{ as_timestamp(reset_em) | timestamp_custom('%d/%m às %H:%M', true) }}
              {% endif %}
              {% if is_number(states('sensor.codex_atualizacao_do_limite_em')) %}
              **Próxima consulta:** em {{ format_number_ptbr(states('sensor.codex_atualizacao_do_limite_em')) }} segundos.
              {% endif %}
              {% if consulta.get('last_error') %}

              _A consulta automática ao Codex está temporariamente indisponível; estes são os últimos dados recebidos._
              {% endif %}
              {% else %}
              # Coleta indisponível

              Aguardando a primeira métrica do Codex CLI.
              {% endif %}
          - type: grid
            title: Indicadores principais
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.codex_limite_usado
                name: Usado · última leitura
                min: 0
                max: 100
                severity: { green: 0, yellow: 70, red: 90 }
              - type: gauge
                entity: sensor.codex_limite_disponivel
                name: Disponível · última leitura
                min: 0
                max: 100
                severity: { red: 0, yellow: 10, green: 30 }
              - type: gauge
                entity: sensor.codex_eficiencia_de_cache
                name: Eficiência de cache · local
                min: 0
                max: 100
                severity: { red: 0, yellow: 30, green: 60 }
              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.codex_uso_projetado_no_reset
                    above: -1
                card:
                  type: gauge
                  entity: sensor.codex_uso_projetado_no_reset
                  name: Uso projetado no reset
                  min: 0
                  max: 100
                  severity: { green: 0, yellow: 90, red: 100 }
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.codex_uso_projetado_no_reset
                    state: unavailable
                card:
                  type: gauge
                  entity: sensor.codex_progresso_da_janela_semanal
                  name: Tempo decorrido na janela
                  min: 0
                  max: 100
                  severity: { green: 0, yellow: 70, red: 90 }
          - type: entities
            title: Plano e atualização
            show_header_toggle: false
            entities:
              - entity: sensor.codex_dados_de_limite
                name: Estado da leitura
              - entity: sensor.codex_plano
                name: Plano
              - entity: sensor.codex_creditos_extras
                name: Créditos extras
              - entity: sensor.codex_proximo_reset
                name: Reset semanal
              - entity: sensor.codex_ultima_atualizacao_do_limite
                name: Leitura recebida em
              - entity: sensor.codex_atualizacao_do_limite_em
                name: Próxima consulta em
              - entity: sensor.codex_proxima_atualizacao_do_limite
                name: Próxima consulta às
              - entity: script.codex_atualizar_uso_agora
                name: Atualizar agora
                icon: mdi:refresh

      - type: grid
        cards:
          - type: heading
            heading: Análise e métricas locais
            icon: mdi:chart-timeline-variant
          - type: markdown
            content: >-
              Estes números descrevem somente as sessões preservadas neste host.
              Eles ajudam a entender o trabalho local, mas **não representam o limite
              oficial do plano**.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.codex_uso_projetado_no_reset
                above: -1
            card:
              type: entities
              title: Tendência da janela semanal
              show_header_toggle: false
              entities:
                - entity: sensor.codex_previsao_ate_o_reset
                  name: Aguenta até o reset?
                - entity: sensor.codex_ritmo_do_limite
                  name: Ritmo observado
                - entity: sensor.codex_uso_projetado_no_reset
                  name: Uso projetado no reset
                - entity: sensor.codex_folga_projetada_no_reset
                  name: Folga projetada
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.codex_uso_projetado_no_reset
                state: unavailable
            card:
              type: markdown
              content: >-
                **Tendência da janela semanal**

                ⏳ Projeção aguardando pelo menos uma hora de observações comparáveis
                na mesma janela. Até lá, o quarto gauge mostra somente o tempo decorrido.
          - type: grid
            title: Consumo registrado
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_sessoes_monitoradas
                name: Sessões
              - type: tile
                entity: sensor.codex_tokens_totais
                name: Tokens totais
              - type: tile
                entity: sensor.codex_tokens_em_cache
                name: Tokens em cache
              - type: tile
                entity: sensor.codex_tokens_de_saida
                name: Tokens de saída
              - type: tile
                entity: sensor.codex_velocidade_7_dias
                name: Média por hora · 7 dias
          - type: markdown
            content: >-
              ## Histórico deste computador

              Estes dados vêm apenas das sessões registradas **nesta máquina**.
              Eles servem para analisar o uso local e **não são o saldo semanal do
              seu plano**. O limite oficial fica no topo do painel e é consultado
              automaticamente a cada 30 segundos.
          - type: markdown
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              ## Última atividade local

              {% set registrada_em = state_attr('sensor.codex_usage_raw', 'source_updated_at') %}
              {% set instante = as_timestamp(registrada_em, 0) | float(0) %}
              {% set idade_segundos = [0, (as_timestamp(now()) - instante) | int(0)] | max if instante > 0 else none %}
              **Última conversa registrada nesta máquina:**
              {% if idade_segundos is none %}
              ainda não há conversa registrada.
              {% elif idade_segundos < 60 %}
              agora mesmo.
              {% elif idade_segundos < 3600 %}
              {% set idade_minutos = (idade_segundos / 60) | int %}
              há {{ format_number_ptbr(idade_minutos) }} minuto{{ '' if idade_minutos == 1 else 's' }}.
              {% elif idade_segundos < 86400 %}
              {% set idade_horas = (idade_segundos / 3600) | int %}
              há {{ format_number_ptbr(idade_horas) }} hora{{ '' if idade_horas == 1 else 's' }}.
              {% else %}
              em {{ instante | timestamp_custom('%d/%m/%Y às %H:%M', true) }}.
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Alertas e ajuda
            icon: mdi:bell-outline
          - type: entities
            title: Alertas
            show_header_toggle: false
            entities:
              - entity: sensor.codex_nivel_de_alerta
                name: Situação atual
              - entity: input_boolean.codex_alertas_iphone
              - entity: input_boolean.codex_resumo_diario_iphone
              - entity: input_number.codex_alerta_aviso_percentual
              - entity: input_number.codex_alerta_critico_percentual
              - entity: input_number.codex_alerta_saldo_creditos
              - entity: input_text.codex_ultimo_alerta_iphone
              - entity: input_datetime.codex_ultimo_alerta_iphone_em
          - type: markdown
            content: >-
              **Como interpretar**

              O limite do plano é semanal e não zera ao fim do dia. Leituras com
              mais de quinze minutos ficam marcadas como desatualizadas e deixam de
              alimentar alertas. Os gauges de uso preservam a última leitura conhecida,
              identificada explicitamente como tal.

              O quarto gráfico mostra uma projeção somente depois de observar pelo menos
              uma hora da mesma janela. Antes disso, ele mostra apenas o tempo decorrido
              na semana, que não depende de extrapolação.

              A eficiência de cache mede reaproveitamento de tokens de entrada; não
              é saldo, cobrança nem qualidade das respostas. Usos feitos em outros
              computadores podem não aparecer nas métricas locais.

              O valor oficial continua disponível em **Codex → Settings → Usage & billing**.

  - title: RTX 4070
    path: uso-rtx
    icon: mdi:expansion-card-variant
    # Uma seção contínua por coluna evita que cards altos criem lacunas. A
    # distribuição equilibra roteamento/memória, atividade/economia e qualidade/histórico.
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        cards:
          - type: grid
            title: Saúde da infraestrutura
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_local_ai_status
                name: Local AI
                color: blue
              - type: tile
                entity: sensor.codex_rtx_4070
                name: RTX 4070
                color: cyan
              - type: tile
                entity: sensor.codex_ollama_local
                name: Ollama
                color: purple
              - type: tile
                entity: sensor.codex_modelo_local
                name: Modelo local
                color: blue

          - type: markdown
            content: >-
              # RTX 4070 / Local AI

              {% set live = states('sensor.codex_rtx_ao_vivo') %}
              {% if live == 'em uso' %}
              🟢 **Inferência local ativa** — {{ state_attr('sensor.codex_rtx_ao_vivo', 'tarefa') }} ·
              {{ state_attr('sensor.codex_rtx_ao_vivo', 'modelo') }}.
              {% elif live == 'disponível' %}
              🟢 **Infraestrutura pronta.** Local AI, Ollama e RTX estão disponíveis;
              aguardando uma tarefa em que a compactação local traga benefício real.
              {% elif live == 'desatualizado' %}
              🟡 **Sinal da RTX desatualizado.** A última verificação de saúde tem mais de dois
              minutos; aguardando a próxima confirmação do bridge antes de afirmar que a RTX está pronta.
              {% elif live == 'sem sinal' %}
              🔴 **Sem sinal do bridge Local AI.** O painel tentará novamente automaticamente.
              {% else %}
              🔴 **Local AI indisponível.** Consulte os cards de infraestrutura e o diagnóstico recente.
              {% endif %}

              _Atualização automática: atividade e métricas em ~2 s; saúde em ~1 min._

              {% set chats = state_attr('sensor.codex_rtx_ao_vivo', 'chats_ativos') or [] %}
              {% if chats %}
              ## Chats usando a RTX agora

              {% for chat in chats %}
              - **{{ chat.chat_name or ('Chat Codex #' ~ chat.chat_id) }}** — {{ chat.task }} · {{ chat.model }} ·
                GPU {{ chat.gpu_util_percent if chat.gpu_util_percent is not none else 'amostrando' }}% ·
                VRAM {{ chat.vram_mib if chat.vram_mib is not none else 'amostrando' }} MiB
              {% endfor %}

              Nomes explícitos enviados pelo chat aparecem aqui; caso contrário, o
              identificador curto é usado sem revelar conteúdo da conversa.
              {% endif %}

          - type: grid
            title: Atenção de roteamento — hoje
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_oportunidades_rtx_perdidas_hoje
                name: Oportunidades realmente perdidas
                color: red
              - type: markdown
                content: |-
                  {% from 'formatting.jinja' import format_number_ptbr %}
                  {% set today = (((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('routing') or {}).get('periods') or {}).get('today') or {} %}
                  **Tokens potenciais dessas perdas**

                  # {{ format_number_ptbr(today.get('missed_potential_tokens_avoidable', 0)) }}
              - type: tile
                entity: sensor.codex_local_ai_indisponivel_hoje
                name: RTX indisponível (confirmado)
                color: red
              - type: tile
                entity: sensor.codex_disponibilidade_rtx_desconhecida_hoje
                name: Estado RTX desconhecido
                color: amber
              - type: tile
                entity: sensor.codex_falhas_de_roteamento_local_ai_hoje
                name: Falhas após delegação
                color: red
              - type: markdown
                content: |-
                  {% from 'formatting.jinja' import format_number_ptbr %}
                  {% set today = (((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('routing') or {}).get('periods') or {}).get('today') or {} %}
                  {% set eligible = today.get('eligible_tasks', 0) | float(0) %}
                  {% set available = today.get('eligible_and_available_tasks', 0) | float(0) %}
                  **Disponibilidade nas elegíveis**

                  # {{ format_number_ptbr((available / eligible * 100) if eligible > 0 else 0, 1) }}%
              - type: markdown
                content: >-
                  {% from 'formatting.jinja' import format_number_ptbr %}
                  {% set today = (((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('routing') or {}).get('periods') or {}).get('today') or {} %}
                  **Fluxo avaliado:** {{ format_number_ptbr(today.get('tasks', 0)) }} tarefas ·
                  {{ format_number_ptbr(today.get('eligible_tasks', 0)) }} elegíveis ·
                  {{ format_number_ptbr(today.get('eligible_and_available_tasks', 0)) }} com RTX disponível.

                  **Como ler:** *elegível* significa que tamanho, tipo e
                  compressibilidade justificavam a RTX; *disponível* confirma
                  que o endpoint respondia; *perdida* é uma tarefa elegível e
                  disponível que não chamou o helper. *Falha após delegação*
                  confirma erro técnico depois da escolha da RTX. Este bloco
                  contém somente sinais acionáveis; rejeições de qualidade
                  aparecem em **Resultado e qualidade — hoje**.

          - type: entities
            title: Decisão de roteamento
            show_header_toggle: false
            entities:
              - entity: sensor.codex_ultima_decisao_de_roteamento_local_ai
                name: Decisão

          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set task = state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'tarefa') %}
              {% set decision = states('sensor.codex_ultima_decisao_de_roteamento_local_ai') %}
              {% if task %}
              ## Última decisão Local AI

              **Tarefa:** {{ task }}

              **Elegível:** {{ 'SIM' if state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'elegivel') else 'NÃO' }}

              **RTX disponível:** {{ 'SIM' if state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'rtx_disponivel') else 'NÃO' }}

              **Decisão:** {{ decision }}

              **Motivo:** {{ state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'motivo') }}

              Entrada: ~{{ format_number_ptbr(state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'input_tokens_estimados')) }} tokens ·
              economia esperada: ~{{ format_number_ptbr(state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'economia_esperada_tokens')) }} tokens ·
              economia bruta: {{ format_number_ptbr(state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'economia_bruta_tokens')) if state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'economia_bruta_tokens') is not none else 'não mensurada' }} ·
              custo do gate: {{ format_number_ptbr(state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'custo_gate_validacao_tokens')) if state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'custo_gate_validacao_tokens') is not none else 'não mensurado' }} ·
              economia útil líquida: {{ format_number_ptbr(state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'economia_real_tokens')) if state_attr('sensor.codex_ultima_decisao_de_roteamento_local_ai', 'economia_real_tokens') is not none else 'não mensurada' }}.
              {% else %}
              ## Última decisão Local AI

              Ainda não há uma decisão de roteamento registrada.
              {% endif %}

              **Como ler:** *economia esperada* é a previsão antes da chamada;
              *economia útil líquida* é o delta aprovado menos os tokens locais usados
              pelo gate do resultado; quando há rejeição ou falha, vale zero.
              *Elegível* não prova execução: uso real exige uma decisão
              `LOCAL_AI_USED` com resultado validado.

          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set routing = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('routing') or {} %}
              {% set missed = routing.get('latest_decisions', []) | selectattr('decision', 'eq', 'ROUTING_MISSED_OPPORTUNITY') | list %}
              ## Oportunidades RTX perdidas

              **Como ler:** este bloco lista somente decisões operacionais
              `ROUTING_MISSED_OPPORTUNITY`; o potencial é estimado antes da
              inferência e não representa cobrança.

              **Hoje:** {{ format_number_ptbr(states('sensor.codex_oportunidades_rtx_perdidas_hoje')) }} ·
              potencial de contexto das perdas de hoje: ~{{ format_number_ptbr(((routing.get('periods') or {}).get('today') or {}).get('missed_potential_tokens_avoidable', 0)) }} tokens.

              {% if missed %}
              {% for item in missed %}
              - {{ item.get('task_type') }} · ~{{ format_number_ptbr(item.get('expected_tokens_saved')) }} tokens potenciais · {{ item.get('reason') }}
              {% endfor %}
              {% else %}
              Nenhuma oportunidade perdida recente registrada.
              {% endif %}

          - type: markdown
            title: Diagnóstico da última execução
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set task = state_attr('sensor.codex_ultimo_job_local_ai', 'tarefa') %}
              {% set status = states('sensor.codex_ultimo_job_local_ai') %}
              {% if task and status == 'em andamento' %}
              ## Inferência em andamento

              **{{ task }}** · {{ state_attr('sensor.codex_ultimo_job_local_ai', 'modelo') }} ·
              iniciada em {{ state_attr('sensor.codex_ultimo_job_local_ai', 'iniciado_em') }}.

              GPU, VRAM e potência são atualizadas na seção **Atividade ao vivo**.
              {% elif task and status == 'success' %}
              ## Último job de GPU

              **{{ task }}** · {{ state_attr('sensor.codex_ultimo_job_local_ai', 'modelo') }} ·
              {{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'duracao_s'), 3) }} s ·
              {{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'tokens_por_segundo'), 2) }} tok/s

              GPU pico: **{{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'pico_gpu_percentual')) }}%** ·
              VRAM pico: **{{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'pico_vram_mib')) }} MiB** ·
              Contexto: **{{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'tokens_contexto_entrada')) }} →
              {{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'tokens_contexto_saida')) }} tokens** ·
              economia bruta **~{{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'economia_bruta_validada_tokens')) }}** −
              gate **{{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'custo_gate_validacao_tokens')) }}** =
              útil líquido **~{{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'tokens_openai_evitados_estimados')) }} tokens** ·
              redução útil líquida **~{{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'reducao_contexto_percentual'), 1) }}%** ·
              gate de qualidade **{{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'qualidade_percentual')) }}%** ·
              {{ state_attr('sensor.codex_ultimo_job_local_ai', 'processador') or 'processador não amostrado' }}.

              Overhead do envelope OpenAI: **não mensurado**; a economia é uma estimativa de
              conteúdo aprovada pelo gate, pelo método `{{ state_attr('sensor.codex_ultimo_job_local_ai', 'metodo_contagem_tokens') }}`.
              {% elif task and status in ['failed', 'discarded'] %}
              ## Último job de GPU

              A última execução de **{{ task }}** foi {{ 'descartada pelo gate de qualidade' if status == 'discarded' else 'interrompida por falha técnica' }} em
              {{ format_number_ptbr(state_attr('sensor.codex_ultimo_job_local_ai', 'duracao_s'), 3) }} s
              ({{ state_attr('sensor.codex_ultimo_job_local_ai', 'erro_tipo') or 'tipo não informado' }}).
              Nenhum token economizado é contabilizado para uma execução sem sucesso.
              {% else %}
              ## Último job de GPU

              Nenhuma inferência local foi registrada ainda.
              {% endif %}

              **Como ler:** este diagnóstico descreve a tentativa mais recente;
              a “última falha” do resumo acima considera somente erros técnicos.
              *job* é uma tentativa de inferência; *success*
              indica resultado validado e utilizado; *discarded* indica rejeição
              de qualidade; *failed* indica falha técnica. GPU/VRAM são picos
              amostrados durante o job, não valores de repouso.

          - type: grid
            title: Contexto inicial e memória — hoje
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_contexto_inicial_observavel
                name: Startup observável
                color: blue
              - type: tile
                entity: sensor.codex_memoria_recuperada_hoje
                name: Memória recuperada
                color: purple
              - type: tile
                entity: sensor.codex_memoria_enviada_ao_modelo_principal_hoje
                name: Enviada ao GPT
                color: cyan
              - type: tile
                entity: sensor.codex_contexto_de_memoria_evitado_hoje
                name: Contexto evitado
                color: green
              - type: tile
                entity: sensor.codex_compressao_de_memoria_hoje
                name: Compressão de memória
                color: purple
              - type: tile
                entity: sensor.codex_sobrecargas_de_memoria_hoje
                name: Sobrecargas
                color: red
              - type: markdown
                content: |-
                  {% from 'formatting.jinja' import format_number_ptbr %}
                  {% set today = ((((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('memory') or {}).get('periods') or {}).get('today') or {}) %}
                  **Recuperações**

                  # {{ format_number_ptbr(today.get('retrieval_calls', 0)) }}
              - type: markdown
                content: |-
                  {% from 'formatting.jinja' import format_number_ptbr %}
                  {% set today = ((((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('memory') or {}).get('periods') or {}).get('today') or {}) %}
                  **Ocorrências de arquivos**

                  # {{ format_number_ptbr(today.get('files_found', 0)) }}

          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set memory = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('memory') or {} %}
              {% set startup = memory.get('startup_context') or {} %}
              {% set today = (memory.get('periods') or {}).get('today') or {} %}
              ## Contexto inicial

              **AGENTS / instructions observáveis:** ~{{ format_number_ptbr(startup.get('observable_startup_context_tokens', 0)) }} tokens
              (global: ~{{ format_number_ptbr(startup.get('global_agents_tokens', 0)) }} · repositório: ~{{ format_number_ptbr(startup.get('repo_agents_tokens', 0)) }}).

              **Memória pré-carregada:** {{ format_number_ptbr(startup.get('repo_memory_tokens', 0)) }} tokens ·
              **corpus indexado:** ~{{ format_number_ptbr(today.get('memory_tokens_available', 0)) }} tokens ·
              **memória recuperada:** ~{{ format_number_ptbr(today.get('memory_tokens_retrieved', 0)) }} tokens ·
              **enviada ao GPT:** ~{{ format_number_ptbr(today.get('memory_tokens_sent_to_primary_model', 0)) }} tokens ·
              **contexto evitado:** ~{{ format_number_ptbr(today.get('memory_tokens_avoided', 0)) }} tokens.

              {% if startup.get('total_startup_context_tokens') is none %}
              O envelope interno do Codex e a memória privada automática não expõem contagem de tokens; este card mostra somente o contexto observável e indica estimativas quando aplicável.
              {% endif %}

              **Como ler:** *startup observável* são instruções mensuráveis;
              *recuperações* conta consultas com memória encontrada; *ocorrências
              de arquivos* soma seleções e não arquivos únicos;
              *recuperada* é a memória selecionada sob demanda; *enviada ao GPT*
              é o contexto que realmente seguiu ao modelo principal, integral ou
              condensado; *evitada* é a diferença útil. *Sobrecarga*
              registra contexto grande que não foi comprimido localmente.

              {% if today.get('memory_tokens_retrieved', 0) | float(0) > 0 and today.get('compression_events', 0) | int(0) == 0 %}
              Hoje a memória recuperada foi enviada diretamente porque ficou
              dentro do orçamento; **zero contexto evitado é esperado**, não
              uma falha de roteamento.
              {% endif %}

          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set decision = state_attr('sensor.codex_usage_raw', 'local_ai') or {} %}
              {% set memory = decision.get('memory') or {} %}
              {% set latest = (memory.get('latest_decisions') or [])[0] if memory.get('latest_decisions') else {} %}
              {% if latest %}
              ## Último roteamento de memória

              **Tema:** {{ latest.get('topic') }} · **arquivos encontrados:** {{ format_number_ptbr(latest.get('files_found')) }}

              Memória recuperada: ~{{ format_number_ptbr(latest.get('memory_tokens_retrieved', 0)) }} tokens ·
              enviada ao Local AI: ~{{ format_number_ptbr(latest.get('memory_tokens_sent_to_local_ai', 0)) }} ·
              enviada ao GPT: ~{{ format_number_ptbr(latest.get('memory_tokens_sent_to_primary_model', 0)) }} ·
              contexto evitado: ~{{ format_number_ptbr(latest.get('memory_tokens_avoided', 0)) }}.

              **Decisão:** {{ latest.get('decision') }} · {{ latest.get('reason') }}
              {% else %}
              ## Último roteamento de memória

              Memory retrieval: **SKIPPED** — ainda não há decisão registrada nesta telemetria.
              {% endif %}

              **Como ler:** a decisão informa se a memória foi ignorada,
              enviada diretamente, comprimida ou descartada. *Arquivos
              encontrados* mede o retrieval; somente a diferença entre memória
              recuperada e contexto validado enviado ao GPT conta como economia.

      - type: grid
        cards:
          - type: grid
            title: Atividade ao vivo
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_rtx_ao_vivo
                name: Estado
                color: green
              - type: tile
                entity: sensor.codex_rtx_gpu_agora
                name: GPU agora
                color: cyan
              - type: tile
                entity: sensor.codex_rtx_vram_agora
                name: VRAM agora
                color: purple
              - type: tile
                entity: sensor.codex_rtx_potencia_agora
                name: Potência agora
                color: amber

          - type: grid
            title: Última atividade
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_ultimo_job_local_ai
                name: Job atual / último
                color: blue
              - type: tile
                entity: sensor.codex_ultima_decisao_de_roteamento_local_ai
                name: Última decisão
                color: purple
              - type: tile
                entity: sensor.codex_ultima_falha_local_ai
                name: Última falha
                color: red
              - type: tile
                entity: sensor.codex_ultima_decisao_de_memoria
                name: Última memória
                color: cyan

          - type: markdown
            content: >-
              **Como ler:** *Job atual / último* acompanha a inferência; *última
              decisão* mostra a escolha do roteador; *última falha* considera
              apenas erro técnico; *última memória* descreve o retrieval mais
              recente. Os horários podem ser diferentes porque são eventos
              independentes.

          - type: grid
            title: Economia acumulada (estimativa)
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_tokens_openai_evitados_hoje_estimados
                name: Hoje
                color: green
              - type: tile
                entity: sensor.codex_tokens_openai_evitados_semana_estimados
                name: Esta semana
                color: green
              - type: tile
                entity: sensor.codex_tokens_openai_evitados_mes_estimados
                name: Este mês
                color: green
              - type: tile
                entity: sensor.codex_tokens_openai_evitados_estimados
                name: Total
                color: green

          - type: markdown
            content: >-
              **Como ler:** **chamadas** medem quantas tarefas locais foram tentadas; **tokens economizados**
              mostram a economia líquida dos resultados aprovados, já descontados
              os tokens locais usados por seus gates de fidelidade.
              São unidades diferentes e não devem ser comparadas no mesmo gráfico. A estimativa
              não representa cobrança oficial da OpenAI; descartes contam zero.
              *Hoje*, *semana* e *mês* usam janelas UTC; *total* cobre toda a
              telemetria preservada.

          - type: grid
            title: Waterfall acumulado — até o resultado útil
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_chamadas_local_ai
                name: Chamadas registradas
                color: blue
              - type: tile
                entity: sensor.codex_chamadas_local_ai_com_sucesso
                name: Conclusões técnicas
                color: cyan
              - type: tile
                entity: sensor.codex_resultados_local_ai_com_gate
                name: Resultados com gate
                color: purple
              - type: tile
                entity: sensor.codex_resultados_local_ai_validados
                name: Resultados validados
                color: green
              - type: tile
                entity: sensor.codex_economia_bruta_validada
                name: Economia bruta mensurável
                color: blue
              - type: tile
                entity: sensor.codex_custo_gate_validacao_resultados
                name: Custo do gate nos validados
                color: amber
              - type: tile
                entity: sensor.codex_tokens_openai_evitados_estimados
                name: Tokens úteis líquidos
                color: green
              - type: tile
                entity: sensor.codex_reducao_de_contexto_local_ai
                name: Redução útil líquida
                color: green

          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set totals = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('totals') or {} %}
              {% set completed = totals.get('successful_calls', 0) | int(0) %}
              {% set gated = (totals.get('quality_validated_calls', 0) | int(0)) + (totals.get('quality_rejected_calls', 0) | int(0)) %}
              {% set unclassified = [completed - gated, 0] | max %}
              {% set unmeasured = totals.get('quality_validation_unmeasured_calls', 0) | int(0) %}
              {% set unmeasured_gross = totals.get('quality_validation_unmeasured_gross_tokens', 0) | float(0) %}
              **Saídas acumuladas:** {{ format_number_ptbr(totals.get('failed_calls', 0)) }} falhas técnicas ·
              {{ format_number_ptbr(unclassified) }} sem classificação de qualidade ·
              {{ format_number_ptbr(totals.get('quality_rejected_calls', 0)) }} descartes pelo gate.

              {% if unmeasured > 0 %}
              ⚠️ {{ format_number_ptbr(unmeasured) }} resultados do legado não
              separam os tokens do verificador. Seus {{ format_number_ptbr(unmeasured_gross) }}
              tokens brutos ficam fora da etapa mensurável e valem zero líquido.
              {% endif %}

              **Como ler:** os quatro primeiros indicadores acompanham a perda
              de volume até a validação. Os quatro últimos mudam para tokens:
              economia bruta aprovada − tokens locais de entrada e saída do
              gate dos aprovados = tokens úteis líquidos. A redução útil divide
              esse líquido por todo o contexto tentado. Fallbacks ficam fora
              porque não formam uma etapa reconciliável.

          - type: statistics-graph
            title: GPU — últimas 48 horas
            chart_type: line
            period: 5minute
            days_to_show: 2
            stat_types:
              - max
            entities:
              - entity: sensor.codex_rtx_gpu_historico
                name: GPU

          - type: statistics-graph
            title: VRAM — últimas 48 horas
            chart_type: line
            period: 5minute
            days_to_show: 2
            stat_types:
              - max
            entities:
              - entity: sensor.codex_rtx_vram_historico
                name: VRAM

          - type: statistics-graph
            title: Potência — últimas 48 horas
            chart_type: line
            period: 5minute
            days_to_show: 2
            stat_types:
              - max
            entities:
              - entity: sensor.codex_rtx_potencia_historico
                name: Potência

      - type: grid
        cards:
          - type: grid
            title: Resultado e qualidade — hoje
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.codex_economia_bruta_validada_hoje
                name: Economia bruta mensurável
                color: blue
              - type: tile
                entity: sensor.codex_custo_gate_validacao_resultados_hoje
                name: Custo do gate nos validados
                color: amber
              - type: tile
                entity: sensor.codex_tokens_openai_evitados_hoje_estimados
                name: Tokens úteis líquidos
                color: green
              - type: tile
                entity: sensor.codex_reducao_de_contexto_local_ai_hoje
                name: Redução útil líquida
                color: green
              - type: tile
                entity: sensor.codex_resultados_local_ai_validados_hoje
                name: Validados pelo gate
                color: green
              - type: tile
                entity: sensor.codex_resultados_local_ai_descartados_hoje
                name: Descartados por qualidade
                color: red
              - type: tile
                entity: sensor.codex_taxa_de_delegacao_rtx_hoje
                name: Taxa de delegação
                color: blue
              - type: tile
                entity: sensor.codex_cobertura_ponderada_de_economia_rtx_hoje
                name: Cobertura de economia
                color: purple

          - type: markdown
            content: >-
              **Como ler:** *economia bruta* é o delta de contexto dos resultados
              aprovados; *custo do gate* soma entrada e saída locais usadas para
              verificar esses resultados; *tokens úteis líquidos* é a diferença
              não negativa entre ambos. *Redução útil líquida* segue o A/B:
              divide esse líquido por todo o contexto tentado, portanto descartes
              e falhas reduzem o percentual;
              *validados* exige `quality_accepted: true`; *descartados* vale
              zero economia. *Delegação* mede usos entre tarefas elegíveis e
              disponíveis; *cobertura* pondera tokens úteis contra o potencial.

          - type: tile
            entity: sensor.codex_economia_util_liquida_validada_hoje
            name: Economia útil líquida · hoje
            color: green

          - type: statistics-graph
            title: Economia útil diária — últimos 7 dias
            chart_type: bar
            period: day
            days_to_show: 7
            stat_types:
              - max
            entities:
              - entity: sensor.codex_economia_util_liquida_validada_hoje
                name: Tokens úteis líquidos

          - type: markdown
            content: >-
              **Como ler:** cada barra mostra o total útil líquido máximo do dia;
              o contador reinicia à meia-noite UTC. Somente resultados aprovados
              cujo delta supera o custo local do gate elevam a série; descartes,
              falhas, benchmarks e legado sem custo separável valem zero. A entidade diária dedicada evita herdar o histórico bruto
              da métrica antiga e não representa cobrança oficial da OpenAI.

          - type: history-graph
            title: Chamadas Local AI — últimos 7 dias
            hours_to_show: 168
            entities:
              - entity: sensor.codex_chamadas_local_ai
                name: Chamadas Local AI

          - type: markdown
            content: >-
              **Como ler:** a série é um contador acumulado de tentativas
              operacionais. Ela cresce tanto para resultados aceitos quanto para
              descartes ou falhas; benchmarks diagnósticos ficam fora.

          - type: statistics-graph
            title: Taxa média diária de falhas técnicas — últimos 7 dias
            chart_type: bar
            period: day
            days_to_show: 7
            stat_types:
              - mean
            entities:
              - entity: sensor.codex_taxa_de_falhas_local_ai_hoje
                name: Média diária

          - type: markdown
            content: >-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set today = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('periods') or {}).get('today') or {} %}
              {% set calls = today.get('calls', 0) | float(0) %}
              {% set failed = today.get('failed_calls', 0) | float(0) %}
              {% set rejected = today.get('quality_rejected_calls', 0) | float(0) %}
              **Hoje:** falhas técnicas **{{ format_number_ptbr((failed / calls * 100) if calls > 0 else 0, 1) }}%** ·
              descartes por qualidade **{{ format_number_ptbr((rejected / calls * 100) if calls > 0 else 0, 1) }}%** ·
              resultados não aproveitados **{{ format_number_ptbr(((failed + rejected) / calls * 100) if calls > 0 else 0, 1) }}%**.

              **Como ler:** cada barra é a média temporal das leituras de
              `failed / chamadas` dentro do dia UTC; o valor corrente de hoje
              aparece acima. O gráfico mostra somente erros técnicos.
              Rejeições do gate são descartes: não entram como falha técnica,
              mas entram em *resultados não aproveitados* e reduzem a
              **Redução útil** com economia zero, seguindo o teste A/B.

          - type: markdown
            title: RTX em uso — últimas 48 horas
            content: |-
              {% from 'formatting.jinja' import format_number_ptbr %}
              {% set local = state_attr('sensor.codex_usage_raw', 'local_ai') or {} %}
              {% set full_history = state_attr('sensor.codex_rtx_historico_48h_raw', 'jobs') %}
              {% set jobs = full_history if full_history is not none else local.get('latest_jobs', []) %}
              | Horário | Tarefa | Modelo | Resultado | Qualidade | Duração | Tokens úteis líquidos |
              |:--|:--|:--|:--|:--|--:|--:|
              {% for job in jobs %}
              {% set timestamp = as_timestamp(job.get('finished_at') or job.get('started_at'), none) %}
              | {{ timestamp | timestamp_custom('%d/%m %H:%M', true) if timestamp is number else '—' }} | `{{ job.get('task', '—') }}` | `{{ job.get('model', '—') }}` | {{ 'utilizado' if job.get('quality_accepted') == true else 'descartado' if job.get('status') == 'discarded' else job.get('status', '—') }} | {{ (format_number_ptbr(job.get('quality_score_percent')) ~ '%') if job.get('quality_score_percent') is number else '—' }} | {{ (format_number_ptbr(job.get('duration_seconds'), 1) ~ ' s') if job.get('duration_seconds') is number else '—' }} | {{ format_number_ptbr(job.get('useful_context_tokens_avoided', 0)) }} |
              {% else %}
              | — | Nenhuma inferência registrada nesta janela | — | — | — | — | 0 |
              {% endfor %}

              **Como ler:** *utilizado* passou pelo gate; *descartado* foi
              rejeitado por qualidade; *failed* é erro técnico; qualidade é a
              nota de fidelidade. Resultados descartados aparecem com **zero
              tokens úteis líquidos**. A tabela omite benchmarks e é atualizada
              a cada 30 segundos.

              {% if full_history is none %}
              _Exibindo temporariamente os jobs recentes do feed principal até a próxima recarga programada do Home Assistant._
              {% endif %}

