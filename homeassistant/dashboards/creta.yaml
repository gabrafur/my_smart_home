title: Creta
views:
  - title: Creta
    path: creta
    icon: mdi:car
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Visão geral
            icon: mdi:car-connected
          - type: markdown
            content: >-
              {% set engine = is_state('binary_sensor.creta_engine', 'on') %}
              {% set location = states('device_tracker.creta_location') %}
              {% set updated = states('sensor.creta_last_updated_at') %}
              {% set updated_ts = as_timestamp(updated, none) %}
              {% set age_min = ((as_timestamp(now()) - updated_ts) / 60) | round(0) if updated_ts else none %}

              # {{ 'Em uso' if engine else 'Estacionado' }}

              **Local:** {{ state_attr('device_tracker.creta_location', 'friendly_name') if location in ['unknown', 'unavailable'] else location | replace('_', ' ') | title }}

              {% if age_min is none %}
              🔴 **Sem telemetria válida** · aguardando dados do Bluelink.
              {% elif age_min <= 15 %}
              🟢 **Dados recentes** · atualizados há {{ age_min | int }} min.
              {% elif age_min <= 90 %}
              🟡 **Dados em cache** · última leitura há {{ age_min | int }} min.
              {% else %}
              🔴 **Dados antigos** · última leitura há {{ age_min | int }} min.
              {% endif %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.creta_fuel_level
                name: Combustível
                icon: mdi:gas-station
              - type: tile
                entity: sensor.garagem_creta_total_driving_range
                name: Autonomia
                icon: mdi:map-marker-distance
              - type: tile
                entity: sensor.garagem_creta_odometer
                name: Odômetro
                icon: mdi:speedometer
              - type: markdown
                content: >-
                  {% set entity = states.sensor.garagem_creta_estimated_fuel_efficiency %}
                  {% set value = entity.state if entity else 'unknown' %}
                  {% set start = entity.attributes.trip_window_start if entity else none %}
                  {% set end = entity.attributes.trip_window_end if entity else none %}
                  {% set trips = entity.attributes.trips_considered | default(0) if entity else 0 %}
                  **Consumo estimado**

                  {% if value not in ['unknown', 'unavailable', 'none'] %}
                  ## {{ value }} km/L

                  {% if start and end %}
                  {{ as_datetime(start).astimezone().strftime('%d/%m %H:%M') }}–{{ as_datetime(end).astimezone().strftime('%d/%m %H:%M') }} · {{ trips }} viagem(ns)
                  {% else %}
                  {{ trips }} viagem(ns) com amostras confiáveis
                  {% endif %}
                  {% else %}
                  ## Dados insuficientes

                  Janela pesquisada: hoje e ontem.
                  {% endif %}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: binary_sensor.creta_engine
                name: Motor
                icon: mdi:engine
              - type: tile
                entity: lock.creta_door_lock
                name: Travas
              - type: tile
                entity: binary_sensor.creta_fuel_low_level
                name: Reserva
                icon: mdi:fuel
          - type: heading
            heading: Atualização dos dados
            icon: mdi:cloud-sync
          - type: markdown
            content: >-
              {% set refresh = states.sensor.creta_refresh_coordinator %}
              {% set state = refresh.state if refresh else 'unavailable' %}
              {% set remaining = state_attr('sensor.creta_refresh_coordinator', 'remaining_seconds') | int(0) %}
              {% set attempt = state_attr('sensor.creta_refresh_coordinator', 'attempt') | int(0) %}
              {% set last_vehicle = states('sensor.creta_last_updated_at') %}
              {% set last_scan = states('sensor.creta_last_scanned_at') %}
              {% set reason = state_attr('sensor.creta_refresh_coordinator', 'reason') %}

              {% if state == 'refreshing' %}
              ## ↻ Consultando Bluelink
              Tentativa {{ attempt }} · {{ reason | default('atualização automática', true) | replace('_', ' ') }}
              {% elif state == 'backoff' %}
              ## 🟡 Aguardando nova tentativa
              Tentativa {{ attempt }} · em {{ remaining }} s
              {% elif state == 'cooldown' %}
              ## 🟢 Atualizado
              Próximo refresh em {{ (remaining / 60) | round(0, 'floor') | int }} min {{ remaining % 60 }} s
              {% elif state == 'waiting' %}
              ## ⚪ Aguardando movimento
              O próximo refresh será solicitado por movimento ou mudança de zona.
              {% elif state in ['unknown', 'unavailable'] %}
              ## 🔴 Coordenador indisponível
              Aguardando a telemetria do Node-RED.
              {% else %}
              ## ⚪ Pronto
              Próxima decisão automática em até 30 s.
              {% endif %}

              **Últimos dados:** {{ relative_time(as_datetime(last_vehicle)) if last_vehicle not in ['unknown', 'unavailable'] else 'sem leitura válida' }}<br>
              **Última consulta Bluelink:** {{ relative_time(as_datetime(last_scan)) if last_scan not in ['unknown', 'unavailable'] else 'sem leitura válida' }}
          - type: button
            entity: input_button.creta_force_refresh_now
            name: Forçar atualização agora
            icon: mdi:refresh
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.creta_force_refresh_now
            hold_action:
              action: none

      - type: grid
        cards:
          - type: heading
            heading: Localização
            icon: mdi:map-marker
          - type: map
            entities:
              - entity: device_tracker.creta_location
            hours_to_show: 12
            default_zoom: 15
          - type: entities
            show_header_toggle: false
            entities:
              - entity: device_tracker.creta_location
                name: Zona atual
              - entity: sensor.creta_location_last_updated
                name: Localização recebida em
              - entity: sensor.creta_last_updated_at
                name: Telemetria do veículo em
              - entity: sensor.creta_last_scanned_at
                name: Última consulta à nuvem

      - type: grid
        cards:
          - type: heading
            heading: Viagens recentes
            icon: mdi:map-marker-path
          - type: markdown
            content: >-
              {% set trips = state_attr('sensor.garagem_creta_recent_trip_info', 'trips') or [] %}
              {% set efficiency = state_attr('sensor.garagem_creta_recent_trip_info', 'fuel_efficiency') or {} %}
              {% if trips %}
              **{{ trips | length }} viagem(ns) nos últimos dois dias**

              {% if efficiency.km_per_l is defined and efficiency.km_per_l is not none %}
              ⛽ **{{ efficiency.km_per_l }} km/L estimados** em {{ efficiency.estimated_distance }} km analisados.
              {% else %}
              ⏳ **Consumo aguardando amostras confiáveis.** A estimativa só aparece quando combustível e odômetro cercam a mesma viagem.
              {% endif %}

              {% for trip in trips %}
              ---
              **{{ trip.date[6:8] }}/{{ trip.date[4:6] }} · {{ trip.start_time[:2] }}:{{ trip.start_time[2:4] }}{% if trip.end_time %}–{{ trip.end_time }}{% endif %}**

              {{ trip.distance }} km · {{ trip.duration_min }} min · média {{ trip.avg_speed }} km/h{% if trip.estimated_km_per_l is defined %} · **{{ trip.estimated_km_per_l }} km/L**{% endif %}
              {% endfor %}
              {% else %}
              **Nenhuma viagem disponível para hoje e ontem.**

              O histórico é consultado automaticamente ao iniciar a integração, quando o odômetro avança e ao concluir uma chegada. Não é necessário atualizar manualmente.
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Bateria 12 V e confiabilidade
            icon: mdi:car-battery
          - type: markdown
            content: >-
              {% set battery = states('sensor.creta_car_battery_level') %}
              {% if battery not in ['unknown', 'unavailable'] %}
              ## {{ battery }}%

              Leitura aceita como confiável pelo protocolo do veículo.
              {% else %}
              ## Aguardando leitura confiável

              O Bluelink enviou a medição com indicador de baixa confiabilidade. O painel mantém o valor como desconhecido para não apresentar o nível bruto como se fosse confirmado.
              {% endif %}
          - type: entities
            title: Estado de portas e alertas
            show_header_toggle: false
            entities:
              - entity: binary_sensor.creta_front_left_door
                name: Porta dianteira esquerda
              - entity: binary_sensor.creta_front_right_door
                name: Porta dianteira direita
              - entity: binary_sensor.creta_back_left_door
                name: Porta traseira esquerda
              - entity: binary_sensor.creta_back_right_door
                name: Porta traseira direita
              - entity: binary_sensor.creta_trunk
                name: Porta-malas
              - entity: binary_sensor.creta_tire_pressure_all
                name: Alerta de pneus

      - type: grid
        cards:
          - type: heading
            heading: Histórico
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Motor e combustível · 48 horas
            hours_to_show: 48
            entities:
              - entity: binary_sensor.creta_engine
                name: Motor
              - entity: sensor.creta_fuel_level
                name: Combustível
          - type: history-graph
            title: Consumo estimado · 7 dias
            hours_to_show: 168
            entities:
              - entity: sensor.garagem_creta_estimated_fuel_efficiency
                name: km/L estimados

      - type: grid
        cards:
          - type: heading
            heading: Diagnóstico
            icon: mdi:stethoscope
          - type: markdown
            content: >-
              **Atualização automática orientada a eventos**

              Mudanças de zona ou deslocamentos GPS significativos solicitam uma nova leitura. O coordenador evita chamadas simultâneas, aplica backoff de **1, 2, 4, 8 e 15 minutos** e nunca acorda o veículo mais de uma vez dentro de 15 minutos.

              A consulta ao cache pode avançar sem acordar o carro; o refresh só é considerado concluído quando um timestamp observado realmente muda.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.creta_last_updated_at
                name: Estado confirmado em
              - entity: sensor.creta_last_scanned_at
                name: Consulta executada em
              - entity: sensor.creta_location_last_updated
                name: Posição confirmada em
              - entity: sensor.garagem_creta_recent_trip_info
                name: Viagens carregadas
              - entity: sensor.garagem_creta_estimated_fuel_efficiency
                name: Base de consumo
              - entity: sensor.creta_refresh_coordinator
                name: Coordenador de refresh
              - entity: sensor.garagem_creta_remote_command_status
                name: Último comando remoto
              - entity: sensor.integracao_creta
                name: Manutenção da integração

      - type: grid
        cards:
          - type: heading
            heading: Comandos do veículo
            icon: mdi:car-key
          - type: markdown
            content: >-
              {% set command = states('sensor.garagem_creta_remote_command_status') %}
              {% if command == 'requesting' %}
              ## ↻ Localizando veículo...

              Aguardando confirmação do Bluelink.
              {% elif command == 'accepted' %}
              ## 🟢 Comando aceito pelo Bluelink

              Buzina e luzes acionadas por aproximadamente 30 segundos.
              {% elif command in ['failed', 'cooldown'] %}
              ## 🔴 Não foi possível acionar o veículo

              Consulte os detalhes do último comando antes de tentar novamente.
              {% else %}
              **Localizar veículo**

              O comando oficial aciona buzina e luzes por aproximadamente 30 segundos.
              {% endif %}
          - type: button
            entity: button.creta_start_hazard_lights_and_horn
            name: Localizar veículo · segure para acionar
            icon: mdi:car-emergency
            show_state: false
            tap_action:
              action: none
            hold_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.creta_start_hazard_lights_and_horn
              confirmation:
                text: Acionar a buzina e as luzes do Creta por aproximadamente 30 segundos?
