title: Creta
views:
  - title: Creta
    path: creta
    icon: mdi:car
    cards:
      - type: markdown
        content: >-
          ## 🚗 Creta

          Status atual do veículo e viagens registradas pelo Bluelink.

      - type: grid
        title: Resumo
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.creta_fuel_level
            name: Combustível
            icon: mdi:gas-station
          - type: tile
            entity: sensor.creta_fuel_driving_range
            name: Autonomia
            icon: mdi:map-marker-distance
          - type: tile
            entity: sensor.garagem_creta_odometer
            name: Odômetro
            icon: mdi:speedometer
          - type: tile
            entity: sensor.creta_car_battery_level
            name: Bateria 12V
            icon: mdi:car-battery

      - type: grid
        title: Estado atual
        columns: 3
        square: false
        cards:
          - type: tile
            entity: binary_sensor.creta_engine
            name: Motor
            icon: mdi:engine
          - type: tile
            entity: lock.creta_door_lock
            name: Travas
          - type: tile
            entity: device_tracker.creta_location
            name: Localização
            icon: mdi:map-marker-outline

      - type: markdown
        title: Viagens de hoje
        content: >
          {% set trips = state_attr('sensor.garagem_creta_day_trip_info',
          'trips') %}
          {% if trips %}
          {% set total = trips | sum(attribute='distance') %}
          **{{ trips | length }} viagem(ns) · {{ total }} km no total**

          {% for t in trips %}
          **{{ t.start_time[:2] }}:{{ t.start_time[2:4] }} · {{ t.distance }} km**<br>
          {{ t.drive_time_min }} min rodando · {{ t.idle_time_min }} min parado ·
          {{ t.avg_speed }} km/h em média · máxima de {{ t.max_speed }} km/h

          {% endfor %}
          {% else %}
          _Nenhuma viagem registrada hoje._ As viagens são atualizadas quando
          o Creta chega em casa ou pelo botão abaixo.
          {% endif %}

      - type: entities
        title: Atualização dos dados
        show_header_toggle: false
        entities:
          - entity: button.garagem_creta_refresh_trip_info
            name: Atualizar viagens de hoje
          - entity: button.creta_force_refresh
            name: Forçar atualização de status
          - entity: sensor.creta_last_updated_at
            name: Dados recebidos em
          - entity: sensor.creta_last_scanned_at
            name: Última consulta ao Bluelink

      - type: history-graph
        title: Histórico — motor e combustível (7 dias)
        hours_to_show: 168
        entities:
          - entity: binary_sensor.creta_engine
            name: Motor
          - entity: sensor.creta_fuel_level
            name: Combustível
