title: Creta
views:
  - title: Creta
    path: creta
    icon: mdi:car
    cards:
      - type: markdown
        content: >
          ## 🚗 Garagem ▸ Creta

          Status ao vivo (via endpoint CCS2) e histórico de viagens (fonte
          `/tripinfo`, a mesma do app Bluelink).

      - type: entities
        title: Status atual
        show_header_toggle: false
        entities:
          - entity: sensor.creta_fuel_level
            name: Combustível
          - entity: sensor.creta_fuel_driving_range
            name: Autonomia
          - entity: sensor.garagem_creta_odometer
            name: Odômetro
          - entity: sensor.creta_car_battery_level
            name: Bateria 12V
          - entity: binary_sensor.creta_engine
            name: Motor
          - entity: lock.creta_door_lock
            name: Travas
          - entity: device_tracker.creta_location
            name: Localização
          - entity: sensor.creta_last_updated_at
            name: Última atualização (dados)
          - entity: sensor.creta_last_scanned_at
            name: Último scan

      - type: markdown
        title: Viagens de hoje
        content: >
          {% set trips = state_attr('sensor.garagem_creta_day_trip_info',
          'trips') %}
          {% if trips %}
          | Início | Dist. | Rodando | Parado | Méd | Máx |
          |---|---|---|---|---|---|
          {% for t in trips %}| {{ t.start_time[:2] }}:{{ t.start_time[2:4] }} | {{ t.distance }} km | {{ t.drive_time_min }} min | {{ t.idle_time_min }} min | {{ t.avg_speed }} | {{ t.max_speed }} |
          {% endfor %}

          _Total: {{ trips | sum(attribute='distance') }} km em {{ trips | length }} viagem(ns)._
          {% else %}
          _Sem viagens registradas hoje ainda._ Atualiza a cada chegada do
          Creta em casa, ou pressione o botão abaixo.
          {% endif %}

      - type: entities
        show_header_toggle: false
        entities:
          - entity: button.garagem_creta_refresh_trip_info
            name: Atualizar viagens de hoje
          - entity: button.creta_force_refresh
            name: Forçar atualização de status

      - type: history-graph
        title: Histórico — motor e combustível (7 dias)
        hours_to_show: 168
        entities:
          - entity: binary_sensor.creta_engine
            name: Motor
          - entity: sensor.creta_fuel_level
            name: Combustível

      - type: markdown
        title: Histórico de viagens recuperado (28/07 – 01/08)
