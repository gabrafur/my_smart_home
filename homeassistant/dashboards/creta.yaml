title: Creta
views:
  - title: Creta
    path: creta
    icon: mdi:car
    cards:
      - type: markdown
        content: >-
          ## 🚗 Creta

          Status atual do veículo e viagens registradas pelo Bluelink.

      - type: grid
        title: Resumo
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.creta_fuel_level
            name: Combustível
            icon: mdi:gas-station
          - type: tile
            entity: sensor.creta_fuel_driving_range
            name: Autonomia
            icon: mdi:map-marker-distance
          - type: tile
            entity: sensor.garagem_creta_odometer
            name: Odômetro
            icon: mdi:speedometer
          - type: tile
            entity: sensor.creta_car_battery_level
            name: Bateria 12V
            icon: mdi:car-battery
          - type: tile
            entity: sensor.garagem_creta_estimated_fuel_efficiency
            name: Consumo estimado
            icon: mdi:gas-station

      - type: grid
        title: Estado atual
        columns: 3
        square: false
        cards:
          - type: tile
            entity: binary_sensor.creta_engine
            name: Motor
            icon: mdi:engine
          - type: tile
            entity: lock.creta_door_lock
            name: Travas
          - type: tile
            entity: device_tracker.creta_location
            name: Localização
            icon: mdi:map-marker-outline

      - type: markdown
        title: Bateria 12 V
        content: >
          {% set battery = states('sensor.creta_car_battery_level') %}
          {% if battery not in ['unknown', 'unavailable'] %}
          **{{ battery }}%** · leitura fornecida pelo Bluelink.
          {% else %}
          **Leitura indisponível** · o Bluelink marcou a medição da bateria 12 V
          como não confiável. O valor bruto não é exibido para não mascarar a
          indisponibilidade; atualize o estado do carro após ele acordar.
          {% endif %}

      - type: markdown
        title: Viagens recentes — hoje e ontem
        content: >
          {% set trips = state_attr('sensor.garagem_creta_recent_trip_info',
          'trips') %}
          {% if trips %}
          {% set total = trips | sum(attribute='distance') %}
          **{{ trips | length }} viagem(ns) · {{ total }} km no total nos últimos 2 dias**
          {% set efficiency = state_attr('sensor.garagem_creta_recent_trip_info', 'fuel_efficiency') %}
          {% if efficiency and efficiency.km_per_l is not none %}
          **Consumo médio estimado: {{ efficiency.km_per_l }} km/L** · {{ efficiency.estimated_distance }} km com {{ efficiency.estimated_liters }} L estimados.
          {% else %}
          _Consumo médio: aguardando leituras de combustível e odômetro que cerquem uma viagem._
          {% endif %}

          {% for t in trips %}
          **{{ t.date[6:8] }}/{{ t.date[4:6] }} · {{ t.start_time[:2] }}:{{ t.start_time[2:4] }}{% if t.end_time %}–{{ t.end_time }}{% endif %} · {{ t.distance }} km**<br>
          {{ t.duration_min }} min no total · {{ t.drive_time_min }} min rodando · {{ t.idle_time_min }} min parado ·
          {{ t.avg_speed }} km/h em média · máxima de {{ t.max_speed }} km/h
          {% if t.estimated_km_per_l is defined %}<br>**Consumo estimado: {{ t.estimated_km_per_l }} km/L** ({{ t.estimated_liters }} L estimados){% endif %}

          {% endfor %}
          {% else %}
          _Nenhuma viagem registrada nos últimos 2 dias._ As viagens são atualizadas quando
          o Creta chega em casa ou pelo botão abaixo.
          {% endif %}

      - type: entities
        title: Atualização dos dados
        show_header_toggle: false
        entities:
          - entity: button.garagem_creta_refresh_trip_info
            name: Atualizar viagens manualmente
          - entity: button.creta_force_refresh
            name: Forçar atualização de status
          - entity: sensor.creta_last_updated_at
            name: Dados recebidos em
          - entity: sensor.creta_last_scanned_at
            name: Última consulta ao Bluelink

      - type: history-graph
        title: Histórico — motor e combustível (2 dias)
        hours_to_show: 48
        entities:
          - entity: binary_sensor.creta_engine
            name: Motor
          - entity: sensor.creta_fuel_level
            name: Combustível

      - type: history-graph
        title: Consumo estimado por atualização
        hours_to_show: 48
        entities:
          - entity: sensor.garagem_creta_estimated_fuel_efficiency
            name: Consumo estimado (km/L)
