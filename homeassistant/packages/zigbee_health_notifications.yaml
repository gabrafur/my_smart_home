# Alertas globais da rede Zigbee. A notificacao persistente aparece para todos
# os usuarios do Home Assistant; os aplicativos cadastrados abaixo tambem
# recebem push. Os topicos com curinga incluem automaticamente novos
# dispositivos Z2M. Requer `availability.enabled: true` e o base topic padrao
# `zigbee2mqtt` no configuration.yaml privado do Zigbee2MQTT.

automation:
  - id: zigbee_network_failure_notification
    alias: Zigbee - falha da rede
    description: Alerta quando a rede cai e informa quando a mesma falha termina.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
        to: "off"
        for:
          seconds: 30
      - trigger: state
        entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
        to: "unavailable"
        for:
          seconds: 30
      - trigger: homeassistant
        event: start
    actions:
      - delay:
          seconds: "{{ 30 if trigger.platform == 'homeassistant' else 0 }}"
      - condition: template
        value_template: >-
          {{ states('binary_sensor.zigbee2mqtt_bridge_connection_state')
             in ['off', 'unavailable', 'unknown'] }}
      - variables:
          message: >-
            A rede Zigbee esta indisponivel. O Zigbee2MQTT perdeu a conexao com
            a antena/coordenador ou parou de funcionar. Os dispositivos Zigbee
            podem nao responder. Verifique a energia e o endereco do coordenador
            configurado em serial.port. Detectado em
            {{ now().strftime('%d/%m/%Y %H:%M:%S') }}.
      - action: persistent_notification.create
        data:
          title: "Falha na rede Zigbee"
          message: "{{ message }}"
          notification_id: zigbee_network_failure
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id:
            - notify.iphone_de_gabriel_furlan
            - notify.iphone_de_valeria
        data:
          title: "Falha na rede Zigbee"
          message: "{{ message }}"
      # A recuperacao fica vinculada a esta execucao. Assim, o estado `on`
      # restaurado no startup nao produz uma falsa notificacao de recuperacao.
      - repeat:
          sequence:
            - wait_template: >-
                {{ is_state('binary_sensor.zigbee2mqtt_bridge_connection_state',
                            'on') }}
            - delay:
                minutes: 1
          until:
            - condition: state
              entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state
              state: "on"
      - action: persistent_notification.dismiss
        data:
          notification_id: zigbee_network_failure
      - variables:
          recovery_message: >-
            A rede Zigbee voltou a funcionar e permaneceu conectada por 1 minuto.
            Recuperada em {{ now().strftime('%d/%m/%Y %H:%M:%S') }}.
      - action: persistent_notification.create
        data:
          title: "Rede Zigbee recuperada"
          message: "{{ recovery_message }}"
          notification_id: zigbee_network_recovered
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id:
            - notify.iphone_de_gabriel_furlan
            - notify.iphone_de_valeria
        data:
          title: "Rede Zigbee recuperada"
          message: "{{ recovery_message }}"

  - id: zigbee_component_failure_notification
    alias: Zigbee - componente indisponivel
    description: Alerta quando um dispositivo fica offline e quando ele volta.
    mode: parallel
    max: 100
    max_exceeded: silent
    triggers:
      - trigger: mqtt
        # `#` tambem cobre friendly names hierarquicos, como cozinha/lampada.
        # A condicao abaixo restringe os demais topicos do mesmo base topic.
        topic: zigbee2mqtt/#
        payload: "offline"
        value_template: "{{ value_json.state | default(value) }}"
    actions:
      - condition: template
        value_template: "{{ trigger.topic[-13:] == '/availability' }}"
      - variables:
          availability_topic: "{{ trigger.topic }}"
          # Friendly names podem conter `/`; retire apenas o prefixo e sufixo.
          component: "{{ trigger.topic.split('/')[1:-1] | join('/') }}"
          notification_key: "{{ component | slugify }}"
          message: >-
            O componente Zigbee "{{ component }}" ficou indisponivel em
            {{ now().strftime('%d/%m/%Y %H:%M:%S') }}. Verifique alimentacao,
            alcance, bateria e a malha Zigbee.
      - action: persistent_notification.create
        data:
          title: "Componente Zigbee indisponivel"
          message: "{{ message }}"
          notification_id: "zigbee_component_{{ notification_key }}"
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id:
            - notify.iphone_de_gabriel_furlan
            - notify.iphone_de_valeria
        data:
          title: "Componente Zigbee indisponivel"
          message: "{{ message }}"
      # O Zigbee2MQTT publica disponibilidade como retained. Esperar o `online`
      # dentro da execucao iniciada por `offline` evita recuperacoes falsas ao
      # recarregar as automacoes enquanto o dispositivo ja esta online.
      - wait_for_trigger:
          - trigger: mqtt
            topic: "{{ availability_topic }}"
            payload: "online"
            value_template: "{{ value_json.state | default(value) }}"
      - variables:
          recovery_message: >-
            O componente Zigbee "{{ component }}" voltou a ficar disponivel em
            {{ now().strftime('%d/%m/%Y %H:%M:%S') }}.
      - action: persistent_notification.dismiss
        data:
          notification_id: "zigbee_component_{{ notification_key }}"
      - action: persistent_notification.create
        data:
          title: "Componente Zigbee recuperado"
          message: "{{ recovery_message }}"
          notification_id: "zigbee_component_recovered_{{ notification_key }}"
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id:
            - notify.iphone_de_gabriel_furlan
            - notify.iphone_de_valeria
        data:
          title: "Componente Zigbee recuperado"
          message: "{{ recovery_message }}"
