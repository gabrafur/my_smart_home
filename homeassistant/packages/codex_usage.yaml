        state: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('totals') or {}).get('context_reduction_percent') }}"
        availability: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('totals') or {}).get('context_reduction_percent') is number }}"

      - name: Codex Reducao de Contexto Local AI Hoje
        unique_id: codex_reducao_de_contexto_local_ai_hoje
        icon: mdi:calendar-today
        unit_of_measurement: "%"
