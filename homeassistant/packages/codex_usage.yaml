input_boolean:
  codex_alertas_iphone:
    name: Alertas Codex no dispositivo de mobile_primary
    icon: mdi:cellphone-message
  codex_resumo_diario_iphone:
    name: Resumo diário do Codex
    icon: mdi:calendar-text

input_number:
  codex_alerta_aviso_percentual:
    name: Codex - aviso de uso
    icon: mdi:alert-outline
    min: 10
    max: 95
    step: 5
    unit_of_measurement: "%"
    mode: slider
  codex_alerta_critico_percentual:
    name: Codex - uso crítico
    icon: mdi:alert-octagon-outline
    min: 20
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
  codex_alerta_cache_minimo:
    name: Codex - eficiência mínima de cache
    icon: mdi:cached
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
  codex_alerta_saldo_creditos:
    name: Codex - saldo baixo de créditos
    icon: mdi:wallet-outline
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "créditos"
    mode: box

input_text:
  codex_ultimo_alerta_iphone:
    name: Codex - último alerta enviado
    icon: mdi:message-badge-outline
    max: 255

input_datetime:
  codex_ultimo_alerta_iphone_em:
    name: Codex - horário do último alerta
    icon: mdi:clock-check-outline
    has_date: true
    has_time: true

script:
  codex_atualizar_uso_agora:
    alias: Codex - atualizar uso agora
    mode: single
    sequence:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.codex_usage_raw
