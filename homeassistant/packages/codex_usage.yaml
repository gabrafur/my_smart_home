command_line:
  - sensor:
      name: Codex RTX Live Raw
      unique_id: codex_rtx_live_raw
      command: "python3 /config/tools/codex_rtx_live.py"
      command_timeout: 2
      scan_interval: 1
      value_template: "{{ value_json.state }}"
      json_attributes:
        - task
        - model
        - started_at
        - sampled_at
        - gpu_util_percent
        - vram_mib
        - vram_total_mib
        - power_watts
        - gpu
        - preflight_checked_at
        - preflight_age_seconds
        - preflight_current
        - active_chats
        - error
  - sensor:
      name: Codex Usage Raw
      unique_id: codex_usage_raw
      command: "python3 /config/tools/codex_usage.py"
      # The bridge normally answers from its incremental index in well under
      # two seconds. Allow a longer first read after a bridge restart, when it
      # must index the local session history once.
      command_timeout: 10
      # The bridge itself caches for one second. Two-second polling keeps the
      # panel close to real time without putting load on the Codex CLI.
      scan_interval: 2
      value_template: "{{ value_json.status }}"
      json_attributes:
        - collected_at
        - source_updated_at
        - rate_limit_updated_at
        - plan_type
        - rate_limit
        - freshness
        - totals
        - daily
        - analytics
        - local_ai
        - error

template:
  - sensor:
      - name: Codex RTX Ultima Atualizacao
        unique_id: codex_rtx_ultima_atualizacao
        device_class: timestamp
        state: "{{ states.sensor.codex_rtx_live_raw.last_updated.isoformat() }}"
        availability: >-
          {{ states('sensor.codex_rtx_live_raw') not in ['unknown', 'unavailable'] }}
        attributes:
          amostra_da_rtx: "{{ state_attr('sensor.codex_rtx_live_raw', 'sampled_at') }}"

      - name: Codex RTX ao Vivo
        unique_id: codex_rtx_ao_vivo
        icon: >-
          {% if this.state == 'em uso' %}mdi:memory
          {% elif this.state == 'disponível' %}mdi:memory
          {% elif this.state == 'desatualizado' %}mdi:clock-alert-outline
          {% else %}mdi:memory-off
          {% endif %}
        state: >-
          {% set live = states('sensor.codex_rtx_live_raw') %}
          {% if live == 'in_use' %}em uso
          {% elif live == 'available' %}disponível
          {% elif live == 'stale' %}desatualizado
          {% elif live == 'error' %}sem sinal
          {% else %}indisponível
          {% endif %}
        attributes:
          tarefa: "{{ state_attr('sensor.codex_rtx_live_raw', 'task') }}"
          modelo: "{{ state_attr('sensor.codex_rtx_live_raw', 'model') }}"
          amostrado_em: "{{ state_attr('sensor.codex_rtx_live_raw', 'sampled_at') }}"
          preflight_em: "{{ state_attr('sensor.codex_rtx_live_raw', 'preflight_checked_at') }}"
          idade_preflight_segundos: "{{ state_attr('sensor.codex_rtx_live_raw', 'preflight_age_seconds') }}"
          chats_ativos: "{{ state_attr('sensor.codex_rtx_live_raw', 'active_chats') or [] }}"

      - name: Codex RTX GPU Agora
        unique_id: codex_rtx_gpu_agora
        icon: mdi:chip
        state: >-
          {% set state = states('sensor.codex_rtx_live_raw') %}
          {% set value = state_attr('sensor.codex_rtx_live_raw', 'gpu_util_percent') %}
          {% if state == 'in_use' and value is number %}{{ value }}%{% elif state == 'available' %}ociosa{% else %}sem sinal{% endif %}
        availability: "{{ states('sensor.codex_rtx_live_raw') in ['in_use', 'available'] }}"
        attributes:
          amostra_ativa: "{{ states('sensor.codex_rtx_live_raw') == 'in_use' }}"
          percentual: "{{ state_attr('sensor.codex_rtx_live_raw', 'gpu_util_percent') }}"

      - name: Codex RTX VRAM Agora
        unique_id: codex_rtx_vram_agora
        icon: mdi:memory
        state: >-
          {% set state = states('sensor.codex_rtx_live_raw') %}
          {% set value = state_attr('sensor.codex_rtx_live_raw', 'vram_mib') %}
          {% if state == 'in_use' and value is number %}{{ value }} MiB{% elif state == 'available' %}ociosa{% else %}sem sinal{% endif %}
        availability: "{{ states('sensor.codex_rtx_live_raw') in ['in_use', 'available'] }}"
        attributes:
          amostra_ativa: "{{ states('sensor.codex_rtx_live_raw') == 'in_use' }}"
          mib: "{{ state_attr('sensor.codex_rtx_live_raw', 'vram_mib') }}"

      - name: Codex RTX Potencia Agora
        unique_id: codex_rtx_potencia_agora
        icon: mdi:lightning-bolt
        state: >-
          {% set state = states('sensor.codex_rtx_live_raw') %}
          {% set value = state_attr('sensor.codex_rtx_live_raw', 'power_watts') %}
          {% if state == 'in_use' and value is number %}{{ value }} W{% elif state == 'available' %}ociosa{% else %}sem sinal{% endif %}
        availability: "{{ states('sensor.codex_rtx_live_raw') in ['in_use', 'available'] }}"
        attributes:
          amostra_ativa: "{{ states('sensor.codex_rtx_live_raw') == 'in_use' }}"
          watts: "{{ state_attr('sensor.codex_rtx_live_raw', 'power_watts') }}"

      - name: Codex Limite Usado
        unique_id: codex_limite_usado
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set limit = state_attr('sensor.codex_usage_raw', 'rate_limit') %}
          {{ limit.get('used_percent') if limit else none }}
        availability: >-
          {% set limit = state_attr('sensor.codex_usage_raw', 'rate_limit') %}
          {{ limit and limit.get('used_percent') is number }}
        attributes:
          leitura_atual: "{{ ((state_attr('sensor.codex_usage_raw', 'freshness') or {}).get('rate_limit', {}) or {}).get('current', false) }}"

      - name: Codex Limite Disponivel
        unique_id: codex_limite_disponivel
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set limit = state_attr('sensor.codex_usage_raw', 'rate_limit') %}
          {{ limit.get('remaining_percent') if limit else none }}
        availability: >-
          {% set limit = state_attr('sensor.codex_usage_raw', 'rate_limit') %}
          {{ limit and limit.get('remaining_percent') is number }}
        attributes:
          leitura_atual: "{{ ((state_attr('sensor.codex_usage_raw', 'freshness') or {}).get('rate_limit', {}) or {}).get('current', false) }}"

      - name: Codex Dados de Limite
        unique_id: codex_dados_de_limite
        icon: >-
          {% if this.state == 'atual' %}mdi:check-circle-outline
          {% elif this.state == 'desatualizado' %}mdi:clock-alert-outline
          {% else %}mdi:database-off-outline
          {% endif %}
        state: >-
          {% set freshness = state_attr('sensor.codex_usage_raw', 'freshness') or {} %}
          {% if states('sensor.codex_usage_raw') != 'ok' %}sem dados
          {% elif freshness.get('rate_limit', {}).get('current', false) %}atual
          {% else %}desatualizado
          {% endif %}
        attributes:
          ultimo_evento: "{{ state_attr('sensor.codex_usage_raw', 'rate_limit_updated_at') }}"
          idade_segundos: "{{ ((state_attr('sensor.codex_usage_raw', 'freshness') or {}).get('rate_limit', {}) or {}).get('age_seconds') }}"
          validade_segundos: "{{ ((state_attr('sensor.codex_usage_raw', 'freshness') or {}).get('rate_limit', {}) or {}).get('max_age_seconds') }}"

      - name: Codex Creditos Extras
        unique_id: codex_creditos_extras
        icon: mdi:wallet-outline
        unit_of_measurement: "créditos"
        state_class: measurement
        state: >-
          {% set limit = state_attr('sensor.codex_usage_raw', 'rate_limit') %}
          {% set credits = limit.get('credits', {}) if limit else {} %}
          {{ credits.get('balance', 0) | float(0) }}
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"
        attributes:
          possui_creditos: >-
            {% set limit = state_attr('sensor.codex_usage_raw', 'rate_limit') %}
            {{ limit.get('credits', {}).get('has_credits', false) if limit else false }}
          ilimitado: >-
            {% set limit = state_attr('sensor.codex_usage_raw', 'rate_limit') %}
            {{ limit.get('credits', {}).get('unlimited', false) if limit else false }}

      - name: Codex Tokens Totais
        unique_id: codex_tokens_totais
        icon: mdi:counter
        state_class: total_increasing
        state: >-
          {% set totals = state_attr('sensor.codex_usage_raw', 'totals') %}
          {{ totals.get('total_tokens') if totals else none }}
        availability: >-
          {% set totals = state_attr('sensor.codex_usage_raw', 'totals') %}
          {{ totals and totals.get('total_tokens') is number }}

      - name: Codex Tokens em Cache
        unique_id: codex_tokens_em_cache
        icon: mdi:cached
        state_class: total_increasing
        state: >-
          {% set totals = state_attr('sensor.codex_usage_raw', 'totals') %}
          {{ totals.get('cached_input_tokens') if totals else none }}
        availability: >-
          {% set totals = state_attr('sensor.codex_usage_raw', 'totals') %}
          {{ totals and totals.get('cached_input_tokens') is number }}

      - name: Codex Tokens de Saida
        unique_id: codex_tokens_de_saida
        icon: mdi:arrow-up-bold-hexagon-outline
        state_class: total_increasing
        state: >-
          {% set totals = state_attr('sensor.codex_usage_raw', 'totals') %}
          {{ totals.get('output_tokens') if totals else none }}
        availability: >-
          {% set totals = state_attr('sensor.codex_usage_raw', 'totals') %}
          {{ totals and totals.get('output_tokens') is number }}

      - name: Codex Sessoes Monitoradas
        unique_id: codex_sessoes_monitoradas
        icon: mdi:folder-multiple-outline
        state: >-
          {% set totals = state_attr('sensor.codex_usage_raw', 'totals') %}
          {{ totals.get('sessions') if totals else none }}
        availability: >-
          {% set totals = state_attr('sensor.codex_usage_raw', 'totals') %}
          {{ totals and totals.get('sessions') is number }}

      - name: Codex Plano
        unique_id: codex_plano
        icon: mdi:account-star-outline
        state: "{{ state_attr('sensor.codex_usage_raw', 'plan_type') or 'desconhecido' }}"
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"

      - name: Codex Proximo Reset
        unique_id: codex_proximo_reset
        icon: mdi:calendar-refresh-outline
        device_class: timestamp
        state: >-
          {% set limit = state_attr('sensor.codex_usage_raw', 'rate_limit') %}
          {{ limit.get('resets_at') if limit else none }}
        availability: >-
          {% set limit = state_attr('sensor.codex_usage_raw', 'rate_limit') %}
          {{ limit and limit.get('resets_at') not in [none, ''] }}

      - name: Codex Ultima Metrica
        unique_id: codex_ultima_metrica
        icon: mdi:clock-check-outline
        device_class: timestamp
        state: "{{ state_attr('sensor.codex_usage_raw', 'source_updated_at') }}"
        availability: >-
          {{ state_attr('sensor.codex_usage_raw', 'source_updated_at') not in [none, ''] }}

      - name: Codex Ultima Atualizacao do Limite
        unique_id: codex_ultima_atualizacao_do_limite
        icon: mdi:clock-alert-outline
        device_class: timestamp
        state: "{{ state_attr('sensor.codex_usage_raw', 'rate_limit_updated_at') }}"
        availability: >-
          {{ state_attr('sensor.codex_usage_raw', 'rate_limit_updated_at') not in [none, ''] }}

      - name: Codex Eficiencia de Cache
        unique_id: codex_eficiencia_de_cache
        icon: mdi:cached
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {{ analytics.get('cache_hit_percent') if analytics else none }}
        availability: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {{ analytics and analytics.get('cache_hit_percent') is number }}
        attributes:
          classificacao: >-
            {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
            {{ analytics.get('cache_efficiency', 'sem_dados') if analytics else 'sem_dados' }}

      - name: Codex Velocidade 7 Dias
        unique_id: codex_velocidade_7_dias
        icon: mdi:speedometer
        unit_of_measurement: "tokens/h"
        state_class: measurement
        state: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {{ analytics.get('tokens_per_hour_7d') if analytics else none }}
        availability: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {{ analytics and analytics.get('tokens_per_hour_7d') is number }}

      - name: Codex Ritmo do Limite
        unique_id: codex_ritmo_do_limite
        icon: mdi:chart-timeline-variant-shimmer
        unit_of_measurement: "%/dia"
        state_class: measurement
        state: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {% set forecast = analytics.get('forecast', {}) if analytics else {} %}
          {{ forecast.get('percent_per_day') }}
        availability: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {% set forecast = analytics.get('forecast', {}) if analytics else {} %}
          {{ forecast.get('percent_per_day') is number }}

      - name: Codex Uso Projetado no Reset
        unique_id: codex_uso_projetado_no_reset
        icon: mdi:chart-areaspline
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {% set forecast = analytics.get('forecast', {}) if analytics else {} %}
          {{ forecast.get('projected_used_at_reset') }}
        availability: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {% set forecast = analytics.get('forecast', {}) if analytics else {} %}
          {{ forecast.get('projected_used_at_reset') is number }}

      - name: Codex Folga Projetada no Reset
        unique_id: codex_folga_projetada_no_reset
        icon: mdi:battery-clock-outline
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {% set forecast = analytics.get('forecast', {}) if analytics else {} %}
          {{ forecast.get('projected_remaining_at_reset') }}
        availability: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {% set forecast = analytics.get('forecast', {}) if analytics else {} %}
          {{ forecast.get('projected_remaining_at_reset') is number }}

      - name: Codex Previsao Ate o Reset
        unique_id: codex_previsao_ate_o_reset
        icon: mdi:calendar-clock
        state: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {% set forecast = analytics.get('forecast', {}) if analytics else {} %}
          {% set labels = {
            'aguenta': 'aguenta',
            'atencao': 'atenção',
            'risco': 'não aguenta',
            'insuficiente': 'dados insuficientes'
          } %}
          {{ labels.get(forecast.get('status'), 'dados insuficientes') }}
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"
        attributes:
          confianca: >-
            {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
            {{ analytics.get('forecast', {}).get('confidence', 'baixa') if analytics else 'baixa' }}

      - name: Codex Esgotamento Estimado
        unique_id: codex_esgotamento_estimado
        device_class: timestamp
        state: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {{ analytics.get('forecast', {}).get('estimated_exhaust_at') if analytics else none }}
        availability: >-
          {% set analytics = state_attr('sensor.codex_usage_raw', 'analytics') %}
          {{ analytics and analytics.get('forecast', {}).get('estimated_exhaust_at') not in [none, ''] }}

      - name: Codex Nivel de Alerta
        unique_id: codex_nivel_de_alerta
        icon: >-
          {% if this.state == 'crítico' %}mdi:alert-octagon
          {% elif this.state == 'atenção' %}mdi:alert
          {% else %}mdi:shield-check
          {% endif %}
        state: >-
          {% set usado = states('sensor.codex_limite_usado') | float(0) %}
          {% set cache = states('sensor.codex_eficiencia_de_cache') | float(100) %}
          {% set previsao = states('sensor.codex_previsao_ate_o_reset') %}
          {% if previsao == 'não aguenta' or usado >= states('input_number.codex_alerta_critico_percentual') | float(90) %}
            crítico
          {% elif previsao == 'atenção'
              or usado >= states('input_number.codex_alerta_aviso_percentual') | float(70)
              or cache < states('input_number.codex_alerta_cache_minimo') | float(60) %}
            atenção
          {% else %}
            normal
          {% endif %}

      - name: Codex Local AI Status
        unique_id: codex_local_ai_status
        icon: mdi:robot-outline
        state: >-
          {% set local = state_attr('sensor.codex_usage_raw', 'local_ai') or {} %}
          {% set labels = {
            'LOCAL_AI_AVAILABLE': 'disponível',
            'LOCAL_AI_DEGRADED': 'degradado',
            'LOCAL_AI_IN_USE': 'em uso',
            'LOCAL_AI_UNAVAILABLE': 'indisponível',
            'LOCAL_AI_DISABLED': 'desativado'
          } %}
          {{ labels.get(local.get('state'), 'aguardando preflight') }}
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"
        attributes:
          estado_tecnico: "{{ (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('state') }}"
          endpoint: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('preflight') or {}).get('endpoint') }}"
          verificado_em: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('preflight') or {}).get('checked_at') }}"

      - name: Codex RTX 4070
        unique_id: codex_rtx_4070
        icon: mdi:expansion-card-variant
        state: >-
          {% set local = state_attr('sensor.codex_usage_raw', 'local_ai') or {} %}
          {% if local.get('state') == 'LOCAL_AI_IN_USE' %}
            em uso pelo Codex
          {% elif local.get('available') and ((local.get('preflight') or {}).get('gpu')) %}
            disponível
          {% else %}
            indisponível
          {% endif %}
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"
        attributes:
          gpu: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('preflight') or {}).get('gpu') }}"
          vram_livre_mib: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('preflight') or {}).get('vram_free_mib') }}"
          vram_total_mib: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('preflight') or {}).get('vram_total_mib') }}"

      - name: Codex Ollama Local
        unique_id: codex_ollama_local
        icon: mdi:server-network
        state: >-
          {% set preflight = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('preflight') or {}) %}
          {{ 'online' if preflight.get('ollama') else 'offline' }}
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"

      - name: Codex Modelo Local
        unique_id: codex_modelo_local
        icon: mdi:brain
        state: >-
          {{ (((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('preflight') or {}).get('model')) or 'não configurado' }}
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"

      - name: Codex Chamadas Local AI
        unique_id: codex_chamadas_local_ai
        icon: mdi:counter
        state_class: total_increasing
        state: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('totals') or {}).get('calls', 0) }}"
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"

      - name: Codex Chamadas Local AI Hoje
        unique_id: codex_chamadas_local_ai_hoje
        icon: mdi:calendar-today
        state: "{{ (((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('periods') or {}).get('today') or {}).get('calls', 0) }}"
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"

      - name: Codex Chamadas Local AI com Sucesso
        unique_id: codex_chamadas_local_ai_com_sucesso
        icon: mdi:check-circle-outline
        state_class: total_increasing
        state: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('totals') or {}).get('successful_calls', 0) }}"
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"

      - name: Codex Falhas Local AI
        unique_id: codex_falhas_local_ai
        icon: mdi:alert-circle-outline
        state_class: total_increasing
        state: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('totals') or {}).get('failed_calls', 0) }}"
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"

      - name: Codex Taxa de Falhas Local AI
        unique_id: codex_taxa_de_falhas_local_ai
        icon: mdi:chart-line-variant
        unit_of_measurement: "%"
        state_class: measurement
        state: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('totals') or {}).get('failure_rate_percent') }}"
        availability: "{{ ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('totals') or {}).get('failure_rate_percent') is number }}"

      - name: Codex Taxa de Falhas Qwen 2.5 Coder 7B
        unique_id: codex_taxa_de_falhas_qwen_2_5_coder_7b
        icon: mdi:chart-line-variant
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set models = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('models') or []) %}
          {% set match = models | selectattr('model', 'eq', 'qwen2.5-coder:7b') | list %}
          {{ match[0].get('failure_rate_percent') if match else none }}
        availability: >-
          {% set models = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('models') or []) %}
          {% set match = models | selectattr('model', 'eq', 'qwen2.5-coder:7b') | list %}
          {{ match and match[0].get('failure_rate_percent') is number }}

      - name: Codex Taxa de Falhas Qwen 3 8B
        unique_id: codex_taxa_de_falhas_qwen_3_8b
        icon: mdi:chart-line-variant
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set models = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('models') or []) %}
          {% set match = models | selectattr('model', 'eq', 'qwen3:8b') | list %}
          {{ match[0].get('failure_rate_percent') if match else none }}
        availability: >-
          {% set models = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('models') or []) %}
          {% set match = models | selectattr('model', 'eq', 'qwen3:8b') | list %}
          {{ match and match[0].get('failure_rate_percent') is number }}

      - name: Codex Taxa de Falhas Qwen 2.5 Coder 1.5B
        unique_id: codex_taxa_de_falhas_qwen_2_5_coder_1_5b
        icon: mdi:chart-line-variant
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set models = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('models') or []) %}
          {% set match = models | selectattr('model', 'eq', 'qwen2.5-coder:1.5b-base') | list %}
          {{ match[0].get('failure_rate_percent') if match else none }}
        availability: >-
          {% set models = ((state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('models') or []) %}
