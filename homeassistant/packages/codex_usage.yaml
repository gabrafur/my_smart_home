      - name: Codex Ultimo Job Local AI
        unique_id: codex_ultimo_job_local_ai
        icon: >-
          {{ 'mdi:progress-clock' if is_state('sensor.codex_rtx_ao_vivo', 'em uso') else 'mdi:history' }}
        state: >-
          {% if is_state('sensor.codex_rtx_ao_vivo', 'em uso') %}
            em andamento
          {% else %}
          {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
          {{ jobs[0].get('status') if jobs else 'sem uso registrado' }}
          {% endif %}
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"
        attributes:
          tarefa: >-
            {% if is_state('sensor.codex_rtx_ao_vivo', 'em uso') %}
              {{ state_attr('sensor.codex_rtx_ao_vivo', 'tarefa') }}
            {% else %}
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('task') if jobs else none }}
            {% endif %}
          modelo: >-
            {% if is_state('sensor.codex_rtx_ao_vivo', 'em uso') %}
              {{ state_attr('sensor.codex_rtx_ao_vivo', 'modelo') }}
            {% else %}
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('model') if jobs else none }}
            {% endif %}
          iniciado_em: >-
            {{ state_attr('sensor.codex_rtx_live_raw', 'started_at') if is_state('sensor.codex_rtx_ao_vivo', 'em uso') else none }}
          duracao_s: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('duration_seconds') if jobs else none }}
          tokens_por_segundo: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('tokens_per_second') if jobs else none }}
          tentativas_locais: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('local_attempts') if jobs else none }}
          pico_gpu_percentual: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('gpu_peak_percent') if jobs else none }}
          pico_vram_mib: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('vram_peak_mib') if jobs else none }}
          tokens_openai_evitados_estimados: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('openai_context_tokens_avoided') if jobs else none }}
          tokens_contexto_entrada: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('context_input_tokens') if jobs else none }}
          tokens_contexto_saida: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('context_output_tokens') if jobs else none }}
          overhead_tokens: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('context_overhead_tokens') if jobs else none }}
          metodo_overhead: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('context_overhead_method') if jobs else none }}
          metodo_contagem_tokens: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('token_count_method') if jobs else none }}
          reducao_contexto_percentual: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('context_reduction_percent') if jobs else none }}
          erro_tipo: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('error_type') if jobs else none }}
          processador: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {{ jobs[0].get('processor') if jobs else none }}

      - name: Codex Ultima Falha Local AI
        unique_id: codex_ultima_falha_local_ai
        icon: mdi:alert-circle-outline
        state: >-
          {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
          {% set failures = jobs | selectattr('status', 'eq', 'failed') | list %}
          {{ failures[0].get('error_type') if failures else 'sem falhas recentes' }}
        availability: "{{ states('sensor.codex_usage_raw') == 'ok' }}"
        attributes:
          tarefa: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {% set failures = jobs | selectattr('status', 'eq', 'failed') | list %}
            {{ failures[0].get('task') if failures else none }}
          modelo: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {% set failures = jobs | selectattr('status', 'eq', 'failed') | list %}
            {{ failures[0].get('model') if failures else none }}
          finalizado_em: >-
            {% set jobs = (state_attr('sensor.codex_usage_raw', 'local_ai') or {}).get('latest_jobs') or [] %}
            {% set failures = jobs | selectattr('status', 'eq', 'failed') | list %}
            {{ failures[0].get('finished_at') if failures else none }}

input_boolean:
  codex_alertas_iphone:
    name: Alertas Codex no dispositivo de mobile_primary
    icon: mdi:cellphone-message
  codex_resumo_diario_iphone:
    name: Resumo diário do Codex
    icon: mdi:calendar-text

input_number:
  codex_alerta_aviso_percentual:
    name: Codex - aviso de uso
    icon: mdi:alert-outline
    min: 10
    max: 95
    step: 5
    unit_of_measurement: "%"
    mode: slider
  codex_alerta_critico_percentual:
    name: Codex - uso crítico
    icon: mdi:alert-octagon-outline
    min: 20
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
  codex_alerta_cache_minimo:
    name: Codex - eficiência mínima de cache
    icon: mdi:cached
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
  codex_alerta_saldo_creditos:
    name: Codex - saldo baixo de créditos
    icon: mdi:wallet-outline
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "créditos"
    mode: box

input_text:
  codex_ultimo_alerta_iphone:
    name: Codex - último alerta enviado
    icon: mdi:message-badge-outline
    max: 255

input_datetime:
  codex_ultimo_alerta_iphone_em:
    name: Codex - horário do último alerta
    icon: mdi:clock-check-outline
    has_date: true
    has_time: true

script:
  codex_atualizar_uso_agora:
    alias: Codex - atualizar uso agora
    mode: single
    sequence:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.codex_usage_raw
