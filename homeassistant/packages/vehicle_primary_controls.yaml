input_button:
  vehicle_primary_force_refresh_now:
    name: Forçar atualização do vehicle_primary agora
    icon: mdi:car-connected
  vehicle_primary_lock_now:
    name: Solicitar travamento do vehicle_primary
    icon: mdi:lock
  vehicle_primary_unlock_now:
    name: Solicitar destravamento do vehicle_primary
    icon: mdi:lock-open-variant

template:
  - triggers:
      - trigger: event
        event_type: kia_uvo_api_retry
    sensor:
      - name: Vehicle primary API retry at
        unique_id: vehicle_primary_api_retry_at
        device_class: timestamp
        icon: mdi:api-clock
        state: >-
          {% set retry_at = trigger.event.data.get('retry_at') %}
          {{ retry_at if retry_at not in [none, ''] else none }}
        attributes:
          status: "{{ trigger.event.data.get('status', 'unknown') }}"
          retry_after_seconds: >-
            {{ trigger.event.data.get('retry_after_seconds', 0) | int(0) }}
command_line:
  - sensor:
      name: Integração vehicle_primary
      unique_id: vehicle_primary_integration_maintenance
      command: >-
        sh -c 'test -r /config/.storage/kia_uvo_safe_update &&
        cat /config/.storage/kia_uvo_safe_update ||
        echo "{\"state\":\"unknown\",\"installed_version\":null,\"latest_version\":null}"'
      value_template: "{{ value_json.state | default('unknown') }}"
      json_attributes:
        - installed_version
        - latest_version
        - upstream_commit
        - patch_state
        - conflicts
        - tests
        - checked_at
        - applied_at
        - rollback_at
        - message
      scan_interval: 60
