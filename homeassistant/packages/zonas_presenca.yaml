# Geofences de transporte para atualizacoes do Companion App.
# O anel intermediario (700 m) solicita uma observacao perto do raio do aviso.
# O anel externo (1500 m) oferece um gatilho nos trajetos longos; o interno
# (300 m) oferece outro nos trajetos que permanecem dentro do anel externo.
# Sao zonas ativas para monitoramento de entrada/saida, sem efeito residencial
# direto. A entrega e a precisao da observacao continuam dependentes do iOS.
#
# O anel interno fica dentro do near_home padrao de 350 m e fora do home de
# 100 m. Seus raios nao sao parametros de decisao: localizacao_pessoas no
# Node-RED continua classificando coordenadas frescas, direcao e ciclo externo.
# Um nome bruto de zona, sozinho, nunca comprova aproximacao ou chegada.
# As fontes podem publicar qualquer um destes nomes; consumidores usam somente
# os trackers canonicos. Ver docs/ILUMINACAO_SEGURANCA_NODERED.md.

zone:
  - name: location_update_notification_ring
    latitude: !secret home_latitude
    longitude: !secret home_longitude
    radius: 700
    icon: mdi:map-marker-radius
    passive: false
  - name: location_update_ring
    latitude: !secret home_latitude
    longitude: !secret home_longitude
    radius: 1500
    icon: mdi:car-arrow-right
    passive: false
  - name: location_update_inner_ring
    latitude: !secret home_latitude
    longitude: !secret home_longitude
    radius: 300
    icon: mdi:map-marker-radius
    passive: false
