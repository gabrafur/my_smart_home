# Portão da garagem
#
# O acionamento é um RELÉ DE CONTATO SECO (switch.rele_acionador_portao, Tuya
# TS0001 via zigbee2mqtt) ligado na botoeira (BT) da central do motor.
#
# CADA "ON" É UM PULSO FÍSICO REAL: a central executa a próxima ação do seu
# ciclo (abrir / fechar / parar / inverter). Não há sensor de posição — o estado
# do relé representa SOMENTE o pulso de comando, nunca a posição do portão.
#
# Regra de ouro: um clique => exatamente uma transição OFF -> ON -> OFF.
# Nunca ON -> ON, nunca dois ciclos numa mesma solicitação, nunca retry de ON.
#
# Ver docs/PORTAO_GARAGEM_BOTAO_PULSO.md e docs/PORTAO_GARAGEM_RELE_LOCAL.md.

template:
  - button:
      - name: Acionar Portão da Garagem
        unique_id: portao_garagem_botao_pulso
        icon: mdi:gate-arrow-right
        press:
          # O botão mantém a entidade estável no dashboard. Toda a lógica do
          # pulso mora na aba "garagem" do Node-RED.
          - event: portao_garagem_pulso_solicitado
            event_data:
              action: single
              origem: botao_dashboard

script:
  # LEGADO - acionamento pela cena RF Tuya (nuvem). Mantido para rollback.
  # Não é mais usado pelo Node-RED nem pelo botão novo.
  # ---------------------------------------------------------------------------
  portao_garagem_acionar:
    alias: Portao garagem - acionar (legado - cena RF Tuya)
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('scene.acionar_portao') not in ['unknown', 'unavailable'] }}"
            sequence:
              - service: scene.turn_on
                target:
                  entity_id: scene.acionar_portao
        default:
          - service: persistent_notification.create
            data:
              title: "Erro ao acionar portao da garagem"
              message: >
                A scene RF Tuya scene.acionar_portao nao esta disponivel no
                Home Assistant. Verifique a integracao Tuya e o dispositivo RF.

automation:
  # Rede de segurança: o relé nunca deveria ficar fechado por mais de ~0,7 s.
  # Se ficar (HA reiniciado no meio do pulso, OFF perdido, acionamento manual
  # esquecido no Developer Tools), força a abertura do contato.
  # Esta automação SÓ emite OFF — nunca ON —, então não move o portão.
  - id: portao_garagem_rele_preso_em_on
    alias: Portão garagem - segurança - relé preso em ON
    description: >-
      Abre o contato do relé da botoeira se ele ficar fechado por mais de 5 s.
      Só envia OFF; nunca gera um pulso.
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.rele_acionador_portao
        to: "on"
        for: "00:00:05"
    conditions: []
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.rele_acionador_portao
      - action: logbook.log
        data:
          name: Portão garagem
          entity_id: switch.rele_acionador_portao
          message: >-
            SEGURANÇA - relé estava ON há mais de 5s; contato aberto
            automaticamente (nenhum ON foi enviado).
      - action: persistent_notification.create
        data:
          notification_id: portao_garagem_rele_preso
          title: Portão da garagem - contato ficou fechado
          message: >-
            O relé da botoeira ficou `on` por mais de 5 segundos e foi desligado
            automaticamente. Isso não deveria acontecer num pulso normal
            (~0,7 s) — verifique a aba `garagem` do Node-RED e o zigbee2mqtt.
