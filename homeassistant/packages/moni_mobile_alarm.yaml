alarm_control_panel:
  - platform: moni_mobile
    name: Alarme Moni Mobile
    host: !secret moni_mobile_host
    port: !secret moni_mobile_port
    username: !secret moni_mobile_username
    password: !secret moni_mobile_app_password
    code: !secret moni_mobile_alarm_code

script:
  moni_mobile_atualizar_estado:
    alias: Moni Mobile - atualizar estado
    mode: single
    sequence:
      - service: homeassistant.update_entity
        target:
          entity_id: alarm_control_panel.alarme_moni_mobile

  moni_mobile_armar_via_carplay:
    alias: Alarme Casa - Armar via CarPlay
    icon: mdi:shield-lock
    mode: single
    sequence:
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: alarm_control_panel.alarme_moni_mobile
